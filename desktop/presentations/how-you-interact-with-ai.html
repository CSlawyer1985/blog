<script>
/* =========================================================================
   你和 AI 是如何互动的
   一块画布、一个连续空间。全部画面 = render(G, amb)
     G   ：全局进度。整数 i = 第 i 步的完成态；i-1 → i 之间的小数 = 过渡动画
     amb ：环境时间（秒），只驱动开场、点阵自转、循环光点等氛围动效
   两套版式：land（1920×1080，桌面/投影/横屏）与 port（宽 1080，高随屏幕，手机竖屏）
   移植 Remotion：G = interpolate(frame, 每步起止帧)，amb = frame / fps
   移植 Manim：STEPS 每一项对应一段 self.play(...)；元素关键帧见 kf(G, …)
   ========================================================================= */
(function(){
'use strict';
const FONT='"HSerif","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const IVORY='#F4EDDF', GOLD='#E2AA42', GOLD_HI='#FFD062', PALE='#FFE9B8', DIM='rgba(244,237,223,0.64)', DIM2='rgba(244,237,223,0.42)';

/* ------------------------------ 时间轴 ------------------------------ */
const SCENES=['开场','文本与参数','提问与概率','自回归接龙','纸带与窗口','Agent 的纸带','上下文的构成','管理纸带的机制','Agent Loop','Harness'];
const S=(id,scene,dur,hint)=>({id,scene,dur,hint});
const HC='回到纸带前段：{上下文}由什么组成', HM='管理这根纸带本身的{机制}';
const STEPS=[
 S('title',0,2600,''),
 S('article',1,1800,'先看一段文本'),
 S('tokenize',1,1800,'分词：切成一个个 {token}，模型处理文本的基本单位'),
 S('vectorize',1,2200,'向量化：每个 token 对应{一长串数字}'),
 S('cloud',1,3200,'海量文本训练之后，规律沉淀在模型的{参数}里（示意）'),
 S('question',2,1800,'你提出一个问题'),
 S('q_tokenize',2,1600,'问题同样被切成 {token}，变成向量'),
 S('activate',2,3200,'经过模型逐层计算，{关联}的信息被激活（示意）'),
 S('probs',2,2200,'得到{下一个 token} 的概率分布'),
 S('sample',3,2000,'按概率{采样}，吐出一个 token'),
 S('round2',3,3000,'接在后面，{整串再送进去}'),
 S('autoreg',3,8000,'一个接一个：{自回归}生成'),
 S('tape',4,3000,'摊开来看，就是一根{纸带}'),
 S('window',4,2200,'纸带有长度上限：{上下文窗口}'),
 S('agent',5,3600,'打开 {Agent}：纸带前端已预先装好很多内容'),
 S('ask',5,4400,'你再提问：{整根纸带}一起送进模型'),
 S('agentloop',5,4800,'人和 Agent 的每一轮，都在同一根纸带上{接龙}'),
 S('c_sys',6,3400,HC), S('c_tools',6,1600,HC), S('c_mcp',6,1600,HC), S('c_rules',6,1600,HC),
 S('c_mem',6,1600,HC), S('c_skill',6,2000,HC), S('c_cmd',6,1800,HC), S('c_plan',6,1800,HC),
 S('c_toolres',6,1800,HC), S('c_hist',6,2000,HC),
 S('m_compact',7,3200,HM), S('m_subagent',7,3600,HM), S('m_hooks',7,2600,HM), S('m_perm',7,2400,HM),
 S('loop1',8,3600,'Agent {Loop}：模型生成，Harness 执行'),
 S('loop2',8,2600,'如此循环，直到给出{最终回答}'),
 S('control',9,3000,''), S('harness',9,2600,''), S('final',9,2600,''),
];
const LAST=STEPS.length-1;
const SI={};STEPS.forEach((s,i)=>SI[s.id]=i);

/* ------------------------------ 工具函数 ------------------------------ */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;                    // 元素
const easeCam=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;                // 镜头：起停更柔
const easeOut=t=>1-Math.pow(1-t,3);
const seg=(G,a,b)=>ease(clamp((G-a)/(b-a)));
function kf(G,pts,fn=ease){ if(G<=pts[0][0])return pts[0][1];
  for(let i=0;i<pts.length-1;i++){ if(G<=pts[i+1][0]){const a=pts[i],b=pts[i+1];return lerp(a[1],b[1],fn((G-a[0])/(b[0]-a[0])));} }
  return pts[pts.length-1][1]; }
const bump=(G,c,w)=>clamp(1-Math.abs(G-c)/w);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ------------------------------ 画布与版式 ------------------------------ */
const cv=document.getElementById('c'); const ctx=cv.getContext('2d');
let view={s:1,ox:0,oy:0,dpr:1};
const LY={mode:'land',W:1920,H:1080,k:1,mobile:false};
let PORT=false;
function resize(){
  const w=innerWidth,h=innerHeight,asp=w/h;
  const prevMode=LY.mode;
  if(asp<0.85){LY.mode='port';LY.W=1080;LY.H=Math.round(clamp(1080/asp,1560,2500));LY.k=1;}
  else{LY.mode='land';LY.W=1920;LY.H=1080;LY.k=(h<560)?1.28:(h<760?1.12:1);}
  PORT=LY.mode==='port';
  LY.mobile=PORT||Math.min(w,h)<600||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);

  const x0=1660,x1=1860,y=1058;ctx.fillStyle='rgba(244,237,223,0.15)';ctx.fillRect(x0,y,x1-x0,2);ctx.fillStyle=GOLD;ctx.fillRect(x0,y,(x1-x0)*G/LAST,2);
  text(`${i+1} / ${STEPS.length}`,x0-14-measure(label,18*K)+measure(label,18),1040,18*K,'rgba(244,237,223,0.4)',1,400,'right');}

/* ------------------------------ 交互 ------------------------------ */
let G=0,target=0,anim=null,auto=false,frozenAmb=null;const t0=performance.now();
function go(i){i=clamp(Math.round(i),0,LAST);if(i===target&&!anim)return;const from=G;const fwd=i===Math.round(target)+1&&i>from;
  const dur=fwd?STEPS[i].dur:Math.min(900,350+Math.abs(i-from)*60);target=i;anim={from,to:i,start:performance.now(),dur,linear:fwd};}
function tick(now){ if(anim){const p=clamp((now-anim.start)/anim.dur);G=anim.linear?lerp(anim.from,anim.to,p):lerp(anim.from,anim.to,ease(p));if(p>=1){G=anim.to;anim=null;if(auto&&G<LAST)setTimeout(()=>auto&&go(target+1),700);}}
  render(G,frozenAmb!==null?frozenAmb:(now-t0)/1000);requestAnimationFrame(tick);}
function next(){go(target+1);} function prev(){go(target-1);}
addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'||k==='Enter'||k==='ArrowDown'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'||k==='ArrowUp'){e.preventDefault();prev();}
  else if(k==='Home'){go(0);} else if(k==='End'){go(LAST);}
  else if(k==='f'||k==='F'){toggleFS();}
  else if(k==='a'||k==='A'){auto=!auto;if(auto)next();}});
// 指针与触摸：点击推进；左右滑动前进/后退；鼠标右键后退
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,t:performance.now(),b:e.button,type:e.pointerType};});
cv.addEventListener('pointerup',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;const b=pd.b,type=pd.type;pd=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();return;}
  if(Math.abs(dx)<14&&Math.abs(dy)<14){ if(type==='mouse'){ if(b===2)return; e.shiftKey?prev():next(); } else next(); }});
cv.addEventListener('contextmenu',e=>{e.preventDefault();prev();});
const fsBtn0=document.getElementById('fs');
['touchstart','touchmove','touchend','gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target===fsBtn0)return;if(e.cancelable&&(ev!=='touchstart'))e.preventDefault();},{passive:false}));
const fsBtn=document.getElementById('fs');
const fsSupported=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)&&document.fullscreenEnabled!==false;
function toggleFS(){const d=document,el=d.documentElement;try{
  if(!(d.fullscreenElement||d.webkitFullscreenElement)){(el.requestFullscreen||el.webkitRequestFullscreen).call(el);}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}}catch(err){}}
if(!fsSupported){fsBtn.style.display='none';} // iPhone Safari 不支持网页全屏：隐藏按钮（可“添加到主屏幕”全屏打开）
fsBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleFS();});fsBtn.addEventListener('pointerdown',e=>e.stopPropagation());
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200));

window.HL={STEPS,SCENES,render:(g,a)=>render(g,a),seek:(g,a)=>{anim=null;G=g;target=Math.round(g);if(a!==undefined)frozenAmb=a;render(G,frozenAmb??0);},go,get G(){return G;},get mode(){return LY.mode;},
  perf:(g,n=30)=>{const t=performance.now();for(let i=0;i<n;i++)render(g,i*0.03);return (performance.now()-t)/n;}};
resize();
const fontsReady=document.fonts?Promise.all([document.fonts.load(font(40,400),'纸带token'),document.fonts.load(font(40,700),'纸带Harness')]):Promise.resolve();
fontsReady.catch(()=>{}).then(()=>{fontsOK=true;mcache.clear();computeLayout();
  const m=location.search.match(/step=(\d+)/);if(m){G=target=clamp(+m[1],0,LAST);}
  window.HL.ready=true;requestAnimationFrame(tick);});
})();
