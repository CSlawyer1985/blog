function upd(G,dt){if(G<SI.drag-0.01)docOn=0;else if(G<=SI.drag+0.0001)docOn=damp(docOn,docTarget,dt,9);else docOn=Math.max(docOn>0.99?1:0,lerp(docTarget,1,seg(G,SI.drag,SI.ground-0.4)));}
LE.run({steps:STEPS,scenes:SCENES,render:(G,amb,dt)=>{upd(G,dt);render(G,amb,dt);},drags,onGo:i=>{if(i<=SI.drag){docTarget=0;docUser=null;}},onSeek:(g,st)=>{docTarget=st.doc?1:0;docUser=null;docOn=g>=SI.ground?1:docTarget;}});
})();

</script></body></html>
