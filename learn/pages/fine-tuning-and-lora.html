  if(ord>0.01){const st=[['① 提示词 / Skill','先把要求、流程、模板写清楚','gold'],['② 检索（RAG / 搜索 / Grep）','把最新资料、本案材料放上纸带','hot'],['③ 微调 / LoRA','仍不够，且有大量高质量示范数据时再做','ice']];
    st.forEach((s,k)=>{const e=seg(ord,k*0.15,0.5+k*0.15)*fin;const x=P?90:300+k*200,y=P?H*0.3+k*300:300+k*170,w=P?900:1000;card(x,y,w,P?220:140,{a:e,stroke:k===0?GOLD_HI:undefined});
      glowText(s[0],x+30,y+(P?60:48),P?34:30,k===2?ICE:GOLD_HI,e,700,0.3,'left');rich(s[1],x+30,y+(P?130:98),P?26:22,e,{align:'left',maxW:w-60,valign:'top'});});}
  LE.finale(['{微调}：用示范数据算损失、反向改权重，改的是{写法与习惯}','{LoRA}：冻结 W，只训练细旁路 BA，参数量小、可{热插拔}','会变的事实交给{检索}放上纸带，流程交给 {Skill}；最后才考虑微调'],seg(G,LAST-0.8,LAST),'4096 × 4096 与 r = 8 时 65,536（约 0.39%）为算术示例；实际 LoRA 还有缩放系数等细节。示范数据、损失值为示意。');}
function dragTrack(){const g=geo();return g.P?{x0:150,x1:930,y:g.data.y+330}:{x0:1320,x1:1800,y:900};}
const drags=[{step:'drag',cursor:'ew-resize',hit:pt=>{const t=dragTrack();return pt.x>t.x0-50&&pt.x<t.x1+50&&Math.abs(pt.y-t.y)<60;},move:pt=>{const t=dragTrack();rUser=Math.pow(2,clamp((pt.x-t.x0)/(t.x1-t.x0))*6);}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{rUser=null;},onSeek:(g,st)=>{rUser=st.r??null;if(rUser!=null)rDisp=rUser;}});
})();
