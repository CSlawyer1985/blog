<style>

<canvas id="c"></canvas><button id="fs" title="全屏（F）">全屏 F</button>
<script>
(function(){
'use strict';
const FONT='"HSerif","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const IVORY='#F4EDDF', GOLD='#E2AA42', GOLD_HI='#FFD062', PALE='#FFE9B8', DIM='rgba(244,237,223,0.62)', RED='#E86A58', GREEN='#4FD198';

const SCENES=['开场','单轨瓶颈','裂变多轨','独立并行','红蓝质检','汇流终稿'];
const S=(id,scene,dur,hint)=>({id,scene,dur,hint});
const STEPS=[
  S('title',0,2600,''),
  S('single_in',1,2000,'当任务升级为「{股权并购尽调}」：工商、合同、财务、诉讼交织在一起'),
  S('single_jam',1,2400,'全塞进同一根纸带？单智能体瞬间{上下文过载}，互相干扰、顾此失彼'),
  S('orch_rise',2,2400,'破局：引入{主控编排器 (Orchestrator)}，把庞大任务按专业维度拆解'),
  S('split_tracks',2,2600,'单轨裂变为 {3 条独立并行子纸带}：主体工商、合同风控、财务税务'),
  S('parallel_run',3,2600,'每个子智能体拥有{专属上下文窗口与工具}，并行推进、脏数据互不污染'),
  S('summary_out',3,2400,'任务结束时，各轨道只向后吐出{一页高纯度摘要}，把海量原始文件留在各自轨内'),
  S('critic_gate',4,2600,'推近右侧：在交付前设一道{红蓝对抗质检闸门 (Critic Agent)}'),
  S('critic_reject',4,2800,'质检发现轨道②漏查了隐性担保！闸门亮红，直接{打回重做 (Loopback)}'),
  S('critic_pass',4,2400,'轨道②补查修复后再次提交，三轨全部通过校验，{闸门转绿放行}'),
  S('merge_final',5,2600,'三路精炼摘要汇流，由主控汇总成最终交付：《{并购法律尽调终稿}》'),
  S('tradeoff',5,2600,'拉远看全局：Multi-Agent 用{更多 Token 与耗时}，换取上下文纯净度与能力上限'),
  S('final',5,2600,''),
];
const LAST=STEPS.length-1;

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeCam=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;
const seg=(G,a,b)=>ease(clamp((G-a)/(b-a)));
function kf(G,pts,fn=ease){if(G<=pts[0][0])return pts[0][1];for(let i=0;i<pts.length-1;i++){if(G<=pts[i+1][0]){const a=pts[i],b=pts[i+1];return lerp(a[1],b[1],fn((G-a[0])/(b[0]-a[0])));}}return pts[pts.length-1][1];}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ==================== 画布与原版光学贴图 ==================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1920, H=1080; let view={s:1,ox:0,oy:0,dpr:1};
function resize(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';
  const s=Math.min(w/W,h/H);view={s,ox:(w-W*s)/2,oy:(h-H*s)/2,dpr};
}
addEventListener('resize',resize); resize();

const mcache=new Map();
function font(sz,wt=400){return `${wt} ${sz}px ${FONT}`;}
function measure(t,sz,wt=400){const k=t+'|'+wt;let v=mcache.get(k);if(v===undefined){ctx.font=font(100,wt);v=ctx.measureText(t).width/100;mcache.set(k,v);}return v*sz;}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function text(str,x,y,sz,col,a=1,wt=400,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.font=font(sz,wt);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(str,x,y);ctx.globalAlpha=prev;
}
function glowText(str,x,y,sz,col,a=1,wt=700,blur=0.45,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  ctx.save();ctx.shadowColor='rgba(255,186,60,0.6)';ctx.shadowBlur=sz*blur;text(str,x,y,sz,col,a,wt,al);ctx.restore();
}
function rich(str,x,y,sz,a=1,col=IVORY){
  if(ctx.globalAlpha*clamp(a)<=0.004||!str)return;
  const parts=[];str.split(/(\{[^}]*\})/).forEach(s=>{if(!s)return;if(s[0]==='{')parts.push([s.slice(1,-1),1]);else parts.push([s,0]);});
  let tw=0;parts.forEach(p=>{p[2]=measure(p[0],sz,p[1]?700:400);tw+=p[2];});let x0=x-tw/2;
  parts.forEach(p=>{if(p[1])glowText(p[0],x0,y,sz,GOLD_HI,a,700,0.45,'left');else text(p[0],x0,y,sz,col,a,400,'left');x0+=p[2];});
}
function brandMark(x,y,sz,a=1){
  if(ctx.globalAlpha*clamp(a)<=0.004)return;
  const s1='陈石律师',s2='  ·  ',s3='chenshi.ai';
  const w1=measure(s1,sz*0.8),w2=measure(s2,sz*0.8),w3=measure(s3,sz,700),tw=w1+w2+w3;let x0=x-tw/2;
  text(s1,x0,y,sz*0.8,IVORY,a*0.78,400,'left');x0+=w1;text(s2,x0,y,sz*0.8,GOLD,a*0.8,400,'left');x0+=w2;glowText(s3,x0,y,sz,GOLD_HI,a,700,0.3,'left');
  const L1=sz*2.2,gap=sz*0.9;ctx.save();ctx.globalAlpha*=a*0.7;
  [[x-tw/2-gap-L1,x-tw/2-gap,0],[x+tw/2+gap,x+tw/2+gap+L1,1]].forEach(([u,v,dir])=>{const g=ctx.createLinearGradient(u,0,v,0);g.addColorStop(dir?1:0,'rgba(226,170,66,0)');g.addColorStop(dir?0:1,'rgba(226,170,66,0.9)');ctx.fillStyle=g;ctx.fillRect(u,y-0.75,v-u,1.5);});
  ctx.restore();
}

function mkSprite(stops){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const SPR_HALO=mkSprite([[0,'rgba(255,228,170,0.9)'],[0.12,'rgba(255,196,96,0.55)'],[0.4,'rgba(226,150,46,0.16)'],[1,'rgba(200,120,30,0)']]);
const SPR_CORE=mkSprite([[0,'rgba(255,250,235,1)'],[0.25,'rgba(255,226,160,0.9)'],[0.6,'rgba(255,190,80,0.25)'],[1,'rgba(255,170,60,0)']]);
const SPR_RED =mkSprite([[0,'rgba(255,195,185,0.9)'],[0.2,'rgba(232,106,88,0.5)'],[1,'rgba(180,40,30,0)']]);
const SPR_GRN =mkSprite([[0,'rgba(180,255,220,0.9)'],[0.2,'rgba(79,209,152,0.5)'],[1,'rgba(20,120,80,0)']]);
function glow(x,y,r,a=1,spr=SPR_HALO){const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||r<=0.5)return;const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.drawImage(spr,x-r,y-r,2*r,2*r);ctx.globalAlpha=prev;}
function core(x,y,r,a=1){glow(x,y,r,a,SPR_CORE);}

const FIBER=(()=>{const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d'),r=mulberry(7);
  for(let i=0;i<900;i++){const x=r()*512,y=r()*128,l=6+r()*40;g.strokeStyle=`rgba(255,215,150,${0.015+r()*0.04})`;g.lineWidth=0.6+r()*0.8;g.beginPath();g.moveTo(x,y);g.lineTo(x+l,y+(r()-0.5)*3);g.stroke();}return c;})();
let FIBER_PAT=null;
const DUST=(()=>{const r=mulberry(2029);return Array.from({length:65},()=>({x:r(),y:r(),vx:(r()-0.5)*0.004,vy:-0.003-r()*0.006,r:1.2+r()*2.6,a:0.1+r()*0.25,ph:r()*6.28}));})();

function drawMiniTape(x,y,w,h,amb,danger=0,ok=0){
  ctx.save();
  const tgr=ctx.createLinearGradient(0,y-h/2,0,y+h/2);
  if(danger>0.3){tgr.addColorStop(0,'rgba(130,34,26,0.75)');tgr.addColorStop(0.5,'rgba(45,14,12,0.82)');tgr.addColorStop(1,'rgba(130,34,26,0.75)');}
  else if(ok>0.3){tgr.addColorStop(0,'rgba(22,86,58,0.68)');tgr.addColorStop(0.5,'rgba(10,36,24,0.78)');tgr.addColorStop(1,'rgba(22,86,58,0.68)');}
  else{tgr.addColorStop(0,'rgba(78,56,20,0.72)');tgr.addColorStop(0.5,'rgba(24,17,7,0.78)');tgr.addColorStop(1,'rgba(78,56,20,0.72)');}
  ctx.fillStyle=tgr;ctx.fillRect(x,y-h/2,w,h);
  if(!FIBER_PAT)FIBER_PAT=ctx.createPattern(FIBER,'repeat');
  ctx.fillStyle=FIBER_PAT;ctx.fillRect(x,y-h/2,w,h);
  ctx.strokeStyle=danger>0.3?RED:(ok>0.3?GREEN:'rgba(236,184,78,0.9)');ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(x,y-h/2);ctx.lineTo(x+w,y-h/2);ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke();
  for(let hx=x+16;hx<x+w-10;hx+=32){[y-h/2+7,y+h/2-7].forEach(hy=>{ctx.fillStyle='#030303';ctx.fillRect(hx-1.8,hy-1.8,3.6,3.6);});}
  ctx.restore();
}

const TRACKS=[
  {name:'轨道 ① · 主体工商 Agent', sub:'查股权穿透 / 实控人 / 行政处罚', sum:'主体摘要', y:310},
  {name:'轨道 ② · 合同风控 Agent', sub:'审对赌条款 / 隐性担保 / 违约金', sum:'风控摘要', y:540, isCriticTarget:true},
  {name:'轨道 ③ · 财务税务 Agent', sub:'核营收真实性 / 应收账款 / 税务', sum:'财税摘要', y:770},
];

/* ============================== 主渲染 ============================== */
function render(G,amb){
  const {s,ox,oy,dpr}=view;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(s*dpr,0,0,s*dpr,ox*dpr,oy*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.fillStyle='#030303';ctx.fillRect(0,0,W,H);

  // 背景暖光 + 金尘
  const bg=ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,960);
  bg.addColorStop(0,'rgba(128,84,22,0.16)');bg.addColorStop(0.55,'rgba(60,38,10,0.05)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  DUST.forEach(d=>{const dx=((d.x+amb*d.vx)%1+1)%1*W,dy=((d.y+amb*d.vy)%1+1)%1*H;glow(dx,dy,d.r*3,d.a*(0.55+0.45*Math.sin(amb*1.4+d.ph)));});
  ctx.restore();

  /* ---------- 0. 原版复刻级开场 (0 -> 0.55) ---------- */
  const a0=1-seg(G,0.02,0.55);
  if(a0>0.005){
    const intro=clamp(amb/2.4), out=seg(G,0.02,0.55);
    const title='Multi-Agent 到底是什么', fs=96, tw=measure(title,fs,700);
    let x=W/2-tw/2; const rnd=mulberry(12); let ci=0;
    ctx.save();
    for(const ch of title){
      const cw=measure(ch,fs,700), ca=seg(intro,0.08+ci*0.028,0.34+ci*0.028);
      const dx=(rnd()-0.5)*220*out, dy=-(35+rnd()*140)*out;
      glowText(ch,x+cw/2+dx,445+(1-ca)*24+dy,fs,PALE,ca*(1-out),700,0.35);
      x+=cw; ci++;
    }
    const sw=((amb*0.18)%1.6)-0.3;
    if(intro>0.85&&out<0.4){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const gx=W/2-tw/2+sw*tw, g=ctx.createLinearGradient(gx-160,0,gx+160,0);
      g.addColorStop(0,'rgba(255,240,200,0)');g.addColorStop(0.5,'rgba(255,240,200,0.55)');g.addColorStop(1,'rgba(255,240,200,0)');
      ctx.font=font(fs,700);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=g;ctx.globalAlpha=1-out*2.5;ctx.fillText(title,W/2-tw/2,445);ctx.restore();
    }
    const lw=840*seg(intro,0.28,0.82)*(1-out);
    ctx.globalCompositeOperation='lighter';
    const lg=ctx.createLinearGradient(W/2-lw/2,0,W/2+lw/2,0);lg.addColorStop(0,'rgba(255,200,90,0)');lg.addColorStop(0.5,`rgba(255,214,120,${0.95*(1-out)})`);lg.addColorStop(1,'rgba(255,200,90,0)');
    ctx.fillStyle=lg;ctx.fillRect(W/2-lw/2,540,lw,2);glow(W/2,541,60,0.7*(1-out));ctx.globalCompositeOperation='source-over';
    rich('从单轨堵死，到{并行多轨}与{红蓝对抗质检闸门}',W/2,605,32,seg(intro,0.55,1)*(1-out),DIM);
    brandMark(W/2,870,28,seg(intro,0.7,1)*(1-out));
    ctx.restore();
  }

  /* ---------- 1~5. 连续摄影机物理世界 (G >= 0.45) ---------- */
  const worldA=seg(G,0.45,1.0);
  if(worldA>0.005){
    // 五次方运镜：Step 7-9 推近右侧质检闸门，Step 10 起拉远看完整交响架构
    const camX = kf(G,[[1,960],[6,960],[7,1280],[9,1280],[10,960],[12,960]], easeCam);
    const camY = kf(G,[[1,540],[6,540],[7,540],[9,540],[10,540],[12,540]], easeCam);
    const camZ = kf(G,[[1,1.0],[6,1.0],[7,1.24],[9,1.24],[10,0.95],[12,0.92]], easeCam);

    const pJam    = seg(G,1.2,2.0)*(1-seg(G,2.3,3.0)); // 单轨红光堵死
    const pOrch   = seg(G,2.2,3.0);                    // 主控编排器升起
    const pSplit  = seg(G,3.2,4.0);                    // 单轨裂变为 3 条并行子纸带
    const pRun    = seg(G,4.2,5.0);                    // 三轨并行脉冲
    const pSum    = seg(G,5.2,6.0);                    // 吐出精炼摘要
    const pCritic = seg(G,6.2,7.0);                    // 质检闸门降下
    const pReject = seg(G,7.2,8.0)*(1-seg(G,8.3,9.0)); // 打回重做红光
    const pPass   = seg(G,8.2,9.0);                    // 修复通过转绿
    const pMerge  = seg(G,9.2,10.0);                   // 汇流成终稿
    const pTrade  = seg(G,10.3,11.0);                  // 工程权衡提示
    const pFin    = seg(G,11.3,12.0);

    ctx.save();ctx.globalAlpha=worldA;
    ctx.translate(W/2,H/2);ctx.scale(camZ,camZ);ctx.translate(-camX,-camY);

    const orchX = 240, trackX0 = 500, trackW = 660, gateX = 1360, finalX = 1690;

    // 1. 左侧：主控编排器星核（Orchestrator，Step 3 起显现）
    if(pOrch>0.01){
      ctx.save();ctx.globalAlpha*=pOrch;
      ctx.globalCompositeOperation='lighter';
      glow(orchX,540,120*(1+0.08*Math.sin(amb*2)),0.65);
      core(orchX,540,34,0.95);
      ctx.globalCompositeOperation='source-over';
      ctx.strokeStyle=GOLD_HI;ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(orchX,540,42,0,Math.PI*2);ctx.stroke();
      glowText('主控编排器',orchX,615,24,GOLD_HI,1,700,0.35);
      text('Orchestrator',orchX,645,15,DIM,1);
      ctx.restore();
    }

    // 2. 单轨 -> 裂变 3 条并行子纸带（恒存变形！）
    const shake = pJam>0.2 ? Math.sin(amb*42)*8*pJam : 0;
    TRACKS.forEach((tr, i) => {
      // 未裂变前，3 条轨道重合在 y=540；裂变后平滑展开到 310 / 540 / 770
      const y = lerp(540, tr.y, pSplit);
      const x = lerp(360, trackX0, pSplit) + shake;
      const w = lerp(1200, trackW, pSplit);
      const h = lerp(136, 108, pSplit);
      // 未裂变时只画中间那条，避免重影
      if(pSplit < 0.02 && i !== 1) return;
      const a = (i === 1) ? 1 : pSplit;

      const isRej = tr.isCriticTarget && pReject > 0.1;
      const isOk  = pPass > 0.3;

      ctx.save();ctx.globalAlpha *= a;
      // 编排器到子纸带的分发光缆
      if(pSplit > 0.1){
        ctx.strokeStyle = isRej ? RED : GOLD; ctx.lineWidth = isRej ? 2.4 : 1.6;
        ctx.beginPath();ctx.moveTo(orchX+44,540);ctx.bezierCurveTo(360,540,380,y,x,y);ctx.stroke();
      }

      // 子纸带本体
      drawMiniTape(x, y, w, h, amb, Math.max(pJam, isRej ? pReject : 0), isOk ? pPass : 0);

      // 轨道内部文字
      if(pSplit < 0.35){
        text(pJam>0.3 ? '⚠ 单轨过载：工商 + 合同 + 财务 + 诉讼全部混在一起，上下文爆满！' : '单一纸带（承接整个「股权并购尽调」任务）', x+w/2, y, 22, pJam>0.3?RED:PALE, 1-pSplit*2.8, 700);
      } else {
        const ta = seg(pSplit, 0.35, 1);
        text(tr.name, x+24, y-16, 20, isRej?RED:(isOk?GREEN:GOLD_HI), ta, 700, 'left');
        text(isRej ? '⚠ 质检打回：补查隐性对外担保条款…' : tr.sub, x+24, y+18, 15, isRej?RED:DIM, ta, 400, 'left');
      }

      // 并行高速运行光点（Step 5）
      if(pRun > 0.05 && pSplit > 0.8){
        const pt = ((amb * (0.45 + i*0.08)) % 1);
        const px = x + 20 + pt * (w - 40);
        ctx.globalCompositeOperation='lighter';
        glow(px, y, 26, pRun*0.85, isRej?SPR_RED:(isOk?SPR_GRN:SPR_HALO));
        ctx.globalCompositeOperation='source-over';
      }

      // 向后吐出 1 页摘要光缆 -> 质检闸门（Step 6-7）
      if(pSum > 0.05){
        const sx1 = x + w, sx2 = gateX - 42;
        ctx.strokeStyle = isRej ? RED : (isOk ? GREEN : GOLD_HI);
        ctx.lineWidth = isRej ? 2.6 : 1.8;
        ctx.beginPath();ctx.moveTo(sx1, y);ctx.lineTo(lerp(sx1, sx2, pSum), y);ctx.stroke();
        if(pSum > 0.6){
          rr(sx1+24, y-20, 118, 40, 6);ctx.fillStyle='rgba(14,12,6,0.92)';ctx.fill();ctx.strokeStyle=isRej?RED:(isOk?GREEN:GOLD);ctx.lineWidth=1.4;ctx.stroke();
          text(tr.sum, sx1+83, y, 15, isRej?RED:(isOk?GREEN:PALE), (pSum-0.6)/0.4, 700);
        }
      }

      // 打回重做红色回溯弧线（Step 8，仅轨道②）
      if(tr.isCriticTarget && pReject > 0.05){
        ctx.save();ctx.globalAlpha *= pReject;
        ctx.strokeStyle = RED; ctx.lineWidth = 3; ctx.setLineDash([8,6]); ctx.lineDashOffset = amb*45;
        ctx.beginPath();ctx.moveTo(gateX-42, y-32);ctx.quadraticCurveTo(1060, y-130, x+w/2, y-h/2-6);ctx.stroke();ctx.setLineDash([]);
        text('↺ 发现遗漏 · 打回重做 (Critic Loop)', 1060, y-102, 18, RED, 1, 700);
        ctx.restore();
      }
      ctx.restore();
    });

    // 3. 右侧：红蓝对抗质检闸门（Critic Gate，Step 7 起显现）
    if(pCritic > 0.01){
      const col = pReject > 0.2 ? RED : (pPass > 0.3 ? GREEN : GOLD_HI);
      ctx.save();ctx.globalAlpha *= pCritic;
      rr(gateX-42, 235, 84, 610, 14);
      ctx.fillStyle = pReject>0.2 ? 'rgba(85,20,16,0.75)' : (pPass>0.3 ? 'rgba(14,62,42,0.75)' : 'rgba(26,20,8,0.88)');
      ctx.fill();ctx.strokeStyle = col;ctx.lineWidth = 2.6;ctx.stroke();
      ctx.globalCompositeOperation='lighter';
      glow(gateX, 540, 140, 0.45, pReject>0.2?SPR_RED:(pPass>0.3?SPR_GRN:SPR_HALO));
      ctx.globalCompositeOperation='source-over';
      // 竖排文字
      ['质','检','闸','门'].forEach((ch,idx)=>glowText(ch, gateX, 465+idx*46, 26, col, 1, 700, 0.35));
      text('Critic Agent', gateX, 205, 18, col, 1, 700);
      if(pPass > 0.4) text('✓ 全部通过', gateX, 875, 18, GREEN, pPass, 700);
      else if(pReject > 0.3) text('✕ 拦截打回', gateX, 875, 18, RED, pReject, 700);
      ctx.restore();
    }

    // 4. 最右侧：汇流终稿星核（Step 10 起显现）
    if(pMerge > 0.01){
      ctx.save();ctx.globalAlpha *= pMerge;
      TRACKS.forEach(tr => {
        ctx.strokeStyle = GREEN; ctx.lineWidth = 2;
        ctx.beginPath();ctx.moveTo(gateX+42, tr.y);ctx.bezierCurveTo(1520, tr.y, 1520, 540, finalX-115, 540);ctx.stroke();
      });
      rr(finalX-115, 465, 230, 150, 14);ctx.fillStyle='rgba(36,26,10,0.92)';ctx.fill();ctx.strokeStyle=GOLD_HI;ctx.lineWidth=2.6;ctx.stroke();
      ctx.globalCompositeOperation='lighter';glow(finalX,540,140,0.45);ctx.globalCompositeOperation='source-over';
      glowText('并购尽调终稿', finalX, 520, 25, PALE, 1, 700, 0.4);
      text('三轨交叉核验 · 交付', finalX, 565, 15, GREEN, 1, 700);
      ctx.restore();
    }

    // 5. 底部工程权衡注脚（Step 11）
    if(pTrade > 0.02){
      text('核心权衡：Multi-Agent 并非越复杂越好 — 仅当单条纸带装不下、或需要角色隔离质检时才启用', W/2, 950, 21, DIM, pTrade*(1-pFin*0.8));
    }

    ctx.restore(); // 结束摄影机变换
  }

  /* ---------- 终局收束落版 (Step 12) ---------- */
  const finA=seg(G,11.4,12.0);
  if(finA>0.01){
    ctx.save();ctx.globalAlpha=finA;
    rich('单智能体拼模型上限，{Multi-Agent} 拼上下文隔离与工程编排',W/2,92,34,1,IVORY);
    brandMark(W/2,990,26,1);
    ctx.restore();
  }

  /* ---------- 顶部引导语（先退后进，零叠字） & 右下角进度 ---------- */
  const lo=Math.floor(G), hi=Math.min(LAST,Math.ceil(G)), f=G-lo;
  const ha=STEPS[lo].hint, hb=STEPS[hi].hint;
  if(ha===hb) rich(ha,W/2,92,34,0.95);
  else {
    const aOut=1-ease(clamp(f/0.38)), aIn=ease(clamp((f-0.5)/0.42));
    if(aOut>0.01) rich(ha,W/2,92-(1-aOut)*10,34,0.95*aOut);
    if(aIn>0.01) rich(hb,W/2,92+(1-aIn)*10,34,0.95*aIn);
  }
  const st=STEPS[Math.round(G)];
  text(`${String(st.scene).padStart(2,'0')} · ${SCENES[st.scene]}    ${Math.round(G)+1} / ${STEPS.length}`,1860,1040,18,'rgba(244,237,223,0.52)',1,400,'right');
  ctx.fillStyle='rgba(244,237,223,0.16)';ctx.fillRect(1660,1058,200,2);
  ctx.fillStyle=GOLD;ctx.fillRect(1660,1058,200*G/LAST,2);
  ctx.restore();
}

/* ==================== 交互（与原版完全一致） ==================== */
let G=0, target=0, anim=null, auto=false; const t0=performance.now();
function go(i){
  i=clamp(Math.round(i),0,LAST);if(i===target&&!anim)return;
  const from=G, fwd=i===Math.round(target)+1&&i>from;
  target=i;anim={from,to:i,start:performance.now(),dur:fwd?STEPS[i].dur:Math.min(850,350+Math.abs(i-from)*60),linear:fwd};
}
function next(){go(target+1);} function prev(){go(target-1);}
function tick(now){
  if(anim){
    const p=clamp((now-anim.start)/anim.dur);
    G=anim.linear?lerp(anim.from,anim.to,p):lerp(anim.from,anim.to,ease(p));
    if(p>=1){G=anim.to;anim=null;if(auto&&G<LAST)setTimeout(()=>auto&&go(target+1),700);}
  }
  render(G,(now-t0)/1000);requestAnimationFrame(tick);
}
addEventListener('keydown',e=>{
  if(e.target.id==='lesson-back')return;

  const k=e.key;
  if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();prev();}
  else if(k==='Home')go(0); else if(k==='End')go(LAST);
  else if(k==='f'||k==='F')toggleFS();
  else if(k==='a'||k==='A'){auto=!auto;if(auto)next();}
});
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,b:e.button};});
cv.addEventListener('pointerup',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y,b=pd.b;pd=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();return;}
  if(Math.abs(dx)<14&&Math.abs(dy)<14){if(b===2)prev();else e.shiftKey?prev():next();}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();prev();});
const fsBtn=document.getElementById('fs');
function toggleFS(){const d=document,el=d.documentElement;if(!d.fullscreenElement)el.requestFullscreen?.();else d.exitFullscreen?.();}
fsBtn.addEventListener('pointerdown',e=>e.stopPropagation());
fsBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleFS();});

requestAnimationFrame(tick);
})();
</script></body></html>
