<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">

<meta name="description" content="推理模型先在同一根纸带上写思考 token、自我检查，再作答；界面为什么把思考折叠；思考预算怎么取舍。以违约金调整为例。">

<script>
// @title Reasoning 深度思考 · 同一根纸带上的「草稿」
// @desc 推理模型先在同一根纸带上写思考 token、自我检查，再作答；界面为什么把思考折叠；思考预算怎么取舍。以违约金调整为例。
(function(){'use strict';
const {C,LY,ctx,clamp,lerp,ease,seg,kf,lin,bump,damp,text,glowText,rich,measure,rr,glow,glowAdd,card,block,tape,line,S}=LE;
const {IVORY,GOLD,GOLD_HI,PALE,DIM,DIM2,RED,GREEN,PURPLE}=C;
const SCENES=['开场','快答的坑','写下思考','自我检查','作答','折叠','思考预算','收束'];
const STEPS=[
 S('title',0,2600,''),
 S('q',1,2400,'一道带坑的题：合同约定高额违约金，还约定「{不得请求调减}」——法院还能调吗？'),
 S('fast',1,2600,'直接作答：顺着字面接龙，容易答成「{约定有效，不能调}」'),
 S('think',2,3000,'推理模型：先在{同一根纸带}上写一段思考 token，再作答'),
 S('wrong',3,3200,'思考时可以{自我检查}：发现这条思路与司法解释冲突，推翻重来'),
 S('cite',3,3600,'换一条路，逐条核对：{第64条第3款}、第65条第2款、民法典第585条'),
 S('answer',4,2800,'想清楚再落笔：{回答}接在思考之后，写在同一根纸带上'),
 S('fold',5,3000,'思考和回答都是模型生成的 token；聊天界面通常把思考{折叠}，或只显示摘要'),
 S('cost',5,2600,'思考 token 也要{计费}（按输出 token），也会让回答变慢'),
 S('drag',6,1800,'{拖动}思考段的末端，调整思考预算（曲线为示意）',true),
 S('rule',6,2800,'工程心法：简单任务快答省钱，{复杂推理与风险审查}再开深度思考'),
 S('final',7,3200,''),
];
const SI={};STEPS.forEach((s,i)=>SI[s.id]=i);const LAST=STEPS.length-1;
const Q='合同约定违约金远高于实际损失，并写明「不得请求调减」。违约方还能请求法院调减吗？';
const FAST='约定有效，不能调减。';
const ANS='能。该约定挡不住调整；是否调减，看违约金是否{过分高于损失}。';
const TH=[
 ['先拆问题：这条「不得调减」的约定，能不能排除法院调整？','n',SI.think-0.75,SI.think-0.15],
 ['直觉：契约自由，约定有效，所以不能调？','x',SI.wrong-0.9,SI.wrong-0.6],
 ['检查：这与司法解释冲突——此路不通，推翻。','r',SI.wrong-0.5,SI.wrong-0.1],
 ['《合同编通则解释》第64条第3款：仅以约定不得调整为由主张不予调整的，法院不予支持。','c',SI.cite-0.95,SI.cite-0.7],
 ['第65条第2款：超过造成损失的 30%，一般可以认定为「过分高于」。','c',SI.cite-0.6,SI.cite-0.38],
 ['民法典第585条第2款：过分高于损失的，可请求法院适当减少。','c',SI.cite-0.32,SI.cite-0.08],
 ['结论：约定不影响请求调减；关键看是否过分高于损失。','g',SI.answer-0.85,SI.answer-0.6],
];
let bUser=null,bDisp=null;
const hard=b=>0.25+0.6*(1-Math.exp(-3.2*b)),easy=b=>0.88+0.05*b;
function geo(G){const P=LY.port,H=LY.H;
  if(!P){const up=kf(G,[[SI.answer,0],[SI.fold,1],[SI.cost,1],[SI.drag,0]]);return{P,a0:80,c:lerp(650,440,up),th:190,bh:150,qL:420,maxT:820,aL:520,gap:14,panel:{x:250,y:170,w:1420,h:330},ui:{x:430,y:600,w:1060,h:330}};}
  const maxT=Math.max(400,Math.min(740,H-420-250-230-560));
  return{P,a0:420,c:540,th:1000,bh:940,qL:250,maxT,aL:230,gap:14,ui:{x:90,y:420+250+maxT+230+70,w:900,h:400}};}
function R(g,a0,a1){return g.P?[g.c-g.bh/2,g.a0+a0,g.bh,a1-a0]:[g.a0+a0,g.c-g.bh/2,a1-a0,g.bh];}
function render(G,amb,dt){const W=LY.W,H=LY.H,P=LY.port;const g=geo(G);
  const zq=P?1:LE.kf(G,[[0.6,1.38],[SI.q,1.38],[SI.fast,1.22],[SI.think-0.5,1]]);const ext=P?0:LE.kf(G,[[SI.q,g.qL],[SI.fast,g.qL+g.gap+g.aL],[SI.think-0.5,1760]]);
  const cam={x:P?540:lerp(960,g.a0+ext/2,clamp((zq-1)/0.22)),y:P?H/2:lerp(540,g.c,clamp((zq-1)/0.22)),z:zq};
  LE.bg(amb,(cam.x-960)*0.5,P?0:(g.c-650));
  LE.title('Reasoning 深度思考','思考写在{同一根纸带}上，只是对你{折叠}了',LE.easeOut(clamp(amb/1.8)),seg(G,0.05,0.6),{portLines:['Reasoning','深度思考']});
  if(G<0.25)return;const inA=seg(G,0.3,1);ctx.save();LE.camera(cam.x,cam.y,cam.z);
  let bT=kf(G,[[SI.fast,0],[SI.think,0.35],[SI.wrong,0.6],[SI.cite,0.92],[SI.answer,1],[SI.drag,1]]);
  if(LE.isAt('drag')&&bUser!=null)bT=bUser;bDisp=bDisp==null?bT:damp(bDisp,bT,dt,14);if(!LE.isAt('drag')||bUser==null)bDisp=bT;
  const tl=g.maxT*bDisp;
  const fastA=seg(G,SI.fast-0.7,SI.fast-0.2)*(1-seg(G,SI.fast+0.05,SI.fast+0.4));const ansA=seg(G,SI.answer-0.55,SI.answer-0.1);
  const qa=[0,g.qL],ta=[g.qL+g.gap,g.qL+g.gap+tl],aa=[ta[1]+(tl>1?g.gap:0),ta[1]+(tl>1?g.gap:0)+g.aL];
  const grow=Math.max(fastA*(g.qL+g.gap+g.aL)/aa[1],seg(G,SI.think-0.9,SI.think-0.6));
  tape(g.a0-24,g.a0+Math.max(g.qL+30,lerp(g.qL,aa[1],grow))+24,g.c,g.th,{vert:P,a:inA});
  {const [x,y,w,h]=R(g,qa[0],qa[1]);const a=inA*seg(G,0.5,1);block(x,y,w,h,{style:'gold',a});
    text('用户提问',x+(P?36:22),y+(P?40:24),P?26:18,DIM,a,400,'left');rich(Q,x+w/2,y+h/2+(P?18:12),P?32:19,a,{maxW:w-(P?60:40),lh:P?46:27});}
  if(fastA>0.01){const [x,y,w,h]=R(g,qa[1]+g.gap,qa[1]+g.gap+g.aL);block(x,y,w,h,{style:'red',a:fastA});text('直接作答',x+(P?36:22),y+(P?40:24),P?26:18,DIM,fastA,400,'left');
    glowText(FAST,x+w/2,y+h/2+(P?14:10),P?40:28,RED,fastA,700,0.3);text('✗ 与司法解释不符',x+w/2,y+h+(P?-36:30),P?26:19,RED,fastA*seg(G,SI.fast-0.3,SI.fast),700);}
  const thA=seg(G,SI.think-0.9,SI.think-0.6);
  if(thA>0.01&&tl>2){const [x,y,w,h]=R(g,ta[0],ta[1]);block(x,y,w,h,{style:'think',a:thA,dash:[7,5]});
    ctx.globalAlpha=thA*0.55;ctx.fillStyle=PURPLE;const n=Math.floor((P?h:w)/22);
    for(let k=0;k<n;k++){const ph=(k*37)%11/11;if(P){const yy=y+12+k*22;if(yy>y+h-12)break;ctx.fillRect(x+w-40,yy,16*(0.4+ph),4);}else{const xx=x+12+k*22;if(xx>x+w-16)break;ctx.fillRect(xx,y+h-24,10,4+10*ph);}}ctx.globalAlpha=1;
    text('思考 token',x+(P?36:16),y+(P?40:22),P?26:17,PURPLE,thA,700,'left');
    if(G>SI.think-0.8&&G<SI.answer-0.55){const cx=P?x+w/2:x+w-6,cy=P?y+h-6:y+h/2;glowAdd(cx,cy,30,0.7*(0.6+0.4*Math.sin(amb*8)),LE.SPR.PURPLE);}}
  const pnA=thA*(1-seg(G,SI.answer+0.1,SI.fold-0.3));if(pnA>0.01)drawThoughts(g,G,amb,pnA,ta);
  if(ansA>0.01){const [x,y,w,h]=R(g,aa[0],aa[1]);block(x,y,w,h,{style:'green',a:ansA});text('回答',x+(P?36:22),y+(P?40:24),P?26:18,DIM,ansA,400,'left');
    rich(ANS,x+w/2,y+h/2+(P?18:12),P?34:21,ansA,{maxW:w-(P?60:44),lh:P?48:29,color:PALE,hl:GREEN});
    if(G<SI.fold)text('✓',x+w-(P?40:24),y+(P?40:24),P?36:24,GREEN,ansA*seg(G,SI.answer-0.3,SI.answer),700);}
  const uiA=seg(G,SI.fold-0.7,SI.fold)*(1-seg(G,SI.drag-0.7,SI.drag-0.3));if(uiA>0.01)drawUI(g,G,amb,uiA);
  const cA=seg(G,SI.cost-0.6,SI.cost)*(1-seg(G,SI.drag-0.7,SI.drag-0.3));
  if(cA>0.01){const [x,y,w,h]=R(g,ta[0],ta[1]);if(P)rich('{计费} · 这一段也计入输出 token，也要时间生成',540,y+h/2,32,cA,{maxW:820});
    else{ctx.globalAlpha=cA;ctx.strokeStyle=GOLD_HI;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y-18);ctx.lineTo(x+w,y-18);ctx.stroke();ctx.globalAlpha=1;rich('{计费} · 这一段也计入输出 token，也要时间生成',x+w/2,y-42,22,cA);}}
  const dA=seg(G,SI.drag-0.7,SI.drag)*(1-seg(G,LAST-0.6,LAST));if(dA>0.01)drawBudget(g,G,amb,dA,ta);ctx.restore();
  LE.finale(['推理模型先在{同一根纸带}上写思考，再作答','思考能{自我检查、推翻重来}，但也更慢、更贵','简单题快答；{复杂推理与风险审查}，再开深度思考'],seg(G,LAST-0.8,LAST),'法律依据：《最高人民法院关于适用〈中华人民共和国民法典〉合同编通则若干问题的解释》（法释〔2023〕13号）第64条第3款、第65条第2款；《民法典》第585条第2款。是否「过分高于」须结合案情综合判断。曲线为示意。');}
function drawThoughts(g,G,amb,a,ta){const P=g.P;let x,y,w,h,fs,lh;
  if(P){const r=R(g,ta[0],ta[1]);x=r[0]+36;y=r[1]+80;w=r[2]-110;h=r[3]-90;fs=28;lh=40;}
  else{const p=g.panel;x=p.x+40;y=p.y+56;w=p.w-80;h=p.h-70;fs=23;lh=33;const r=R(g,ta[0],ta[1]);
    card(p.x,p.y,p.w,p.h,{a:a*0.96,stroke:'rgba(195,160,255,0.55)',fill:['rgba(30,22,44,0.92)','rgba(12,9,18,0.95)']});
    ctx.globalAlpha=a*0.35;ctx.strokeStyle=PURPLE;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(r[0],r[1]);ctx.lineTo(p.x+30,p.y+p.h);ctx.moveTo(r[0]+r[2],r[1]);ctx.lineTo(p.x+p.w-30,p.y+p.h);ctx.stroke();ctx.globalAlpha=1;
    text('放大看思考段（真实内容会更长、更散，这里只保留主线）',p.x+40,p.y+28,17,DIM2,a,400,'left');}
  ctx.save();ctx.beginPath();ctx.rect(x-20,y-10,w+40,h+6);ctx.clip();
  const vis=[];TH.forEach(t=>{const p=lin(G,t[2],t[3]);if(p>0)vis.push([t,p]);});
  const lines=vis.map(([t])=>LE.richLines(t[0],fs,w));const tot=lines.reduce((s,n)=>s+n*lh+10,0);let yy=y-Math.max(0,tot-h);
  vis.forEach(([t,p],k)=>{const typ=t[1],str=t[0];const n=Math.max(1,Math.ceil([...str].length*p));const shown=[...str].slice(0,n).join('');
    const col=typ==='x'?DIM:(typ==='r'?RED:(typ==='c'?PALE:(typ==='g'?GREEN:IVORY)));
    const nl=rich(shown,x,yy+fs/2,fs,a,{maxW:w,align:'left',valign:'top',lh,color:col,weight:typ==='g'?700:400});
    if(typ==='x'&&G>SI.wrong-0.5){const sw=seg(G,SI.wrong-0.5,SI.wrong-0.3);ctx.globalAlpha=a;ctx.fillStyle=RED;ctx.fillRect(x,yy+fs/2,Math.min(w,measure(str,fs))*sw,2.2);ctx.globalAlpha=1;}
    if(typ==='c'){ctx.globalAlpha=a;ctx.fillStyle=GOLD;ctx.fillRect(x-16,yy+4,3,nl*lh-10);ctx.globalAlpha=1;}
    yy+=lines[k]*lh+10;});ctx.restore();}
function drawUI(g,G,amb,a){const P=g.P,u=g.ui;card(u.x,u.y,u.w,u.h,{a,r:22,stroke:'rgba(244,237,223,0.25)',fill:['rgba(26,22,18,0.96)','rgba(14,12,10,0.97)']});
  text('你在聊天界面上看到的',u.x+(P?40:30),u.y+(P?44:32),P?28:19,DIM,a,400,'left');
  const bx=u.x+u.w-(P?40:30),qy=u.y+(P?110:78),qw=P?560:520;
  ctx.globalAlpha=a;rr(bx-qw,qy-(P?34:26),qw,P?68:52,P?30:24);ctx.fillStyle='rgba(226,170,66,0.18)';ctx.fill();ctx.globalAlpha=1;LE.fitText('违约方还能请求法院调减吗？',bx-qw/2,qy,P?30:21,qw-40,IVORY,a,400);
  const cy=qy+(P?90:66),fold=seg(G,SI.fold-0.45,SI.fold-0.05);
  ctx.globalAlpha=a;rr(u.x+(P?40:30),cy-(P?26:20),P?340:280,P?52:40,P?26:20);ctx.fillStyle='rgba(195,160,255,0.12)';ctx.fill();ctx.strokeStyle='rgba(195,160,255,0.5)';ctx.lineWidth=1.2;ctx.stroke();ctx.globalAlpha=1;
  text('▸ 已深度思考（已折叠）',u.x+(P?60:46),cy,P?26:18,PURPLE,a*fold,700,'left');
  rich(ANS,u.x+(P?40:30),cy+(P?70:54),P?30:21,a*seg(G,SI.fold-0.3,SI.fold),{maxW:u.w-(P?80:60),align:'left',valign:'top',lh:P?44:30,color:PALE,hl:GREEN});
  if(!P){const r=R(g,g.qL+g.gap,g.qL+g.gap+g.maxT);ctx.globalAlpha=a*0.4*fold;ctx.setLineDash([5,6]);ctx.strokeStyle=PURPLE;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(r[0]+r[2]/2,r[1]+r[3]);ctx.lineTo(u.x+30+140,cy-20);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    text('模型这一侧：完整的思考仍在本轮纸带上',r[0]+r[2]/2,r[1]-26,19,PURPLE,a*fold,700);}
  else text('↑ 纸带上完整的思考，在界面里折成一行',540,u.y-36,26,PURPLE,a*fold,700);}
function drawBudget(g,G,amb,a,ta){const P=g.P;const ch=P?{x:150,y:g.ui.y+60,w:780,h:300}:{x:300,y:190,w:1320,h:300};
  card(ch.x-50,ch.y-60,ch.w+100,ch.h+120,{a:a*0.9,stroke:'rgba(244,237,223,0.18)',fill:['rgba(20,16,10,0.9)','rgba(10,8,5,0.94)']});
  const X=b=>ch.x+ch.w*b,Y=v=>ch.y+ch.h-(v-0.2)/0.8*ch.h;
  ctx.globalAlpha=a*0.5;ctx.strokeStyle='rgba(244,237,223,0.45)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(ch.x,ch.y);ctx.lineTo(ch.x,ch.y+ch.h);ctx.lineTo(ch.x+ch.w,ch.y+ch.h);ctx.stroke();ctx.globalAlpha=1;
  [[hard,GOLD_HI,'难题（多步推理）'],[easy,C.ICE,'简单题']].forEach(([f,col,lab])=>{ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=60;i++){const b=i/60;i?ctx.lineTo(X(b),Y(f(b))):ctx.moveTo(X(b),Y(f(b)));}ctx.stroke();ctx.globalAlpha=1;
    text(lab,X(1),Y(f(1))-(P?26:20),P?24:18,col,a,700,'right');});
  ctx.globalAlpha=a*0.8;ctx.setLineDash([6,6]);ctx.strokeStyle=RED;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(X(0),Y(0.22));ctx.lineTo(X(1),Y(0.98));ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  text('耗时 / 费用',X(0.5),Y(0.22+0.76*0.5)-24,P?24:18,RED,a,700);
  text('准确率',ch.x-12,ch.y-30,P?24:18,DIM,a,400,'left');text('思考预算 →',ch.x+ch.w,ch.y+ch.h+30,P?24:18,DIM,a,400,'right');text('示意',ch.x+ch.w,ch.y-30,P?24:18,DIM2,a,400,'right');
  const b=clamp(bDisp,0,1);ctx.globalAlpha=a*0.5;ctx.strokeStyle=PURPLE;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(X(b),ch.y);ctx.lineTo(X(b),ch.y+ch.h);ctx.stroke();ctx.globalAlpha=1;
  [[hard,GOLD_HI],[easy,C.ICE]].forEach(([f,col])=>{glowAdd(X(b),Y(f(b)),22,0.8*a);ctx.globalAlpha=a;ctx.beginPath();ctx.arc(X(b),Y(f(b)),7,0,7);ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1;});
  const r=R(g,ta[0],ta[1]);const hx=P?r[0]+r[2]/2:r[0]+r[2],hy=P?r[1]+r[3]:r[1]+r[3]/2;
  if(LE.isAt('drag'))LE.dragHint(hx,hy,bUser==null?(P?'↕ 拖动末端':'← 拖动末端 →'):'',amb,1,{dy:P?0:g.bh/2+40,dx:P?330:0,r:34});}
const drags=[{step:'drag',cursor:'grab',hit:pt=>{const g=geo(SI.drag);if(LY.port)return pt.y>g.a0+g.qL-40&&pt.y<g.a0+g.qL+g.maxT+g.aL+60&&Math.abs(pt.x-g.c)<g.bh/2+60;return Math.abs(pt.y-g.c)<g.bh/2+120&&pt.x>g.a0+g.qL-40&&pt.x<g.a0+g.qL+g.maxT+g.aL+60;},
  move:pt=>{const g=geo(SI.drag);const a=(LY.port?pt.y:pt.x)-g.a0-g.qL-g.gap;bUser=clamp(a/g.maxT,0.04,1);}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{bUser=null;},onSeek:(g,st)=>{bUser=st.b??null;bDisp=null;}});
})();

</script></body></html>
