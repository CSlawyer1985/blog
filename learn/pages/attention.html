<style>

<canvas id="c"></canvas><button id="fs" title="全屏（F）">全屏 F</button>
<script>
(function(){
'use strict';
const FONT='"HSerif","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const IVORY='#F4EDDF', GOLD='#E2AA42', GOLD_HI='#FFD062', PALE='#FFE9B8', DIM='rgba(244,237,223,0.62)', RED='#E86A58', GREEN='#4FD198';

const SCENES=['开场','纸带与光束','QKV 原理','迷失在中间','物理挪位实验','上下文排布铁律'];
const S=(id,scene,dur,hint)=>({id,scene,dur,hint});
const STEPS=[
  S('title',0,2600,''),
  S('tape_in',1,2000,'纸带上排满了一长串上下文：角色、合同原文、历史对话与{当前提问}'),
  S('arcs',1,2400,'生成下一个词时，模型不会平均看待每个字，而是射出{注意力光束 (Attention)}'),
  S('qkv_zoom',2,2600,'推近看原理：末尾提问发出探照光 {Query}，去扫描前面每个词的标签 {Key}'),
  S('qkv_val',2,2400,'匹配度越高，光束越亮越粗，把对应的信息 {Value} 重点拉回末尾'),
  S('multihead',2,2400,'真实模型同时开启{多头注意力}：一束盯法条，一束盯数字，一束盯语法'),
  S('long_ctx',3,2600,'拉远全景：当纸带越来越长，模型内部的注意力分布呈现一个残酷的 {U 型曲线}'),
  S('lost_mid',3,2600,'开头与末尾亮如白昼，正中间沉入暗影——这就是著名的{「迷失在中间」}'),
  S('mid_fail',3,2600,'藏在正中间的关键约束「{上限 15%}」权重跌至 0.04，模型直接视而不见'),
  S('bad_out',3,2400,'结果：模型忽略了中间红线，在末尾按惯性吐出错误的「{30%}」'),
  S('move_up',4,2800,'物理挪位实验：把「{上限 15%}」从中间暗影拽出，挪到纸带最前端高光区'),
  S('relock',4,2400,'光束瞬间重新锁死！注意力权重从 0.04 飙升至 {0.89}'),
  S('good_out',4,2400,'什么模型都没换，只改了信息位置，末尾输出立刻拉直为「{15%}」'),
  S('final',5,2800,''),
];
const LAST=STEPS.length-1;

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeCam=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;
const seg=(G,a,b)=>ease(clamp((G-a)/(b-a)));
function kf(G,pts,fn=ease){if(G<=pts[0][0])return pts[0][1];for(let i=0;i<pts.length-1;i++){if(G<=pts[i+1][0]){const a=pts[i],b=pts[i+1];return lerp(a[1],b[1],fn((G-a[0])/(b[0]-a[0])));}}return pts[pts.length-1][1];}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ==================== 画布与原版光学贴图 ==================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1920, H=1080; let view={s:1,ox:0,oy:0,dpr:1};
function resize(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';
  const s=Math.min(w/W,h/H);view={s,ox:(w-W*s)/2,oy:(h-H*s)/2,dpr};
}
addEventListener('resize',resize); resize();

const mcache=new Map();
function font(sz,wt=400){return `${wt} ${sz}px ${FONT}`;}
function measure(t,sz,wt=400){const k=t+'|'+wt;let v=mcache.get(k);if(v===undefined){ctx.font=font(100,wt);v=ctx.measureText(t).width/100;mcache.set(k,v);}return v*sz;}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function text(str,x,y,sz,col,a=1,wt=400,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.font=font(sz,wt);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(str,x,y);ctx.globalAlpha=prev;
}
function glowText(str,x,y,sz,col,a=1,wt=700,blur=0.45,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  ctx.save();ctx.shadowColor='rgba(255,186,60,0.6)';ctx.shadowBlur=sz*blur;text(str,x,y,sz,col,a,wt,al);ctx.restore();
}
function rich(str,x,y,sz,a=1,col=IVORY){
  if(ctx.globalAlpha*clamp(a)<=0.004||!str)return;
  const parts=[];str.split(/(\{[^}]*\})/).forEach(s=>{if(!s)return;if(s[0]==='{')parts.push([s.slice(1,-1),1]);else parts.push([s,0]);});
  let tw=0;parts.forEach(p=>{p[2]=measure(p[0],sz,p[1]?700:400);tw+=p[2];});let x0=x-tw/2;
  parts.forEach(p=>{if(p[1])glowText(p[0],x0,y,sz,GOLD_HI,a,700,0.45,'left');else text(p[0],x0,y,sz,col,a,400,'left');x0+=p[2];});
}
function brandMark(x,y,sz,a=1){
  if(ctx.globalAlpha*clamp(a)<=0.004)return;
  const s1='陈石律师',s2='  ·  ',s3='chenshi.ai';
  const w1=measure(s1,sz*0.8),w2=measure(s2,sz*0.8),w3=measure(s3,sz,700),tw=w1+w2+w3;let x0=x-tw/2;
  text(s1,x0,y,sz*0.8,IVORY,a*0.78,400,'left');x0+=w1;text(s2,x0,y,sz*0.8,GOLD,a*0.8,400,'left');x0+=w2;glowText(s3,x0,y,sz,GOLD_HI,a,700,0.3,'left');
  const L1=sz*2.2,gap=sz*0.9;ctx.save();ctx.globalAlpha*=a*0.7;
  [[x-tw/2-gap-L1,x-tw/2-gap,0],[x+tw/2+gap,x+tw/2+gap+L1,1]].forEach(([u,v,dir])=>{const g=ctx.createLinearGradient(u,0,v,0);g.addColorStop(dir?1:0,'rgba(226,170,66,0)');g.addColorStop(dir?0:1,'rgba(226,170,66,0.9)');ctx.fillStyle=g;ctx.fillRect(u,y-0.75,v-u,1.5);});
  ctx.restore();
}

function mkSprite(stops){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const SPR_HALO=mkSprite([[0,'rgba(255,228,170,0.9)'],[0.12,'rgba(255,196,96,0.55)'],[0.4,'rgba(226,150,46,0.16)'],[1,'rgba(200,120,30,0)']]);
const SPR_CORE=mkSprite([[0,'rgba(255,250,235,1)'],[0.25,'rgba(255,226,160,0.9)'],[0.6,'rgba(255,190,80,0.25)'],[1,'rgba(255,170,60,0)']]);
const SPR_RED =mkSprite([[0,'rgba(255,195,185,0.9)'],[0.2,'rgba(232,106,88,0.5)'],[1,'rgba(180,40,30,0)']]);
const SPR_GRN =mkSprite([[0,'rgba(180,255,220,0.9)'],[0.2,'rgba(79,209,152,0.5)'],[1,'rgba(20,120,80,0)']]);
function glow(x,y,r,a=1,spr=SPR_HALO){const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||r<=0.5)return;const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.drawImage(spr,x-r,y-r,2*r,2*r);ctx.globalAlpha=prev;}

const FIBER=(()=>{const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d'),r=mulberry(7);
  for(let i=0;i<900;i++){const x=r()*512,y=r()*128,l=6+r()*40;g.strokeStyle=`rgba(255,215,150,${0.015+r()*0.04})`;g.lineWidth=0.6+r()*0.8;g.beginPath();g.moveTo(x,y);g.lineTo(x+l,y+(r()-0.5)*3);g.stroke();}return c;})();
let FIBER_PAT=null;
const DUST=(()=>{const r=mulberry(2028);return Array.from({length:60},()=>({x:r(),y:r(),vx:(r()-0.5)*0.004,vy:-0.003-r()*0.006,r:1.2+r()*2.6,a:0.1+r()*0.25,ph:r()*6.28}));})();

// 纸带上的 9 个上下文词块（第 4 块是藏在中间的“关键约束：上限 15%”，在 Step 10 会物理飞到最前面！）
const BLOCKS=[
  {id:'sys',  t:'System',     sub:'法律助手',     baseW:0.86, slot:0},
  {id:'bg1',  t:'工程概况',    sub:'背景描述',     baseW:0.32, slot:1},
  {id:'bg2',  t:'付款节点',    sub:'第5条原文',    baseW:0.18, slot:2},
  {id:'bg3',  t:'工期顺延',    sub:'第7条原文',    baseW:0.10, slot:3},
  {id:'rule', t:'上限 15%',   sub:'关键约束！',   baseW:0.04, slot:4, isKey:true},
  {id:'bg4',  t:'质保金 3%',  sub:'第12条原文',   baseW:0.09, slot:5},
  {id:'bg5',  t:'签证流程',    sub:'附件二',       baseW:0.22, slot:6},
  {id:'bg6',  t:'历史对话',    sub:'前两轮问答',   baseW:0.48, slot:7},
  {id:'q',    t:'当前提问',    sub:'违约金多少？', baseW:0.95, slot:8, isQuery:true},
];
// U 型曲线函数：两端高（~0.92），中间低（~0.08）
function uCurve(u){const d=2*u-1;return 0.08+0.84*Math.pow(Math.abs(d),2.2);}

function drawArc(x1,y1,x2,y2,h,col,lw,a,amb,flow=false){
  if(a<=0.005)return;
  const cx=(x1+x2)/2, cy=Math.min(y1,y2)-h;
  ctx.save();ctx.globalAlpha*=clamp(a);
  ctx.strokeStyle=col;ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();
  if(flow){
    const t=(amb*0.65)%1;
    const px=(1-t)*(1-t)*x1+2*(1-t)*t*cx+t*t*x2;
    const py=(1-t)*(1-t)*y1+2*(1-t)*t*cy+t*t*y2;
    ctx.globalCompositeOperation='lighter';glow(px,py,18+lw*3,0.9);ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
}

/* ============================== 主渲染 ============================== */
function render(G,amb){
  const {s,ox,oy,dpr}=view;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(s*dpr,0,0,s*dpr,ox*dpr,oy*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.fillStyle='#030303';ctx.fillRect(0,0,W,H);

  // 背景暖光 + 漂浮金尘
  const bg=ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,960);
  bg.addColorStop(0,'rgba(128,84,22,0.16)');bg.addColorStop(0.55,'rgba(60,38,10,0.05)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  DUST.forEach(d=>{const dx=((d.x+amb*d.vx)%1+1)%1*W,dy=((d.y+amb*d.vy)%1+1)%1*H;glow(dx,dy,d.r*3,d.a*(0.55+0.45*Math.sin(amb*1.4+d.ph)));});
  ctx.restore();

  /* ---------- 0. 原版复刻级开场 (0 -> 0.55) ---------- */
  const a0=1-seg(G,0.02,0.55);
  if(a0>0.005){
    const intro=clamp(amb/2.4), out=seg(G,0.02,0.55);
    const title='Attention 到底是什么', fs=98, tw=measure(title,fs,700);
    let x=W/2-tw/2; const rnd=mulberry(8); let ci=0;
    ctx.save();
    for(const ch of title){
      const cw=measure(ch,fs,700), ca=seg(intro,0.08+ci*0.032,0.36+ci*0.032);
      const dx=(rnd()-0.5)*220*out, dy=-(35+rnd()*140)*out;
      glowText(ch,x+cw/2+dx,445+(1-ca)*24+dy,fs,PALE,ca*(1-out),700,0.35);
      x+=cw; ci++;
    }
    const sw=((amb*0.18)%1.6)-0.3;
    if(intro>0.85&&out<0.4){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const gx=W/2-tw/2+sw*tw, g=ctx.createLinearGradient(gx-160,0,gx+160,0);
      g.addColorStop(0,'rgba(255,240,200,0)');g.addColorStop(0.5,'rgba(255,240,200,0.55)');g.addColorStop(1,'rgba(255,240,200,0)');
      ctx.font=font(fs,700);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=g;ctx.globalAlpha=1-out*2.5;ctx.fillText(title,W/2-tw/2,445);ctx.restore();
    }
    const lw=840*seg(intro,0.28,0.82)*(1-out);
    ctx.globalCompositeOperation='lighter';
    const lg=ctx.createLinearGradient(W/2-lw/2,0,W/2+lw/2,0);lg.addColorStop(0,'rgba(255,200,90,0)');lg.addColorStop(0.5,`rgba(255,214,120,${0.95*(1-out)})`);lg.addColorStop(1,'rgba(255,200,90,0)');
    ctx.fillStyle=lg;ctx.fillRect(W/2-lw/2,540,lw,2);glow(W/2,541,60,0.7*(1-out));ctx.globalCompositeOperation='source-over';
    rich('从{光学聚光灯}，看懂大模型如何阅读与为何「{迷失在中间}」',W/2,605,32,seg(intro,0.55,1)*(1-out),DIM);
    brandMark(W/2,870,28,seg(intro,0.7,1)*(1-out));
    ctx.restore();
  }

  /* ---------- 1~5. 单一连续摄影机空间 (G >= 0.45) ---------- */
  const worldA=seg(G,0.45,1.0);
  if(worldA>0.005){
    // 五次方运镜：Step 3-5 推近 QKV 细节，Step 6 起拉远看整根长纸带与 U 型聚光灯
    const camX = kf(G,[[1,960],[2,960],[3,1180],[5,1180],[6,960],[13,960]], easeCam);
    const camY = kf(G,[[1,600],[2,580],[3,540],[5,540],[6,560],[13,560]], easeCam);
    const camZ = kf(G,[[1,1.0],[2,1.0],[3,1.28],[5,1.28],[6,0.96],[13,0.96]], easeCam);

    const pArcs   = seg(G,1.2,2.0);
    const pQKV    = seg(G,2.2,3.0)*(1-seg(G,5.2,5.8));
    const pMulti  = seg(G,4.2,5.0)*(1-seg(G,5.3,5.8));
    const pUCurve = seg(G,5.2,6.0);
    const pShadow = seg(G,6.2,7.0);
    const pMidBad = seg(G,7.2,8.0)*(1-seg(G,9.2,9.8));
    const pBadOut = seg(G,8.2,9.0)*(1-seg(G,9.2,9.8));
    const pMove   = seg(G,9.2,10.0); // 关键约束从 slot 4 物理飞到 slot 1（最前端高光区！）
    const pRelock = seg(G,10.2,11.0);
    const pGoodOut= seg(G,11.2,12.0);
    const pFinal  = seg(G,12.3,13.0);

    ctx.save();ctx.globalAlpha=worldA;
    ctx.translate(W/2,H/2);ctx.scale(camZ,camZ);ctx.translate(-camX,-camY);

    const tapeY=650, tapeH=134, x0=110, x1=1810, tw=x1-x0;

    // 1. 纸带主体（原版纤维纹理 + 齿孔 + 金属双边线）
    ctx.save();ctx.shadowColor='rgba(0,0,0,0.88)';ctx.shadowBlur=38;ctx.shadowOffsetY=14;
    const tgr=ctx.createLinearGradient(0,tapeY-tapeH/2,0,tapeY+tapeH/2);
    tgr.addColorStop(0,'rgba(82,58,20,0.72)');tgr.addColorStop(0.5,'rgba(24,17,7,0.78)');tgr.addColorStop(1,'rgba(82,58,20,0.72)');
    ctx.fillStyle=tgr;ctx.fillRect(x0,tapeY-tapeH/2,tw,tapeH);ctx.restore();
    if(!FIBER_PAT)FIBER_PAT=ctx.createPattern(FIBER,'repeat');
    ctx.fillStyle=FIBER_PAT;ctx.fillRect(x0,tapeY-tapeH/2,tw,tapeH);
    ctx.strokeStyle='rgba(236,184,78,0.9)';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(x0,tapeY-tapeH/2);ctx.lineTo(x1,tapeY-tapeH/2);ctx.moveTo(x0,tapeY+tapeH/2);ctx.lineTo(x1,tapeY+tapeH/2);ctx.stroke();
    for(let hx=x0+20;hx<x1-12;hx+=36){[tapeY-tapeH/2+9,tapeY+tapeH/2-9].forEach(hy=>{ctx.fillStyle='#030303';ctx.fillRect(hx-2,hy-2,4,4);});}

    // 2. U 型聚光灯光学曲线与暗影罩（Step 6 起显现）
    if(pUCurve>0.01){
      ctx.save();ctx.globalAlpha*=pUCurve;
      // 绘制 U 型注意力权重曲线
      ctx.strokeStyle=GOLD_HI;ctx.lineWidth=2.6;
      ctx.beginPath();
      for(let i=0;i<=80;i++){
        const u=i/80, px=x0+40+u*(tw-80), py=tapeY-100-uCurve(u)*240;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);
      }
      ctx.stroke();
      // 左右两端聚光灯锥光束
      if(pShadow>0.02){
        ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha*=pShadow;
        glow(x0+180,tapeY-40,260,0.45);
        glow(x1-180,tapeY-40,260,0.45);
        ctx.restore();
        // 中间深渊暗影标注
        text('高关注区 (Primacy)',x0+160,tapeY-365,18,GOLD_HI,pShadow,700);
        text('高关注区 (Recency)',x1-160,tapeY-365,18,GOLD_HI,pShadow,700);
        text('▼ 迷失在中间（Lost in the Middle · 注意力低谷）',W/2,tapeY-155,20,RED,pShadow*(1-pFinal*0.5),700);
      }
      ctx.restore();
    }

    // 3. 计算 9 个词块的位置（核心：第 4 块「上限 15%」在 Step 10 物理飞跃到 slot 1！）
    const slotW = (tw - 60) / 9;
    const slotX = idx => x0 + 30 + idx * slotW + slotW/2;
    const qX = slotX(8);

    const posMap = BLOCKS.map(b => {
      let idx = b.slot;
      let arcLift = 0;
      if(b.isKey){
        // 从 slot 4 沿抛物线飞到 slot 1
        idx = lerp(4, 1, pMove);
        arcLift = Math.sin(pMove * Math.PI) * 140;
      } else if(b.slot >= 1 && b.slot <= 3){
        // 原来的 1,2,3 顺次右移 1 格腾出高光位！
        idx = lerp(b.slot, b.slot + 1, pMove);
      }
      const x = slotX(idx);
      const y = tapeY - arcLift;
      // 动态计算该词块当前的光学亮度（两端亮，中间暗）
      const u = idx / 8;
      const attW = b.isKey ? lerp(0.04, 0.89, pRelock) : uCurve(u);
      return { b, x, y, attW };
    });

    // 4. 绘制注意力光学弧线（从末尾 Query 射向前面的词块）
    if(pArcs>0.01){
      posMap.forEach(({b,x,y,attW}, i) => {
        if(b.isQuery) return;
        const h = 70 + (8 - i) * 26;
        let w = attW;
        if(pShadow < 0.1) w = (b.isKey || b.id==='sys' || b.id==='bg6') ? 0.78 : 0.22;
        const col = (b.isKey && pRelock > 0.3) ? GREEN : (w > 0.5 ? GOLD_HI : 'rgba(226,170,66,0.38)');
        const lw = 1 + w * 3.8;
        drawArc(qX, tapeY-48, x, y-48, h, col, lw, pArcs * (0.18 + w*0.82), amb, w > 0.65);

        // Multi-Head 多头光束示意（Step 5）
        if(pMulti > 0.05 && (b.isKey || b.id==='bg2' || b.id==='bg6')){
          drawArc(qX-18, tapeY-48, x+10, y-48, h+32, 'rgba(130,210,255,0.65)', 1.8, pMulti*0.75, amb+0.3, true);
        }
      });
    }

    // 5. 绘制 9 个纸带词块
    posMap.forEach(({b,x,y,attW}) => {
      const w = slotW - 14, h = 86;
      // 迷失在中间的暗影压暗效果
      const dimMid = (pShadow > 0.1 && !b.isQuery) ? lerp(0.28, 1.0, attW) : 1.0;
      const isKeyLit = b.isKey && pRelock > 0.3;
      const isKeyFail = b.isKey && pMidBad > 0.2;
      const stroke = isKeyLit ? GREEN : (isKeyFail ? RED : (b.isQuery ? GOLD_HI : 'rgba(226,170,66,0.65)'));

      ctx.save();ctx.globalAlpha *= (isKeyFail ? 0.85 : dimMid);
      rr(x-w/2, y-h/2, w, h, 7);
      ctx.fillStyle = isKeyLit ? 'rgba(18,74,52,0.82)' : (isKeyFail ? 'rgba(90,24,20,0.72)' : (b.isQuery ? 'rgba(110,78,22,0.75)' : 'rgba(14,11,6,0.85)'));
      ctx.fill();ctx.strokeStyle = stroke;ctx.lineWidth = (b.isKey||b.isQuery) ? 2.2 : 1.3;ctx.stroke();

      if(isKeyLit || b.isQuery){
        ctx.globalCompositeOperation='lighter';
        glow(x,y,75,0.45,isKeyLit?SPR_GRN:SPR_HALO);
        ctx.globalCompositeOperation='source-over';
      }
      text(b.t, x, y-13, 18, isKeyLit?GREEN:(isKeyFail?RED:(b.isQuery?GOLD_HI:IVORY)), 1, 700);
      text(b.sub, x, y+16, 13, DIM, 0.9);

      // Q / K / V 标签（Step 3-4）
      if(pQKV > 0.05){
        if(b.isQuery) text('Query (探照光)', x, y+68, 16, GOLD_HI, pQKV, 700);
        else if(b.isKey || b.id==='bg6') text('Key · Value', x, y+68, 15, PALE, pQKV, 700);
      }
      // 关键约束权重实时读数（Step 8-12）
      if(b.isKey && (pMidBad > 0.05 || pRelock > 0.05)){
        const wNum = lerp(0.04, 0.89, pRelock).toFixed(2);
        const wCol = pRelock > 0.4 ? GREEN : RED;
        text(`注意力权重: ${wNum}`, x, y+68, 17, wCol, Math.max(pMidBad, pRelock), 700);
      }
      ctx.restore();
    });

    // 6. 纸带下方：模型输出对比框（Step 9 红色幻觉 -> Step 12 绿色正确）
    if(pBadOut > 0.02 || pGoodOut > 0.02){
      const oy = 835;
      if(pBadOut > 0.02){
        ctx.save();ctx.globalAlpha *= pBadOut;
        rr(W/2-340, oy-38, 680, 76, 10);ctx.fillStyle='rgba(75,20,16,0.78)';ctx.fill();ctx.strokeStyle=RED;ctx.lineWidth=2;ctx.stroke();
        glow(W/2,oy,120,0.35,SPR_RED);
        text('✕ 模型输出：“违约金按常规 30% 计算”（中间的 15% 约束被漏看！）', W/2, oy, 20, RED, 1, 700);
        ctx.restore();
      }
      if(pGoodOut > 0.02){
        ctx.save();ctx.globalAlpha *= pGoodOut;
        rr(W/2-360, oy-38, 720, 76, 10);ctx.fillStyle='rgba(14,62,42,0.82)';ctx.fill();ctx.strokeStyle=GREEN;ctx.lineWidth=2.2;ctx.stroke();
        glow(W/2,oy,120,0.4,SPR_GRN);
        text('✓ 模型输出：“严格按 15% 上限执行”（同一模型，只因放对了高光位！）', W/2, oy, 20, GREEN, 1, 700);
        ctx.restore();
      }
    }

    ctx.restore(); // 结束摄影机变换
  }

  /* ---------- 终局收束落版 (Step 13) ---------- */
  const finA=seg(G,12.4,13.0);
  if(finA>0.01){
    ctx.save();ctx.globalAlpha=finA;
    rich('上下文排布铁律：{开头定规矩，末尾放指令，中间别藏雷}',W/2,92,34,1,IVORY);
    brandMark(W/2,970,26,1);
    ctx.restore();
  }

  /* ---------- 顶部引导语（先退后进，零叠字） & 右下角进度 ---------- */
  const lo=Math.floor(G), hi=Math.min(LAST,Math.ceil(G)), f=G-lo;
  const ha=STEPS[lo].hint, hb=STEPS[hi].hint;
  if(ha===hb) rich(ha,W/2,92,34,0.95);
  else {
    const aOut=1-ease(clamp(f/0.38)), aIn=ease(clamp((f-0.5)/0.42));
    if(aOut>0.01) rich(ha,W/2,92-(1-aOut)*10,34,0.95*aOut);
    if(aIn>0.01) rich(hb,W/2,92+(1-aIn)*10,34,0.95*aIn);
  }
  const st=STEPS[Math.round(G)];
  text(`${String(st.scene).padStart(2,'0')} · ${SCENES[st.scene]}    ${Math.round(G)+1} / ${STEPS.length}`,1860,1040,18,'rgba(244,237,223,0.52)',1,400,'right');
  ctx.fillStyle='rgba(244,237,223,0.16)';ctx.fillRect(1660,1058,200,2);
  ctx.fillStyle=GOLD;ctx.fillRect(1660,1058,200*G/LAST,2);
  ctx.restore();
}

/* ==================== 交互（与原版一致） ==================== */
let G=0, target=0, anim=null, auto=false; const t0=performance.now();
function go(i){
  i=clamp(Math.round(i),0,LAST);if(i===target&&!anim)return;
  const from=G, fwd=i===Math.round(target)+1&&i>from;
  target=i;anim={from,to:i,start:performance.now(),dur:fwd?STEPS[i].dur:Math.min(850,350+Math.abs(i-from)*60),linear:fwd};
}
function next(){go(target+1);} function prev(){go(target-1);}
function tick(now){
  if(anim){
    const p=clamp((now-anim.start)/anim.dur);
    G=anim.linear?lerp(anim.from,anim.to,p):lerp(anim.from,anim.to,ease(p));
    if(p>=1){G=anim.to;anim=null;if(auto&&G<LAST)setTimeout(()=>auto&&go(target+1),700);}
  }
  render(G,(now-t0)/1000);requestAnimationFrame(tick);
}
addEventListener('keydown',e=>{
  if(e.target.id==='lesson-back')return;

  const k=e.key;
  if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();prev();}
  else if(k==='Home')go(0); else if(k==='End')go(LAST);
  else if(k==='f'||k==='F')toggleFS();
  else if(k==='a'||k==='A'){auto=!auto;if(auto)next();}
});
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,b:e.button};});
cv.addEventListener('pointerup',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y,b=pd.b;pd=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();return;}
  if(Math.abs(dx)<14&&Math.abs(dy)<14){if(b===2)prev();else e.shiftKey?prev():next();}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();prev();});
const fsBtn=document.getElementById('fs');
function toggleFS(){const d=document,el=d.documentElement;if(!d.fullscreenElement)el.requestFullscreen?.();else d.exitFullscreen?.();}
fsBtn.addEventListener('pointerdown',e=>e.stopPropagation());
fsBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleFS();});

requestAnimationFrame(tick);
})();
</script></body></html>
