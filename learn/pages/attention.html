 {id:'sys',t:'System',s:'法律助手',sc:1.2},

function geo(G){const P=LY.port,H=LY.H,Lf=seg(G,SI.heads+0.25,SI.long);

function layout(g,G,pKey){const Lf=g.Lf;const fixW=g.P?118:150;

  { const L=layout(g,G,null);const kc=M(g,(L.pos.key[0]+L.pos.key[1])/2),qc=M(g,(L.pos.q[0]+L.pos.q[1])/2);
    const fc=P?{x:540,y:(kc.y+qc.y)/2}:{x:(kc.x+qc.x)/2+40,y:g.c-40};const base=P?{x:540,y:H/2+40}:{x:960,y:540};

    drawBlock(g,it,p[0],p[1],a,G,amb,{keyStyle:keyLost>0.5?'red':(it.key&&G>SI.mid?'green':'gold'),keyCol:keyLost>0.5?RED:PALE});ctx.restore();centers[it.id]=(p[0]+p[1])/2;});

  const bA=seg(G,SI.beams-0.6,SI.beams)*(1-seg(G,SI.heads+0.3,SI.long-0.2));const headsA=seg(G,SI.heads-0.7,SI.heads);

      beam(g,qa,centers[b.id],b.w,GOLD_HI,a*qkDim*(1-headsA*0.4),amb,0,seg(G,SI.val-0.8,SI.val)*(1-headsA));
      if(headsA>0.01)HEADS.slice(1).forEach(([col,ws],h)=>beam(g,qa,centers[b.id],ws[i],col,a*headsA,amb,(h+1)*(P?70:46),headsA*0.8));});}
  const qkA=seg(G,SI.qk-0.8,SI.qk-0.2)*(1-seg(G,SI.soft-0.2,SI.soft+0.4));const qkCap=seg(G,SI.qk-0.3,SI.qk)*(1-seg(G,SI.qk+0.05,SI.qk+0.35));
  const scA=seg(G,SI.qk-0.4,SI.qk)*(1-seg(G,SI.heads-0.5,SI.heads)),wA=seg(G,SI.soft-0.7,SI.soft)*(1-seg(G,SI.heads-0.5,SI.heads));
  NAMED.forEach((b,i)=>{if(b.q)return;const [x,y,w,h]=rectOf(g,pos[b.id][0],pos[b.id][1],g.bh);
    const kp=P?{x:x-34,y:y+h/2}:{x:x+w/2,y:y+h+30};
    if(qkA>0.01){ctx.globalAlpha=qkA;rr(kp.x-26,kp.y-17,52,34,6);ctx.fillStyle='rgba(143,216,255,0.12)';ctx.fill();ctx.strokeStyle=ICE;ctx.lineWidth=1.2;ctx.stroke();ctx.globalAlpha=1;text('K',kp.x,kp.y,P?24:20,ICE,qkA,700);}
    const lp=P?{x:x+w+60,y:y+h/2}:{x:x+w/2,y:y-34};const sw=wA,txt=sw>0.5?Math.round(b.w*100)+'%':b.sc.toFixed(1);const a=Math.max(scA*(1-sw),sw)*seg(G,SI.qk-0.5+i*0.04,SI.qk-0.1+i*0.04);
    if(a>0.01){if(P)text(txt,lp.x-14,lp.y,30,sw>0.5?GOLD_HI:ICE,a,700,'left');else text(txt,lp.x,lp.y,24,sw>0.5?GOLD_HI:ICE,a,700);}
    if(sw>0.01){if(P){const bw=180*b.w/0.42;ctx.globalAlpha=sw;ctx.fillStyle='rgba(255,208,98,0.75)';ctx.fillRect(x+w+20,y+h/2+24,bw,8);ctx.globalAlpha=1;}
      else{const bh2=110*b.w/0.42;ctx.globalAlpha=sw*0.9;const gr=ctx.createLinearGradient(0,y-60-bh2,0,y-60);gr.addColorStop(0,GOLD_HI);gr.addColorStop(1,'rgba(226,150,46,0.2)');ctx.fillStyle=gr;ctx.fillRect(x+w/2-10,y-56-bh2,20,bh2);ctx.globalAlpha=1;}}});
  if(qkA>0.01){const [x,y,w,h]=rectOf(g,pos.q[0],pos.q[1],g.bh);const qp=P?{x:x-34,y:y+h/2}:{x:x+w/2,y:y+h+30};
    ctx.globalAlpha=qkA;rr(qp.x-26,qp.y-17,52,34,6);ctx.fillStyle='rgba(255,208,98,0.2)';ctx.fill();ctx.strokeStyle=GOLD_HI;ctx.lineWidth=1.4;ctx.stroke();ctx.globalAlpha=1;text('Q',qp.x,qp.y,P?24:20,GOLD_HI,qkA,700);
    const t=lin(G,SI.qk-0.55,SI.qk-0.05);if(t>0&&t<1){const idx=t*8;const i=Math.floor(idx),f=idx-i;const b0=NAMED[clamp(i,0,7)],b1=NAMED[clamp(i+1,0,7)];
      const k0=rectOf(g,pos[b0.id][0],pos[b0.id][1],g.bh),k1=rectOf(g,pos[b1.id][0],pos[b1.id][1],g.bh);
      const pt0=P?{x:k0[0]-34,y:k0[1]+k0[3]/2}:{x:k0[0]+k0[2]/2,y:k0[1]+k0[3]+30},pt1=P?{x:k1[0]-34,y:k1[1]+k1[3]/2}:{x:k1[0]+k1[2]/2,y:k1[1]+k1[3]+30};
      const xx=lerp(pt0.x,pt1.x,f),yy=lerp(pt0.y,pt1.y,f);glowAdd(xx,yy,40,0.9);glowAdd(xx,yy,12,1,LE.SPR.CORE);}
    if(P)rich('匹配分 = {Q · K}：越像，分越高（示意）',540,g.a0+g.L+120,32,qkCap,{maxW:900});
    else rich('匹配分 = {Q · K}：两组数字越「对得上」，分越高（示意）',(rectOf(g,pos.key[0],pos.key[1],1)[0]+x+w)/2,g.c+g.bh/2+110,24,qkCap);}
  const smCap=seg(G,SI.soft-0.3,SI.soft)*(1-seg(G,SI.soft+0.05,SI.soft+0.35));

    ctx.globalAlpha=1;text('混合后的新向量 → 交给下一层',mx,my+(P?40:28),P?30:20,PALE,vA,700);
    if(P)rich('V：每个位置携带的{内容}，按权重加权求和',540,g.a0+g.L+120,32,vCap,{maxW:900});else rich('V：每个位置携带的{内容}，按权重加权求和',760,g.c+g.bh/2+110,24,vCap);}
