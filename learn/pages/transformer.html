<script>
// @title Transformer 结构 · 沿着残差流从纸带走到下一个词
// @desc 从 token 到向量，残差流贯通所有层；每个 Block 里注意力负责位置之间交换信息（RoPE 在这里旋转 Q、K，因果掩码挡住未来），MLP 负责各位置独立加工；顶部输出下一个词并接回纸带。
(function(){'use strict';
const {C,LY,ctx,clamp,lerp,ease,seg,kf,lin,bump,damp,text,glowText,rich,measure,rr,glow,glowAdd,card,block,tape,line,arrowHead,qbez,S}=LE;
const {IVORY,GOLD,GOLD_HI,PALE,DIM,DIM2,RED,GREEN,ICE,PURPLE}=C;
const SCENES=['开场','输入','残差流','一个 Block','注意力','MLP','层层堆叠','输出','收束'];
const STEPS=[
 S('title',0,2600,''),
 S('tokens',1,2200,'输入：纸带上的 5 个 token，模型要预测{下一个词}'),
 S('embed',1,2600,'查表：每个 token 变成一串数字——{向量}（维度常见数千，例如 4096）'),
 S('stream',2,2800,'每个位置有一条{残差流}：向量沿它一路向上，每一层只往里「加」一点'),
 S('block',3,3000,'一个 Block = {注意力} + {MLP}：各自从主干读一份，算完再加回去（x + Δx）'),
 S('attn',4,3000,'注意力层：各位置之间{交换信息}——每个位置只能看自己和前面'),
 S('rope',4,3000,'位置信息（{RoPE}）就在这里：把 Q、K 按所在位置{旋转}一个角度，再算匹配分'),
 S('mask',4,2800,'{因果掩码}：得分矩阵右上角被遮住，任何位置都看不到后面的词'),
 S('mlp',5,3000,'MLP 层：每个位置{各自}加工——先升维（经典 4 倍，SwiGLU 约 8/3 倍）再压回'),
 S('stack',6,3000,'同样结构的 Block {叠几十到上百层}，残差流从底贯通到顶'),
 S('probe',6,1800,'{拖动}探针沿最后一个位置的残差流上下移动：越往上，预测越清晰（示意）',true),
 S('out',7,3000,'到顶：最后一个位置的向量经归一化，乘以{输出矩阵}，得到词表里每个词的分数，再 softmax'),
 S('loop',7,3000,'选出「{减少}」，接到纸带末尾，再整套跑一遍——这就是{自回归}'),
 S('final',8,3200,''),
];
const SI={};STEPS.forEach((s,i)=>SI[s.id]=i);const LAST=STEPS.length-1;
const TOK=['违约金','过高','可','请求','适当'];const N=5;
const OUTP=[['减少',0.68],['调整',0.18],['调减',0.09],['降低',0.03]];
let probeUser=null,probeDisp=null;
function probs(t){// 探针深度 t∈[0,1] 处「提前读出」的候选分布（示意）
  const raw={减少:0.04+0.70*Math.pow(t,1.6),调整:0.10+0.12*t,的:0.30*(1-t)+0.01,降低:0.06+0.05*Math.sin(t*3)};const s=Object.values(raw).reduce((a,b)=>a+b,0);
  return Object.entries(raw).map(([k,v])=>[k,v/s]).sort((a,b)=>b[1]-a[1]);}
function geo(G){const P=LY.port,H=LY.H;const outF=seg(G,SI.out-0.8,SI.out-0.1);
  if(!P)return{P,xs:[...Array(N)].map((_,i)=>560+i*190),tapeY:965,yBot:900,yTop:200,side:{x:1450,w:390},left:{x:150},outF};
  return{P,xs:[...Array(N)].map((_,i)=>140+i*200),tapeY:H-300,yBot:H-370,yTop:lerp(440,860,outF),outF};}
// Block 版式：stackF=0 时只有一个大 Block（细节），=1 时压缩成多层
function bands(g,G){const st=seg(G,SI.stack-0.85,SI.stack-0.1);const top=g.yTop+30,bot=g.yBot-40;
  const mid=(top+bot)/2,hh=Math.min(bot-top,g.P?960:9999)/2;const detail={y0:mid-hh,y1:mid+hh};const n=9;const hb=(bot-top)/n;
  const list=[];for(let k=0;k<n;k++){const y1=bot-k*hb,y0=y1-hb+10;list.push({y0,y1,main:k===1});}
  const m=list[1];return{st,n,list,main:{y0:lerp(detail.y0+40,m.y0,st),y1:lerp(detail.y1-10,m.y1,st)}};}

function stream(g,i,y0,y1,a,amb,hi=0){if(a<=0.01)return;const x=g.xs[i];const gr=ctx.createLinearGradient(0,y1,0,y0);gr.addColorStop(0,'rgba(226,170,66,0.35)');gr.addColorStop(1,'rgba(255,214,120,0.95)');
  ctx.globalAlpha=a;ctx.strokeStyle=gr;ctx.lineWidth=(g.P?7:6)+hi*4;ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y0);ctx.stroke();ctx.globalAlpha=1;
  for(let k=0;k<4;k++){const t=((amb*0.22+k/4+i*0.13)%1);glowAdd(x,lerp(y1,y0,t),g.P?18:14,a*0.7*Math.sin(Math.PI*t));}}
function plus(x,y,r,a,col=GOLD_HI){if(a<=0.01)return;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle='rgba(20,14,6,0.95)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-r*0.55,y);ctx.lineTo(x+r*0.55,y);ctx.moveTo(x,y-r*0.55);ctx.lineTo(x,y+r*0.55);ctx.stroke();ctx.globalAlpha=1;}
function render(G,amb,dt){const W=LY.W,H=LY.H,P=LY.port;const g=geo(G);const B=bands(g,G);
  const z=G<0.6?lerp(1.06,1,seg(G,0,0.6)):1+0.04*bump(G,SI.rope,0.8);LE.bg(amb,0,0);
  LE.title('Transformer 结构','沿着{残差流}，从纸带走到下一个词',LE.easeOut(clamp(amb/1.8)),seg(G,0.05,0.6),{portLines:['Transformer','结构']});
  if(G<0.25)return;ctx.save();LE.camera(W/2,H/2,z);
  const inA=seg(G,0.3,1);
  // 纸带与 token
  const loopT=lin(G,SI.loop-0.75,SI.loop-0.15);const tw=P?180:170,tcount=N+(loopT>0.6?1:0);
  const tx0=g.xs[0]-tw/2-30,tx1=g.xs[N-1]+tw/2+30+(P?0:(loopT>0?190*seg(G,SI.loop-0.4,SI.loop-0.1):0));
  tape(tx0,P?Math.max(tx1,1040):tx1,g.tapeY,P?120:110,{a:inA});
  TOK.forEach((t,i)=>{const a=inA*seg(G,0.5+i*0.06,0.9+i*0.06);const x=g.xs[i];block(x-tw/2+10,g.tapeY-(P?44:40),tw-20,P?88:80,{style:i===N-1?'hot':'gold',a});text(t,x,g.tapeY,P?36:28,i===N-1?GOLD_HI:IVORY,a,700);});
  // 向量（嵌入）
  const eA=seg(G,SI.embed-0.7,SI.embed)*(1-seg(G,SI.stream-0.5,SI.stream));const rise=seg(G,SI.stream-0.7,SI.stream-0.1);
  for(let i=0;i<N;i++){const x=g.xs[i];const cells=8,ch=P?20:16,cw=P?44:36;const baseY=g.tapeY-(P?70:62)-cells*ch;const yy=lerp(baseY,g.yBot-cells*ch,rise);
    const a=Math.max(eA,0)*seg(G,SI.embed-0.7+i*0.05,SI.embed-0.25+i*0.05);if(a>0.01){for(let k=0;k<cells;k++){const v=Math.sin(i*2.1+k*1.3)*0.5+0.5;ctx.globalAlpha=a;ctx.fillStyle=`rgba(${Math.round(150+105*v)},${Math.round(110+90*v)},${Math.round(40+40*v)},0.9)`;ctx.fillRect(x-cw/2,yy+k*ch,cw,ch-3);}ctx.globalAlpha=1;}}
  if(eA>0.01)text('[ 0.12, −0.83, 0.47, … ]  共数千个数字',W/2,g.tapeY-(P?330:290),P?28:20,DIM,eA*seg(G,SI.embed-0.3,SI.embed));
  // 残差流
  const sA=seg(G,SI.stream-0.6,SI.stream);const sTop=lerp(g.yBot,g.yTop,LE.easeOut(seg(G,SI.stream-0.6,SI.stream)));
  const probing=STEPS[Math.round(G)].id==='probe'||bump(G,SI.probe,1)>0;
  for(let i=0;i<N;i++)stream(g,i,sTop,g.tapeY-(P?50:46),sA,amb,i===N-1?0.6*bump(G,SI.probe,1):0);
  if(sA>0.01&&G<SI.block)text('残差流',g.xs[N-1]+(P?0:70),P?sTop-40:sTop+20,P?30:22,GOLD_HI,sA*(1-seg(G,SI.block-0.6,SI.block-0.2)),700,P?'center':'left');
  // Block（们）
  const bA=seg(G,SI.block-0.8,SI.block-0.2);
  if(bA>0.01){B.list.forEach((b,k)=>{const a=bA*(b.main?seg(B.st,0.6,1):B.st);if(a>0.01)thinBand(g,b,a,k);});const dA=bA*(1-seg(B.st,0.55,0.95));if(dA>0.01)drawBlock(g,G,amb,B.main,dA,B.st);}
  if(B.st>0.01){const a=B.st*(1-seg(G,SI.out-0.6,SI.out-0.2)*0.4);const lx=P?540:g.xs[0]-170;const ly=P?g.yTop-12:(g.yTop+g.yBot)/2;
    if(P)text('× 数十到上百层（图中画 9 层）',lx,ly,28,PALE,a,700);else{rich('× {数十}',lx,ly-20,26,a);rich('到{上百层}',lx,ly+20,26,a);text('（图中画 9 层）',lx,ly+58,18,DIM2,a);}}
  // 探针
  const prA=seg(G,SI.probe-0.6,SI.probe)*(1-seg(G,SI.out-0.6,SI.out-0.2));if(prA>0.01)drawProbe(g,G,amb,dt,prA,B);
  // 输出
  const oA=seg(G,SI.out-0.7,SI.out)*(1-seg(G,LAST-0.6,LAST));if(oA>0.01)drawOut(g,G,amb,oA,loopT);
  ctx.restore();
  LE.finale(['{残差流}从底到顶贯通：每层只往里加一点','{注意力}让位置之间交换信息（RoPE、因果掩码都在这里）','{MLP} 让每个位置各自加工；到顶输出下一个词，再接回纸带'],seg(G,LAST-0.8,LAST),'这里画的是常见的 Decoder-only、Pre-Norm 结构；各模型在归一化、激活函数、注意力变体上有差异。层数、维度与概率均为示意。');}
function thinBand(g,b,a,k){const x0=g.xs[0]-60,x1=g.xs[N-1]+60;const mid=(b.y0+b.y1)/2;
  ctx.globalAlpha=a*0.85;rr(x0,mid+2,x1-x0,(b.y1-b.y0)/2-8,6);ctx.fillStyle='rgba(143,216,255,0.10)';ctx.fill();ctx.strokeStyle='rgba(143,216,255,0.45)';ctx.lineWidth=1;ctx.stroke();
  rr(x0,b.y0+4,x1-x0,(b.y1-b.y0)/2-8,6);ctx.fillStyle='rgba(226,170,66,0.10)';ctx.fill();ctx.strokeStyle='rgba(226,170,66,0.45)';ctx.stroke();ctx.globalAlpha=1;}
function drawBlock(g,G,amb,b,a,st){const P=g.P;const d=1-st;const x0=g.xs[0]-(P?80:80),x1=g.xs[N-1]+(P?80:80);const h=b.y1-b.y0;
  const aY0=b.y0+h*0.52,aY1=b.y1-h*0.04,mY0=b.y0+h*0.04,mY1=b.y0+h*0.46;// 下：注意力；上：MLP
  // 外框
  if(d>0.05){ctx.globalAlpha=a*d*0.6;ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(244,237,223,0.35)';ctx.lineWidth=1.2;rr(x0-24,b.y0-14,x1-x0+48,h+28,14);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    text('一个 Block',P?x1+20:x0-40,P?b.y0-44:b.y0+8,P?26:20,DIM,a*d,700,'right');}
  // 注意力带
  const atA=a;const atHi=seg(G,SI.attn-0.6,SI.attn)*(1-seg(G,SI.mlp-0.6,SI.mlp-0.2));
  ctx.globalAlpha=atA;rr(x0,aY0,x1-x0,aY1-aY0,12);const ga=ctx.createLinearGradient(0,aY0,0,aY1);ga.addColorStop(0,`rgba(143,216,255,${0.10+0.10*atHi})`);ga.addColorStop(1,'rgba(143,216,255,0.04)');ctx.fillStyle=ga;ctx.fill();ctx.strokeStyle=`rgba(143,216,255,${0.5+0.4*atHi})`;ctx.lineWidth=1.4;ctx.stroke();ctx.globalAlpha=1;
  // MLP 带
  const mlHi=seg(G,SI.mlp-0.6,SI.mlp)*(1-seg(G,SI.stack-0.6,SI.stack-0.2));
  for(let i=0;i<N;i++){const x=g.xs[i];const ex=lin(G,SI.mlp-0.75,SI.mlp-0.35)*(1-lin(G,SI.mlp-0.3,SI.mlp))*d;const bw=(P?120:110)*(1+1.6*ex)*Math.max(0.35,d)+ (1-d)*0,bx=x-bw/2;
    ctx.globalAlpha=a;rr(bx,mY0,bw,mY1-mY0,10);const gm=ctx.createLinearGradient(0,mY0,0,mY1);gm.addColorStop(0,`rgba(255,208,98,${0.14+0.12*mlHi})`);gm.addColorStop(1,'rgba(226,170,66,0.05)');ctx.fillStyle=gm;ctx.fill();ctx.strokeStyle=`rgba(226,170,66,${0.55+0.4*mlHi})`;ctx.lineWidth=1.3;ctx.stroke();ctx.globalAlpha=1;
    if(d>0.5)text('MLP',x,(mY0+mY1)/2-(ex>0.1?16:0),P?28:20,GOLD_HI,a*d,700);
    if(ex>0.1&&d>0.5)text('升维',x,(mY0+mY1)/2+18,P?22:16,PALE,a*ex,400);}
  if(d>0.3){text('注意力 Attention',P?540:x0-40,P?aY1+40:(aY0+aY1)/2,P?30:22,ICE,a*d,700,P?'center':'right');text('MLP（前馈层）',P?540:x0-40,P?mY0-56:(mY0+mY1)/2,P?30:22,GOLD_HI,a*d,700,P?'center':'right');}
  // 读写：Norm 节点与 ⊕
  if(d>0.3){const rw=seg(G,SI.block-0.6,SI.block-0.1);for(let i=0;i<N;i++){const x=g.xs[i];const off=P?52:44;
      [aY0-12,mY0-12].forEach((yout,k)=>plus(x,yout,P?13:11,a*d*rw,k?GOLD_HI:ICE));}
    const showX=seg(G,SI.block-0.5,SI.block)*(1-seg(G,SI.attn-0.6,SI.attn-0.2));
    if(showX>0.01){const x=g.xs[N-1]+(P?0:150);rich('{x + Δx}',P?540:x,P?(b.y0+b.y1)/2:(b.y0+b.y1)/2,P?40:30,showX);text('原向量保留，只叠加改动',P?540:x,(b.y0+b.y1)/2+(P?50:40),P?26:19,DIM,showX);}}
  // 注意力弧：每个位置向前看
  const arcA=a*d*seg(G,SI.attn-0.7,SI.attn)*(1-seg(G,SI.mlp-0.6,SI.mlp-0.2));
  if(arcA>0.01){const yb=aY0+ (aY1-aY0)*0.62;for(let i=1;i<N;i++)for(let j=0;j<i;j++){const hi=i===N-1;const x1=g.xs[i],x2=g.xs[j];const hh=(P?26:22)+(i-j)*(P?24:18);
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=arcA*(hi?0.8:0.25);ctx.strokeStyle=ICE;ctx.lineWidth=hi?2.4:1.2;ctx.beginPath();ctx.moveTo(x1,yb);ctx.quadraticCurveTo((x1+x2)/2,yb-hh*1.6,x2,yb);ctx.stroke();ctx.restore();
      if(hi){const t=((amb*0.6+j*0.23)%1);const q=qbez({x:x2,y:yb},{x:(x1+x2)/2,y:yb-hh*1.6},{x:x1,y:yb},t);glowAdd(q.x,q.y,12,arcA*Math.sin(Math.PI*t),LE.SPR.ICE);}}
    const yq=aY1-(P?26:20);for(let i=0;i<N;i++){const x=g.xs[i];['Q','K','V'].forEach((l,k)=>{const xx=x+(k-1)*(P?40:32);text(l,xx,yq,P?22:16,k===0?GOLD_HI:(k===1?ICE:PALE),arcA,700);});}}
  // RoPE 转盘：在 Q、K 上
  const roA=a*d*seg(G,SI.rope-0.7,SI.rope)*(1-seg(G,SI.mask-0.5,SI.mask-0.1));
  if(roA>0.01){const yq=aY1-(P?26:20);for(let i=0;i<N;i++){const x=g.xs[i];[0,1].forEach(k=>{const xx=x+(k-1)*(P?40:32),yy=yq-(P?48:40);const r=P?17:14;const ang=-Math.PI/2+(i*0.62)*seg(G,SI.rope-0.5,SI.rope-0.1);
        ctx.globalAlpha=roA;ctx.beginPath();ctx.arc(xx,yy,r,0,7);ctx.strokeStyle=k?ICE:GOLD_HI;ctx.lineWidth=1.4;ctx.stroke();ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx+r*Math.cos(ang),yy+r*Math.sin(ang));ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;});
      text(`位置 ${i+1}`,x,yq+(P?30:24),P?20:15,DIM2,roA);}
    if(P)rich('{RoPE} 不加在输入上，而是在{每一层}注意力里旋转 Q、K',540,aY1+90,30,roA,{maxW:920});
    else{rich('{RoPE}：不加在输入上，',g.side.x,aY0+10,24,roA,{align:'left'});rich('而是在{每一层}注意力里旋转 Q、K',g.side.x,aY0+48,24,roA,{align:'left'});text('位置越靠后转得越多；旋转后 Q·K 只与两者的相对位置有关',g.side.x,aY0+86,17,DIM,roA,400,'left');}}
  // 因果掩码矩阵
  const mkA=a*d*seg(G,SI.mask-0.7,SI.mask)*(1-seg(G,SI.mlp-0.6,SI.mlp-0.2));
  if(mkA>0.01){const cs=P?64:52;const mx=P?540-cs*N/2:g.side.x+20,my=P?LY.H-720:aY0-60;if(P){card(mx-50,my-90,cs*N+100,cs*N+150,{a:mkA,stroke:'rgba(143,216,255,0.4)'});}
    text('得分矩阵（行：当前位置；列：被看的位置）',P?540:mx,my-(P?50:28),P?24:17,DIM,mkA,400,P?'center':'left');
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=mx+c*cs,y=my+r*cs;const masked=c>r;const t=seg(G,SI.mask-0.6+(r*N+c)*0.012,SI.mask-0.3+(r*N+c)*0.012);
      ctx.globalAlpha=mkA*t;rr(x+3,y+3,cs-6,cs-6,5);ctx.fillStyle=masked?'rgba(10,8,6,0.95)':`rgba(255,208,98,${0.18+0.5*Math.abs(Math.sin(r*1.7+c))})`;ctx.fill();ctx.strokeStyle=masked?'rgba(240,122,98,0.5)':'rgba(226,170,66,0.5)';ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1;
      if(masked)text('×',x+cs/2,y+cs/2,P?26:20,RED,mkA*t*0.8,700);}
    text('右上被遮住 = 看不到未来',P?540:mx+cs*N/2,my+cs*N+(P?36:28),P?26:18,RED,mkA,700);}
  // MLP 说明
  const mlA=a*d*seg(G,SI.mlp-0.5,SI.mlp)*(1-seg(G,SI.stack-0.6,SI.stack-0.2));
  if(mlA>0.01){if(P)rich('各位置{互不交流}，只各自加工；常被认为存放了大量「知识」',540,mY0-90,28,mlA,{maxW:940});
    else{rich('各位置{互不交流}，',g.side.x,(mY0+mY1)/2-20,24,mlA,{align:'left'});text('只各自加工；常被认为存放大量「知识」',g.side.x,(mY0+mY1)/2+18,19,DIM,mlA,400,'left');}}}
function drawProbe(g,G,amb,dt,a,B){const P=g.P;const x=g.xs[N-1];const top=g.yTop+30,bot=g.yBot-40;
