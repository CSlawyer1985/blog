<script>
// @title Skill 到底是什么 · 把一大段规矩拆成按需加载的文件包
// @desc 提示词越写越长的问题；Skill 文件包（SKILL.md、references、scripts、templates）；渐进加载三层：开场只放说明，命中再读正文，执行时按需取资料、脚本只回结果；怎样写好一个 Skill。
(function(){'use strict';
const {C,LY,ctx,clamp,lerp,ease,seg,lin,bump,damp,text,glowText,rich,measure,rr,glow,glowAdd,card,block,tape,line,arrowHead,qbez,S}=LE;
const {IVORY,GOLD,GOLD_HI,PALE,DIM,DIM2,RED,GREEN,ICE,PURPLE}=C;
const SCENES=['开场','提示词越写越长','切成文件包','渐进加载','动手比一比','怎么写好','收束'];
const STEPS=[
 S('title',0,2600,''),
 S('grow',1,3200,'最初，我们把所有规矩都塞进同一段{提示词}'),
 S('noise',1,3000,'场景一多：每次都带着全部规矩，既{占纸带空间}，又制造{干扰}'),
 S('cut',2,3000,'Skill 的做法：把规矩{切开}，装进一个文件夹（文件包）'),
 S('pkg',2,3400,'{SKILL.md} 写名称、何时使用和工作流；{references/} 放资料，{scripts/} 放脚本，{templates/} 放模板'),
 S('l1',3,3000,'渐进加载 ①：开场只把每个 Skill 的{名称和一句话说明}放上纸带'),
 S('l2',3,3000,'② 任务命中「合同审查」后，才把它的 {SKILL.md 正文}读进纸带'),
 S('l3',3,3200,'③ 执行到具体步骤，再按需读{参考资料}；脚本直接运行，只把{结果}写回纸带'),
 S('drag',4,1800,'{拖动}装了多少个 Skill：比一比「全塞进提示词」和「渐进加载」占多少纸带（示意）',true),
 S('make',5,3200,'写好一个 Skill：{何时使用}写清楚，流程分步可检查，确定性的计算交给{脚本}'),
 S('meta',5,3000,'还可以用 Skill 来做 Skill：例如 Anthropic 官方提供的 {skill-creator}'),
 S('final',6,3200,''),
];
const SI={};STEPS.forEach((s,i)=>SI[s.id]=i);const LAST=STEPS.length-1;
const RULES=['起诉状格式','合同审查清单','律师函口径','引用规范','尽调清单','邮件模板','计费规则','保密要求'];
const SKILLS=[['合同审查','审合同时使用'],['起诉状','起草起诉状时使用'],['律师函','发函时使用'],['尽调清单','做尽调时使用']];
let nUser=null,nDisp=4;
function geo(){const P=LY.port,H=LY.H;
  if(!P)return{P,a0:120,L:1680,c:810,th:176,bh:132,box:{x:520,y:170,w:880,h:440}};
  return{P,a0:430,L:H-430-420,c:250,th:380,bh:340,box:{x:470,y:450,w:580,h:900}};}
const CAP=100;
function R(g,a0,a1){const u=g.L/CAP;return g.P?[g.c-g.bh/2,g.a0+a0*u,g.bh,(a1-a0)*u]:[g.a0+a0*u,g.c-g.bh/2,(a1-a0)*u,g.bh];}
function tb(g,a0,a1,lab,st,a,o={}){if(a<=0.01||a1-a0<0.05)return;const [x,y,w,h]=R(g,a0+0.25,a1-0.25);block(x,y,w,h,{style:st,a,dash:o.dash});if(lab&&(g.P?h>36:w>40)){if(g.P)rich(lab,x+w/2,y+h/2,o.fs||26,a,{maxW:w-24,weight:700,color:o.col||IVORY});else rich(lab,x+w/2,y+h/2,o.fs||20,a,{maxW:w-16,weight:700,color:o.col||IVORY});}}
function render(G,amb,dt){const W=LY.W,H=LY.H,P=LY.port;const g=geo();
  LE.bg(amb,0,0);
  LE.title('Skill 到底是什么','把一大段规矩，拆成{按需加载}的文件包',LE.easeOut(clamp(amb/1.8)),seg(G,0.05,0.6),{portLines:['Skill','到底是什么']});
  if(G<0.3)return;const fin=1-seg(G,LAST-0.7,LAST);const inA=seg(G,0.3,1)*fin;
  if(P)tape(g.a0-20,g.a0+g.L+20,g.c,g.th,{vert:true,a:inA});else tape(g.a0-20,g.a0+g.L+20,g.c,g.th,{a:inA});
  const grow=seg(G,0.5,SI.grow);const cut=seg(G,SI.cut-0.85,SI.cut-0.2);const noise=seg(G,SI.noise-0.7,SI.noise-0.1);
  // ① 巨型提示词
  if(cut<0.99){const n=RULES.length;const each=8.5;let a=0;RULES.forEach((r,k)=>{const e=seg(grow,k/n*0.8,k/n*0.8+0.25);const len=each*e;const used=k===1;
      const sh=cut;const [x,y,w,h]=R(g,a,a+len);if(len>0.1){const off=P?{x:sh*300,y:0}:{x:0,y:-sh*320};ctx.save();ctx.translate(off.x*(1+k*0.05),off.y*(1+k*0.05));tb(g,a,a+len,r,used||noise<0.5?'gold':'dim',inA*(1-cut)*(used?1:lerp(1,0.45,noise)));ctx.restore();}a+=len;});
    const tA=seg(G,SI.noise-0.6,SI.noise-0.2)*(1-cut);if(tA>0.01){tb(g,70,84,'本次任务：审一份租赁合同','ice',inA*tA,{col:ICE});
      const [x,y,w,h]=R(g,0,68);rich('只有「合同审查清单」用得上',P?g.c+g.th/2+30:x+w/2,P?y+h/2:y-40,P?26:24,inA*tA,{align:P?'left':'center',maxW:P?560:0,hl:GOLD_HI});}
    const tot=RULES.length*each*grow;if(G<SI.cut)text(`系统提示词 · 占纸带约 ${Math.round(tot)}%（示意）`,P?g.c+g.th/2+30:g.a0,P?g.a0+20:g.c+g.th/2+34,P?24:20,DIM,inA*(1-cut),400,'left');}
  // ② 文件包
  const B=g.box;const pk=seg(G,SI.cut-0.6,SI.cut)*(1-seg(G,SI.drag-0.8,SI.drag-0.4)*0.85)*(1-seg(G,SI.make-0.8,SI.make-0.4));
  if(pk>0.01){card(B.x,B.y,B.w,B.h,{a:pk*inA,stroke:'rgba(255,208,98,0.7)'});glowText('合同审查/',B.x+30,B.y+(P?50:44),P?32:28,GOLD_HI,pk*inA,700,0.3,'left');
    const an=seg(G,SI.pkg-0.8,SI.pkg-0.1);const items=[['SKILL.md','名称 · 何时使用 · 工作流正文',GOLD_HI],['references/','审查清单.md · 相关法条.md',ICE],['scripts/','计算违约金.py',GREEN],['templates/','审查意见模板.docx',PURPLE]];
    const hiL1=seg(G,SI.l1-0.6,SI.l1)*(1-seg(G,SI.l2-0.6,SI.l2)),hiL2=bump(G,SI.l2,0.6),hiL3=bump(G,SI.l3,0.6);
    items.forEach(([n,d,c],k)=>{const e=k===0?seg(G,SI.cut-0.4,SI.cut):seg(an,k*0.15,0.5+k*0.15);const y=B.y+(P?130:110)+k*(P?190:76);const hi=(k===0?Math.max(hiL1,hiL2):(k>0?hiL3*(k<3?1:0):0));
      if(hi>0.01)glowAdd(B.x+(P?60:60),y,60,0.6*hi*pk);text(n,B.x+(P?40:50),y,P?30:24,c,e*pk*inA,700,'left');rich(d,P?B.x+40:B.x+260,P?y+48:y,P?24:20,e*pk*inA*an,{align:'left',maxW:P?B.w-60:B.w-290,color:DIM,valign:P?'top':undefined});});}
  // ③ 渐进加载：纸带内容
  const l1=seg(G,SI.l1-0.7,SI.l1-0.1),l2=seg(G,SI.l2-0.7,SI.l2-0.1),l3=seg(G,SI.l3-0.7,SI.l3-0.1);
  const dragOn=seg(G,SI.drag-0.6,SI.drag-0.1)*(1-seg(G,SI.make-0.8,SI.make-0.4));
  if(l1>0.01&&G<SI.drag-0.1){const al=inA*(1-seg(G,SI.drag-0.6,SI.drag-0.1));let a=0;SKILLS.forEach((s,k)=>{const e=seg(l1,k*0.12,0.5+k*0.12);tb(g,a,a+7*e,s[0],k===0&&l2>0.5?'hot':'gold',al*e,{fs:P?24:17});a+=7*e;});
    tb(g,a,a+4*l1,'',null,0);const q0=a+1;tb(g,q0,q0+12,'任务：审一份租赁合同','ice',al*l1,{col:ICE});let b=q0+12;
    if(l2>0.01){tb(g,b,b+16*l2,'SKILL.md 正文：审查步骤 1–6','hot',al*l2);b+=16*l2;}
    if(l3>0.01){tb(g,b,b+12*l3,'读入审查清单','gold',al*l3);b+=12*l3;tb(g,b,b+8*l3,'脚本结果：违约金 6 万','green',al*seg(l3,0.4,1),{col:GREEN});b+=8*l3;}
    const [x,y,w,h]=R(g,0,b);if(G<SI.drag)text(`占纸带约 ${Math.round(b)}%（示意）`,P?g.c+g.th/2+30:g.a0,P?g.a0+g.L-30:g.c+g.th/2+34,P?24:20,DIM,al,400,'left');
    if(l3>0.01&&!P){const [sx,sy,sw,sh]=R(g,b-8*l3,b);rich('脚本的代码本身{不进纸带}',sx+sw/2,sy+sh+70,20,al*l3,{hl:GREEN});}}
  // ④ 动手：对比
  if(dragOn>0.01){const at=LE.isAt('drag');if(at&&nUser!=null)nDisp=damp(nDisp,nUser,dt,12);else if(!at)nDisp=4;const n=Math.max(1,Math.round(nDisp));
    const full=n*30,lazy=n*1+30;const T=g;// 纸带上两种方式
    const half=P?0:0;const pa=dragOn*inA;
    const bx=P?470:300,by=P?g.box.y:200,bw=P?580:1320;card(bx,by,bw,P?520:330,{a:pa});rich(`已安装 {${n}} 个 Skill（每个正文按 30 份、说明按 1 份计，示意）`,bx+30,by+(P?30:44),P?24:20,pa,{align:'left',maxW:bw-60,valign:P?'top':undefined,color:DIM,lh:34});
    const rows=[['全塞进提示词',full,RED],['Skill 渐进加载',lazy,GREEN]];rows.forEach(([t,v,c],k)=>{const y=by+(P?150:110)+k*(P?120:90);text(t,bx+30,y,P?28:24,c,pa,700,'left');const maxW=bw-(P?60:420);const L=maxW*Math.min(v,CAP)/CAP;
      ctx.globalAlpha=pa;rr(bx+(P?30:300),y+(P?30:-14),maxW,28,7);ctx.fillStyle='rgba(244,237,223,0.06)';ctx.fill();rr(bx+(P?30:300),y+(P?30:-14),L,28,7);ctx.fillStyle=c;ctx.fill();ctx.globalAlpha=1;
      text(v>CAP?`${v}% · 放不下`:`${v}%`,P?bx+bw-30:bx+310+L,y,P?26:22,v>CAP?RED:IVORY,pa,700,P?'right':'left');});
    const t=dragTrack();LE.line(t.x0,t.y,t.x1,t.y,'rgba(244,237,223,0.3)',4,pa);[1,10,20,30,40].forEach(v=>text(String(v),lerp(t.x0,t.x1,(v-1)/39),t.y+(P?40:32),P?24:18,DIM,pa,700));
    const kx=lerp(t.x0,t.x1,(nDisp-1)/39);ctx.globalAlpha=pa;ctx.beginPath();ctx.arc(kx,t.y,14,0,7);ctx.fillStyle=GOLD_HI;ctx.fill();ctx.globalAlpha=1;glowAdd(kx,t.y,34,0.8*pa);if(at&&nUser==null)LE.dragHint(kx,t.y,'拖动',amb,1,{dy:-44});
    // 纸带上同步显示
    tb(g,0,Math.min(lazy,CAP),'渐进加载：说明 × '+n+' + 1 份正文','green',pa*0.9,{col:GREEN});}
  // ⑤ 怎么写好
  const mk=seg(G,SI.make-0.7,SI.make-0.1)*fin;
  if(mk>0.01){const items=[['何时使用','说明里写清触发场景，模型才知道什么时候读它'],['分步流程','步骤可检查：每步输入、输出、完成标准'],['资料分开','法条、清单放 references/，用到再读'],['脚本兜底','金额、日期等确定性计算交给 scripts/']];
    items.forEach((it,k)=>{const e=seg(mk,k*0.12,0.5+k*0.12);const x=P?90:200+(k%2)*780,y=P?470+k*230:190+Math.floor(k/2)*190,w=P?900:740;card(x,y,w,P?200:160,{a:e*(1-seg(G,SI.meta-0.8,SI.meta-0.4)*0.6)});
      glowText(it[0],x+30,y+(P?56:48),P?34:28,GOLD_HI,e,700,0.3,'left');rich(it[1],x+30,y+(P?120:104),P?26:22,e,{align:'left',maxW:w-60,valign:'top'});});}
  const mt=seg(G,SI.meta-0.6,SI.meta-0.1)*fin;
  if(mt>0.01){const x=P?90:560,y=P?H*0.5+260:560,w=P?900:800;card(x,y,w,P?200:150,{a:mt,stroke:GOLD_HI});glowText('skill-creator',x+w/2,y+(P?64:52),P?40:34,GOLD_HI,mt,700);text('一个用来创建、改进 Skill 的 Skill',x+w/2,y+(P?130:108),P?26:22,IVORY,mt);}
  LE.finale(['提示词越写越长，就把规矩{切成 Skill 文件包}','{渐进加载}：先放说明 → 命中再读正文 → 用到再取资料','脚本只回{结果}，纸带上只留这次真正需要的东西'],seg(G,LAST-0.8,LAST),'纸带占比与「每个正文 30 份」均为示意。Skill 的文件结构与加载方式以各产品文档为准（如 Anthropic Agent Skills）。');}
function dragTrack(){const g=geo();return g.P?{x0:530,x1:990,y:g.box.y+440}:{x0:600,x1:1320,y:470};}
const drags=[{step:'drag',cursor:'ew-resize',hit:pt=>{const t=dragTrack();return pt.x>t.x0-50&&pt.x<t.x1+50&&Math.abs(pt.y-t.y)<60;},move:pt=>{const t=dragTrack();nUser=1+clamp((pt.x-t.x0)/(t.x1-t.x0))*39;}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{nUser=null;},onSeek:(g,st)=>{nUser=st.n??null;if(nUser!=null)nDisp=nUser;}});
})();

</script></body></html>
