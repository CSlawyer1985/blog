<script>
(function(){
'use strict';
const FONT='"HSerif","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const IVORY='#F4EDDF', GOLD='#E2AA42', GOLD_HI='#FFD062', PALE='#FFE9B8', DIM='rgba(244,237,223,0.62)', RED='#E86A58', GREEN='#4FD198', BLUE='#6AA9FF';

const SCENES=['开场','提示词的短板','工程化切分','文件包解剖','渐进式加载','制作方法论','元 Skill'];
const S=(id,scene,dur,hint)=>({id,scene,dur,hint});
const STEPS=[
  S('title',0,2400,''),
  S('p_grow',1,2000,'最初，我们不断把规矩塞进同一段 {Prompt}'),
  S('p_bloat',1,2200,'为了控制模型，提示词越来越长、越来越重'),
  S('p_noise',1,2400,'不同场景下大量内容用不上：既{浪费 Token}，又制造{噪音}'),
  S('s_cut',2,2400,'Anthropic 的工程解法：把巨型提示词{物理切开}'),
  S('s_index',2,2200,'提炼一张极薄的 {SKILL.md 索引}，其余文件按需加载'),
  S('pkg_open',3,2200,'解剖一个标准的 {Skill 文件包}'),
  S('pkg_md',3,2400,'不可或缺的核心：{SKILL.md}（元数据索引 + 工作流正文）'),
  S('pkg_refs',3,2400,'{references/} 规则与知识库：法条、案例、红线清单'),
  S('pkg_scripts',3,2400,'{scripts/ & templates/}：确定性代码齿轮 + 标准输出模板'),
  S('load_l1',4,2400,'渐进式加载 ①：启动时仅加载 {名称与一句话简介}'),
  S('load_l2',4,2600,'渐进式加载 ②：命中场景后，才把 {SKILL.md 正文} 装入上下文'),
  S('load_l3',4,2600,'渐进式加载 ③：执行到具体节点，按需调取 {规则与脚本结果}'),
  S('m_four',5,2600,'如何制作一个高质量 Skill？{四种核心方法}'),
  S('m_goal',5,2600,'殊途同归：沉淀为清晰的{工作流、节点依赖与质量标准}'),
  S('meta_anth',6,2400,'用 Skill 生产 Skill：从 Anthropic 官方 {skill-creator} 讲起'),
  S('meta_own',6,2600,'更进一步：为你沉淀的实战{元 Skill}与系统教程'),
  S('final',6,2400,''),
];
const LAST=STEPS.length-1;
const SCENE_FIRST=SCENES.map((_,i)=>STEPS.findIndex(s=>s.scene===i));

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const seg=(G,a,b)=>ease(clamp((G-a)/(b-a)));
function actAlpha(G,inS,inE,outS,outE){
  const fi=inS===null?1:seg(G,inS,inE);
  const fo=outS===null?1:(1-seg(G,outS,outE));
  return fi*fo;
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let view={s:1,ox:0,oy:0,dpr:1}, W=1920, H=1080;
function resize(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';
  const s=Math.min(w/W,h/H); view={s,ox:(w-W*s)/2,oy:(h-H*s)/2,dpr};
}
addEventListener('resize',resize); resize();

const mcache=new Map();
function font(sz,wt=400){return `${wt} ${sz}px ${FONT}`;}
function measure(t,sz,wt=400){const k=t+'|'+wt;let v=mcache.get(k);if(v===undefined){ctx.font=font(100,wt);v=ctx.measureText(t).width/100;mcache.set(k,v);}return v*sz;}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// 乘法透明度绘制（零叠字保障）
function text(str,x,y,sz,col,a=1,wt=400,al='center'){
  const eff=ctx.globalAlpha*clamp(a); if(eff<=0.004||!str)return;
  const prev=ctx.globalAlpha; ctx.globalAlpha=eff;
  ctx.font=font(sz,wt);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(str,x,y);
  ctx.globalAlpha=prev;
}
function glowText(str,x,y,sz,col,a=1,wt=700,blur=0.45,al='center'){
  const eff=ctx.globalAlpha*clamp(a); if(eff<=0.004||!str)return;
  ctx.save();ctx.shadowColor='rgba(255,186,60,0.6)';ctx.shadowBlur=sz*blur;
  text(str,x,y,sz,col,a,wt,al);ctx.restore();
}
function rich(str,x,y,sz,a=1,col=IVORY){
  if(ctx.globalAlpha*clamp(a)<=0.004||!str)return;
  const parts=[];str.split(/(\{[^}]*\})/).forEach(s=>{if(!s)return;if(s[0]==='{')parts.push([s.slice(1,-1),1]);else parts.push([s,0]);});
  let tw=0;parts.forEach(p=>{p[2]=measure(p[0],sz,p[1]?700:400);tw+=p[2];});let x0=x-tw/2;
  parts.forEach(p=>{if(p[1])glowText(p[0],x0,y,sz,GOLD_HI,a,700,0.4,'left');else text(p[0],x0,y,sz,col,a,400,'left');x0+=p[2];});
}
function brandMark(x,y,sz,a=1){
  if(ctx.globalAlpha*clamp(a)<=0.004)return;
  const s1='陈石律师',s2='  ·  ',s3='chenshi.ai';
  const w1=measure(s1,sz*0.85),w2=measure(s2,sz*0.85),w3=measure(s3,sz,700),tw=w1+w2+w3;let x0=x-tw/2;
  text(s1,x0,y,sz*0.85,IVORY,a*0.8,400,'left');x0+=w1;text(s2,x0,y,sz*0.85,GOLD,a*0.8,400,'left');x0+=w2;glowText(s3,x0,y,sz,GOLD_HI,a,700,0.3,'left');
}

// 【质感升级】精工卡片绘制器：纵深渐变 + 立体投影 + 顶部1px高光倒角
function drawPanel(x,y,w,h,r=12,stroke='rgba(226,170,66,0.5)',topCol='rgba(28,22,11,0.92)',botCol='rgba(12,10,6,0.94)',lw=1.8){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.75)';ctx.shadowBlur=28;ctx.shadowOffsetY=12;
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,topCol);g.addColorStop(1,botCol);
  rr(x,y,w,h,r);ctx.fillStyle=g;ctx.fill();
  ctx.shadowColor='transparent';ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();
  // 顶部玻璃高光边线
  ctx.strokeStyle='rgba(255,235,185,0.22)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x+r,y+1);ctx.lineTo(x+w-r,y+1);ctx.stroke();
  ctx.restore();
}

// 【质感升级】程序化纸带纤维纹理（900 条微细金丝纤维）
const FIBER=(()=>{const c=document.createElement('canvas');c.width=512;c.height=160;const g=c.getContext('2d'),r=mulberry(7);
  for(let i=0;i<900;i++){const x=r()*512,y=r()*160,l=8+r()*44;g.strokeStyle=`rgba(255,220,155,${0.018+r()*0.045})`;g.lineWidth=0.6+r()*0.7;g.beginPath();g.moveTo(x,y);g.lineTo(x+l,y+(r()-0.5)*3);g.stroke();}
  return c;})();
let FIBER_PAT=null;

const SPR_HALO=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,228,170,0.85)');gr.addColorStop(0.2,'rgba(255,190,80,0.45)');gr.addColorStop(1,'rgba(200,120,30,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return c;})();
function glow(x,y,r,a=1){const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||r<=0.5)return;const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.drawImage(SPR_HALO,x-r,y-r,2*r,2*r);ctx.globalAlpha=prev;}
function arrow(x1,y1,x2,y2,a=1,col=GOLD,amb=0){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.01)return;
  ctx.save();ctx.globalAlpha=eff;ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.setLineDash([8,8]);ctx.lineDashOffset=-amb*36;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
  const ang=Math.atan2(y2-y1,x2-x1);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-14*Math.cos(ang-0.42),y2-14*Math.sin(ang-0.42));ctx.lineTo(x2-14*Math.cos(ang+0.42),y2-14*Math.sin(ang+0.42));ctx.closePath();ctx.fill();ctx.restore();
}

const DUST=(()=>{const r=mulberry(2026);return Array.from({length:48},()=>({x:r(),y:r(),vx:(r()-0.5)*0.005,vy:-0.004-r()*0.007,rad:1.5+r()*3.2,a:0.1+r()*0.22,ph:r()*6.28}));})();

const PROMPT_BLOCKS=[
  {t:'角色定位与语气红线',used:true},
  {t:'建设工程合同审查 18 条细则',used:true},
  {t:'股权并购尽调核查清单 (3200字)',used:false},
  {t:'劳动仲裁举证责任与计算公式',used:false},
  {t:'违约金过高调减的 12 个最高院类案',used:true},
  {t:'诉讼文书排版格式与 Word 模板规范',used:false},
  {t:'税务合规与跨境交易免责条款',used:false},
];

/* ============================== 主渲染 ============================== */
function render(G,amb){
  const {s,ox,oy,dpr}=view;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(s*dpr,0,0,s*dpr,ox*dpr,oy*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.fillStyle='#040405';ctx.fillRect(0,0,W,H);

  // 极淡精密工程背景网格
  ctx.strokeStyle='rgba(226,170,66,0.025)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // 背景暖光 + 金尘
  const bg=ctx.createRadialGradient(W/2,H*0.48,0,W/2,H*0.48,980);
  bg.addColorStop(0,'rgba(135,88,24,0.18)');bg.addColorStop(0.55,'rgba(55,34,10,0.06)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  DUST.forEach(d=>{const dx=((d.x+amb*d.vx)%1+1)%1*W,dy=((d.y+amb*d.vy)%1+1)%1*H;glow(dx,dy,d.rad*3,d.a*(0.55+0.45*Math.sin(amb*1.5+d.ph))*0.6);});
  ctx.restore();

  /* ---------- 幕 0：开场标题 ---------- */
  const a0=actAlpha(G,null,null,0.02,0.42);
  if(a0>0.005){
    const intro=clamp(amb/2.0), dy=-28*(1-a0);
    ctx.save();ctx.globalAlpha=a0;
    glowText('Skill 到底是什么？',W/2,430-(1-intro)*22+dy,108,PALE,intro,700,0.4);
    const lw=780*seg(intro,0.2,0.85);
    const lg=ctx.createLinearGradient(W/2-lw/2,0,W/2+lw/2,0);lg.addColorStop(0,'rgba(255,200,90,0)');lg.addColorStop(0.5,'rgba(255,214,120,0.9)');lg.addColorStop(1,'rgba(255,200,90,0)');
    ctx.fillStyle=lg;ctx.fillRect(W/2-lw/2,522+dy,lw,2);
    rich('从提示词的短板出发，看懂 Anthropic 的{渐进式加载}工程范式',W/2,585+dy,32,seg(intro,0.4,0.95),DIM);
    brandMark(W/2,860+dy*0.5,28,seg(intro,0.6,1));
    ctx.restore();
  }

  /* ---------- 幕 1 & 2：Prompt 膨胀 -> 噪音 -> 物理切分 ---------- */
  const a12=actAlpha(G,0.52,1.0,5.02,5.42);
  if(a12>0.005){
    const grow=seg(G,1.15,2.0), noise=seg(G,2.15,2.95), cut=seg(G,3.15,4.0), idxShow=seg(G,4.15,4.95);
    const nVis=Math.round(lerp(2,PROMPT_BLOCKS.length,grow));
    const bx=lerp(960,640,idxShow), bw=lerp(860,640,cut), bh=56, gap=lerp(6,22,cut);
    const totalH=nVis*(bh+gap)-gap, y0=545-totalH/2;

    ctx.save();ctx.globalAlpha=a12;ctx.translate(0,(1-a12)*20);
    if(cut<0.95){
      ctx.save();ctx.globalAlpha*=1-cut;
      drawPanel(bx-bw/2-24,y0-42,bw+48,totalH+70,14,noise>0.3?RED:GOLD,'rgba(44,30,12,0.55)','rgba(18,12,6,0.75)',2.2);
      text('单一巨型提示词 (Mega Prompt)',bx,y0-18,20,noise>0.3?RED:GOLD_HI,1,700);
      ctx.restore();
    }
    for(let i=0;i<nVis;i++){
      const b=PROMPT_BLOCKS[i], y=y0+i*(bh+gap);
      const isNoise=noise>0.05&&!b.used, spreadX=cut*(b.used?-40:140);
      const pulse=isNoise&&cut<0.5?(0.55+0.25*Math.sin(amb*7+i)):1;
      ctx.save();ctx.globalAlpha*=pulse;
      drawPanel(bx-bw/2+spreadX,y,bw,bh,7,isNoise?'rgba(232,106,88,0.75)':(b.used&&noise>0.2?GOLD_HI:'rgba(226,170,66,0.6)'),
        isNoise?'rgba(95,30,24,0.35)':'rgba(65,46,16,0.35)',isNoise?'rgba(40,14,12,0.5)':'rgba(24,17,7,0.55)',1.5);
      text(b.t,bx-bw/2+spreadX+22,y+bh/2,21,isNoise?'rgba(255,190,180,0.92)':IVORY,1,b.used?700:400,'left');
      const badge=isNoise?(cut>0.5?'移入独立规则文件':'本次用不上 · 噪音/烧Token'):(cut>0.5?'按需载入':'当前所需');
      text(badge,bx+bw/2+spreadX-18,y+bh/2,16,isNoise?RED:GOLD_HI,1,700,'right');
      ctx.restore();
    }
    if(idxShow>0.02){
      const ix=1390, iy=540, iw=400, ih=340;
      ctx.save();ctx.globalAlpha*=idxShow;ctx.translate((1-idxShow)*30,0);
      drawPanel(ix-iw/2,iy-ih/2,iw,ih,14,GOLD_HI,'rgba(36,26,10,0.94)','rgba(14,10,5,0.96)',2.4);
      glow(ix,iy-110,130,0.35);
      glowText('SKILL.md',ix,iy-118,34,GOLD_HI,1,700,0.4);
      text('轻量级入口索引（渐进式披露核心）',ix,iy-74,18,DIM,1);
      text('name: contract-review',ix-155,iy-18,19,GREEN,1,700,'left');
      text('description: 合同违约金与风控审查',ix-155,iy+16,18,IVORY,1,400,'left');
      text('→ 命中场景时，再按需展开正文',ix-155,iy+68,18,GOLD_HI,1,400,'left');
      text('→ 需要法条时，再读取 references/',ix-155,iy+102,18,DIM,1,400,'left');
      text('→ 需要计算时，直接调用 scripts/',ix-155,iy+136,18,DIM,1,400,'left');
      arrow(bx+bw/2+155,540,ix-iw/2-18,540,1,GOLD_HI,amb);
      ctx.restore();
    }
    ctx.restore();
  }

  /* ---------- 幕 3：Skill 文件包立体解剖 ---------- */
  const a3=actAlpha(G,5.52,6.0,9.02,9.42);
  if(a3>0.005){
    const sub1=actAlpha(G,6.0,6.45,7.08,7.42), sub2=actAlpha(G,7.52,7.92,8.08,8.42), sub3=actAlpha(G,8.52,8.92,null,null);
    ctx.save();ctx.globalAlpha=a3;ctx.translate(0,(1-a3)*20);
    const tx=370, ty=540, tw=440, th=470;
    drawPanel(tx-tw/2,ty-th/2,tw,th,14,'rgba(226,170,66,0.55)');
    glowText('contract-review/',tx-175,ty-185,26,GOLD_HI,1,700,0.3,'left');

    const tree=[
      {name:'├── SKILL.md',sub:'必备核心 · 索引与SOP',y:ty-100,hl:sub1,col:GOLD_HI},
      {name:'├── references/',sub:'法条、类案、审查红线',y:ty-10,hl:sub2,col:BLUE},
      {name:'├── scripts/',sub:'Python/Shell 确定性脚本',y:ty+80,hl:sub3,col:GREEN},
      {name:'└── templates/',sub:'报告结构与输出模板',y:ty+170,hl:sub3,col:GREEN},
    ];
    tree.forEach(it=>{
      const act=0.35+0.65*it.hl;
      if(it.hl>0.05){ctx.save();ctx.globalAlpha*=it.hl;rr(tx-195,it.y-34,390,68,8);ctx.fillStyle='rgba(226,170,66,0.14)';ctx.fill();ctx.strokeStyle=it.col;ctx.lineWidth=1.8;ctx.stroke();ctx.restore();}
      text(it.name,tx-175,it.y-8,22,it.hl>0.2?it.col:IVORY,act,700,'left');
      text(it.sub,tx-140,it.y+18,16,DIM,act,400,'left');
    });

    const px=1190, py=540, pw=960, ph=470;
    drawPanel(px-pw/2,py-ph/2,pw,ph,16,'rgba(226,170,66,0.45)');

/* ============================== 交互与播控 ============================== */
let G=0, target=0, anim=null, auto=false; const t0=performance.now();
const dock=document.getElementById('dock');
SCENES.forEach((name,idx)=>{
  const b=document.createElement('button');b.className='sbtn';b.textContent=`${String(idx).padStart(2,'0')} ${name}`;
  b.addEventListener('pointerdown',e=>e.stopPropagation());
  b.addEventListener('pointerup',e=>{e.stopPropagation();go(SCENE_FIRST[idx]);});
  dock.appendChild(b);
});
function syncDock(){const sc=STEPS[Math.round(target)].scene;dock.querySelectorAll('.sbtn').forEach((b,i)=>b.classList.toggle('active',i===sc));}
function go(i){
  i=clamp(Math.round(i),0,LAST); if(i===target&&!anim)return;
  const from=G, fwd=i===Math.round(target)+1&&i>from;
  const dur=fwd?STEPS[i].dur:Math.min(850,350+Math.abs(i-from)*70);
  target=i; anim={from,to:i,start:performance.now(),dur,linear:fwd}; syncDock();
}
function next(){go(target+1);} function prev(){go(target-1);}
function tick(now){
  if(anim){
    const p=clamp((now-anim.start)/anim.dur);
    G=anim.linear?lerp(anim.from,anim.to,p):lerp(anim.from,anim.to,ease(p));
    if(p>=1){G=anim.to;anim=null;if(auto&&G<LAST)setTimeout(()=>auto&&go(target+1),750);}
  }
  render(G,(now-t0)/1000); requestAnimationFrame(tick);
}

let idleTimer=null;
function wake(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>document.body.classList.add('idle'),3200);}
['mousemove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wake)); wake();

const autoBtn=document.getElementById('autoBtn'), cleanBtn=document.getElementById('cleanBtn'), fsBtn=document.getElementById('fsBtn');
function toggleAuto(){auto=!auto;autoBtn.classList.toggle('on',auto);autoBtn.textContent=auto?'自动中':'自动 A';if(auto)next();}
function toggleClean(){document.body.classList.toggle('clean');}
function toggleFS(){const d=document,el=d.documentElement;if(!d.fullscreenElement)el.requestFullscreen?.();else d.exitFullscreen?.();}
[autoBtn,cleanBtn,fsBtn].forEach(b=>b.addEventListener('pointerdown',e=>e.stopPropagation()));
autoBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleAuto();});
cleanBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleClean();});
fsBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleFS();});

addEventListener('keydown',e=>{
  if(e.target.id==='lesson-back')return;

  const k=e.key;
  if(k==='ArrowRight'||k===' '||k==='Enter'||k==='PageDown'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='Backspace'||k==='PageUp'){e.preventDefault();prev();}
  else if(k==='a'||k==='A')toggleAuto();
  else if(k==='h'||k==='H')toggleClean();
  else if(k==='f'||k==='F')toggleFS();
});
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,b:e.button};});
cv.addEventListener('pointerup',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y,b=pd.b;pd=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();return;}
  if(Math.abs(dx)<14&&Math.abs(dy)<14){if(b===2)prev();else e.shiftKey?prev():next();}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();prev();});

syncDock(); requestAnimationFrame(tick);
})();
