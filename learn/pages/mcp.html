<style>

<canvas id="c"></canvas><button id="fs" title="全屏（F）">全屏 F</button>
<script>
(function(){
'use strict';
const FONT='"HSerif","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const IVORY='#F4EDDF', GOLD='#E2AA42', GOLD_HI='#FFD062', PALE='#FFE9B8', DIM='rgba(244,237,223,0.62)', RED='#E86A58';

const SCENES=['开场','孤岛与乱线','光学总线','总线解剖','运行时闭环','接入纸带','终局'];
const S=(id,scene,dur,hint)=>({id,scene,dur,hint});
const STEPS=[
  S('title',0,2600,''),
  S('hosts',1,1800,'左侧：越来越多的 {AI 应用}（Claude Code、Cursor、法律助手…）'),
  S('servers',1,1800,'右侧：散落在外部世界的 {工具与数据源}'),
  S('spaghetti',1,2600,'传统集成：每对之间单独写接口，{M × N} 条线瞬间缠成乱麻'),
  S('add_pain',1,2400,'只要新增一个「{合同库}」，左侧每个 AI 都要重新适配一遍'),
  S('bus_rise',2,2800,'破局：拆掉乱线，在中央立起一条标准协议——{MCP 光学总线}'),
  S('bus_connect',2,2400,'左侧与右侧各自只对接总线，复杂度从 M × N 降维成 {M + N}'),
  S('bus_plug',2,2400,'再接入「{合同库}」：只需 1 根线吸上总线，左侧所有 AI 瞬间打通'),
  S('zoom_focus',3,2600,'推近一条通路：任何 {MCP Server} 都通过同一套协议对外暴露能力'),
  S('prim_tools',3,2000,'标准原语 ①：{Tools（工具）}——模型可请求执行的动作，如检索、读文件'),
  S('prim_res',3,2000,'标准原语 ②：{Resources（资源）}——可直接挂载的只读数据与文档'),
  S('prim_prompt',3,2000,'标准原语 ③：{Prompts（模板）}——服务端预置的标准工作流入口'),
  S('rpc_req',4,2600,'运行时 ①：模型发出标准 {JSON-RPC 请求}，沿总线直达案例库 Server'),
  S('rpc_res',4,2600,'运行时 ②：Server 在外部执行完毕，将{结构化结果}沿总线回传'),
  S('to_tape',5,3000,'落回本质：MCP 工具定义写入{纸带前端}，返回结果写回{纸带末尾}'),
  S('final',6,2600,''),
];
const LAST=STEPS.length-1;

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeCam=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;
const seg=(G,a,b)=>ease(clamp((G-a)/(b-a)));
function kf(G,pts,fn=ease){if(G<=pts[0][0])return pts[0][1];for(let i=0;i<pts.length-1;i++){if(G<=pts[i+1][0]){const a=pts[i],b=pts[i+1];return lerp(a[1],b[1],fn((G-a[0])/(b[0]-a[0])));}}return pts[pts.length-1][1];}
const bump=(G,c,w)=>clamp(1-Math.abs(G-c)/w);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ==================== 画布与原版光学贴图 ==================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1920, H=1080; let view={s:1,ox:0,oy:0,dpr:1};
function resize(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';
  const s=Math.min(w/W,h/H);view={s,ox:(w-W*s)/2,oy:(h-H*s)/2,dpr};
}
addEventListener('resize',resize); resize();

const mcache=new Map();
function font(sz,wt=400){return `${wt} ${sz}px ${FONT}`;}
function measure(t,sz,wt=400){const k=t+'|'+wt;let v=mcache.get(k);if(v===undefined){ctx.font=font(100,wt);v=ctx.measureText(t).width/100;mcache.set(k,v);}return v*sz;}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// 严格乘法透明度，绝不叠字
function text(str,x,y,sz,col,a=1,wt=400,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.font=font(sz,wt);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(str,x,y);ctx.globalAlpha=prev;
}
function glowText(str,x,y,sz,col,a=1,wt=700,blur=0.45,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  ctx.save();ctx.shadowColor='rgba(255,186,60,0.6)';ctx.shadowBlur=sz*blur;text(str,x,y,sz,col,a,wt,al);ctx.restore();
}
function rich(str,x,y,sz,a=1,col=IVORY){
  if(ctx.globalAlpha*clamp(a)<=0.004||!str)return;
  const parts=[];str.split(/(\{[^}]*\})/).forEach(s=>{if(!s)return;if(s[0]==='{')parts.push([s.slice(1,-1),1]);else parts.push([s,0]);});
  let tw=0;parts.forEach(p=>{p[2]=measure(p[0],sz,p[1]?700:400);tw+=p[2];});let x0=x-tw/2;
  parts.forEach(p=>{if(p[1])glowText(p[0],x0,y,sz,GOLD_HI,a,700,0.45,'left');else text(p[0],x0,y,sz,col,a,400,'left');x0+=p[2];});
}
function brandMark(x,y,sz,a=1){
  if(ctx.globalAlpha*clamp(a)<=0.004)return;
  const s1='陈石律师',s2='  ·  ',s3='chenshi.ai';
  const w1=measure(s1,sz*0.8),w2=measure(s2,sz*0.8),w3=measure(s3,sz,700),tw=w1+w2+w3;let x0=x-tw/2;
  text(s1,x0,y,sz*0.8,IVORY,a*0.78,400,'left');x0+=w1;text(s2,x0,y,sz*0.8,GOLD,a*0.8,400,'left');x0+=w2;glowText(s3,x0,y,sz,GOLD_HI,a,700,0.3,'left');
  const L1=sz*2.2,gap=sz*0.9;ctx.save();ctx.globalAlpha*=a*0.7;
  [[x-tw/2-gap-L1,x-tw/2-gap,0],[x+tw/2+gap,x+tw/2+gap+L1,1]].forEach(([u,v,dir])=>{const g=ctx.createLinearGradient(u,0,v,0);g.addColorStop(dir?1:0,'rgba(226,170,66,0)');g.addColorStop(dir?0:1,'rgba(226,170,66,0.9)');ctx.fillStyle=g;ctx.fillRect(u,y-0.75,v-u,1.5);});
  ctx.restore();
}

// 原版三层光学精灵贴图
function mkSprite(stops){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const SPR_HALO=mkSprite([[0,'rgba(255,228,170,0.9)'],[0.12,'rgba(255,196,96,0.55)'],[0.4,'rgba(226,150,46,0.16)'],[1,'rgba(200,120,30,0)']]);
const SPR_CORE=mkSprite([[0,'rgba(255,250,235,1)'],[0.25,'rgba(255,226,160,0.9)'],[0.6,'rgba(255,190,80,0.25)'],[1,'rgba(255,170,60,0)']]);
const SPR_RED =mkSprite([[0,'rgba(255,195,185,0.9)'],[0.2,'rgba(232,106,88,0.5)'],[1,'rgba(180,40,30,0)']]);
function glow(x,y,r,a=1,spr=SPR_HALO){const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||r<=0.5)return;const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.drawImage(spr,x-r,y-r,2*r,2*r);ctx.globalAlpha=prev;}
function core(x,y,r,a=1){glow(x,y,r,a,SPR_CORE);}

// 原版纸带纤维纹理
const FIBER=(()=>{const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d'),r=mulberry(7);
  for(let i=0;i<900;i++){const x=r()*512,y=r()*128,l=6+r()*40;g.strokeStyle=`rgba(255,215,150,${0.015+r()*0.04})`;g.lineWidth=0.6+r()*0.8;g.beginPath();g.moveTo(x,y);g.lineTo(x+l,y+(r()-0.5)*3);g.stroke();}return c;})();
let FIBER_PAT=null;

// 景深星尘
const DUST=(()=>{const r=mulberry(2026);return Array.from({length:65},()=>({x:r(),y:r(),vx:(r()-0.5)*0.004,vy:-0.003-r()*0.006,r:1.2+r()*2.6,a:0.1+r()*0.25,ph:r()*6.28}));})();

// 节点定义（世界坐标）
const HOSTS=[
  {name:'Claude Code', y:310},
  {name:'Cursor IDE',  y:445},
  {name:'法律助手',     y:580},
  {name:'桌面 Agent',  y:715},
];
const SERVERS=[
  {name:'本地文件',   y:310},
  {name:'最高院案例库',y:445},
  {name:'飞书 · 日历',y:580},
  {name:'企业数据库', y:715},
  {name:'合同库 (新增)',y:835, isNew:true},
];

// 绘制发光星核节点（复用原版“模型光球”美学）
function drawOrbNode(x,y,name,a,isHost,hl=0,amb=0){
  if(a<=0.005)return;
  ctx.save();ctx.globalAlpha*=a;
  const r=26+hl*6;
  ctx.globalCompositeOperation='lighter';
  glow(x,y,r*3.6*(1+0.08*Math.sin(amb*2+y)),0.55+hl*0.45);
  core(x,y,r*0.95,0.95);
  ctx.globalCompositeOperation='source-over';
  // 极细金属外环
  ctx.strokeStyle=hl>0.3?GOLD_HI:'rgba(226,170,66,0.75)';ctx.lineWidth=hl>0.3?2:1.2;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
  text(name,isHost?x-r-22:x+r+22,y,24,hl>0.3?PALE:IVORY,1,hl>0.3?700:400,isHost?'right':'left');
  ctx.restore();
}

// 沿路径生长发光光缆
function drawBeam(x1,y1,x2,y2,prog,col,lw=2,a=1,red=false){
  if(prog<=0.005||a<=0.005)return;
  const ex=lerp(x1,x2,prog), ey=lerp(y1,y2,prog);
  ctx.save();ctx.globalAlpha*=a;
  ctx.strokeStyle=col;ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ex,ey);ctx.stroke();
  if(prog>0.05&&prog<0.98){
    ctx.globalCompositeOperation='lighter';
    glow(ex,ey,24,0.85,red?SPR_RED:SPR_HALO);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
}

/* ============================== 主渲染（连续摄影机空间） ============================== */
function render(G,amb){
  const {s,ox,oy,dpr}=view;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(s*dpr,0,0,s*dpr,ox*dpr,oy*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.fillStyle='#030303';ctx.fillRect(0,0,W,H);

  // 背景暖光 + 景深金尘
  const bg=ctx.createRadialGradient(W/2,H*0.48,0,W/2,H*0.48,960);
  bg.addColorStop(0,'rgba(128,84,22,0.17)');bg.addColorStop(0.55,'rgba(60,38,10,0.06)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  DUST.forEach(d=>{const dx=((d.x+amb*d.vx)%1+1)%1*W,dy=((d.y+amb*d.vy)%1+1)%1*H;glow(dx,dy,d.r*3,d.a*(0.55+0.45*Math.sin(amb*1.4+d.ph)));});
  ctx.restore();

  /* ---------- 0. 原版复刻级电影开场 (0 -> 0.55 退净) ---------- */
  const a0=1-seg(G,0.02,0.55);
  if(a0>0.005){
    const intro=clamp(amb/2.4), out=seg(G,0.02,0.55);
    const title='MCP 到底是什么', fs=106, tw=measure(title,fs,700);
    let x=W/2-tw/2; const rnd=mulberry(5); let ci=0;
    ctx.save();
    for(const ch of title){
      const cw=measure(ch,fs,700), ca=seg(intro,0.1+ci*0.04,0.4+ci*0.04);
      const dx=(rnd()-0.5)*220*out, dy=-(35+rnd()*140)*out;
      glowText(ch,x+cw/2+dx,445+(1-ca)*24+dy,fs,PALE,ca*(1-out),700,0.35);
      x+=cw; ci++;
    }
    // 金色流光扫字
    const sw=((amb*0.18)%1.6)-0.3;
    if(intro>0.85&&out<0.4){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const gx=W/2-tw/2+sw*tw, g=ctx.createLinearGradient(gx-160,0,gx+160,0);
      g.addColorStop(0,'rgba(255,240,200,0)');g.addColorStop(0.5,'rgba(255,240,200,0.55)');g.addColorStop(1,'rgba(255,240,200,0)');
      ctx.font=font(fs,700);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=g;ctx.globalAlpha=1-out*2.5;ctx.fillText(title,W/2-tw/2,445);ctx.restore();
    }
    const lw=820*seg(intro,0.28,0.82)*(1-out);
    ctx.globalCompositeOperation='lighter';
    const lg=ctx.createLinearGradient(W/2-lw/2,0,W/2+lw/2,0);lg.addColorStop(0,'rgba(255,200,90,0)');lg.addColorStop(0.5,`rgba(255,214,120,${0.95*(1-out)})`);lg.addColorStop(1,'rgba(255,200,90,0)');
    ctx.fillStyle=lg;ctx.fillRect(W/2-lw/2,540,lw,2);glow(W/2,541,60,0.7*(1-out));ctx.globalCompositeOperation='source-over';
    rich('从 M × N 乱线，到 AI 世界的{暗金光学总线}',W/2,605,32,seg(intro,0.55,1)*(1-out),DIM);
    brandMark(W/2,870,28,seg(intro,0.7,1)*(1-out));
    ctx.restore();
  }

  /* ---------- 1~6. 连续摄影机世界 (G >= 0.45) ---------- */
  const worldA=seg(G,0.45,1.0);
  if(worldA>0.005){
    // 五次方平滑摄影机：缩放推近核心通路，再拉远纳入底部纸带
    const camX = kf(G,[[1,960],[7,960],[8,960],[13,960],[14,960]], easeCam);
    const camY = kf(G,[[1,540],[7,540],[8,385],[13,385],[14,555],[15,540]], easeCam);
    const camZ = kf(G,[[1,1.0],[7,1.0],[8,1.38],[13,1.38],[14,0.88],[15,0.92]], easeCam);

    // 关键状态进度
    const aHosts   = seg(G,0.5,1.0);
    const aServers = seg(G,1.2,2.0);
    const pSpag    = seg(G,2.15,3.0);                    // M x N 乱线
    const pNewNode = seg(G,3.15,4.0);                    // 第 5 个节点「合同库」
    const pBus     = seg(G,4.2,5.0);                     // 拆乱线，立 MCP 总线
    const pConn    = seg(G,5.15,6.0);                    // M + N 正交接入
    const pPlug    = seg(G,6.15,7.0);                    // 合同库 1 根线接入
    const decoDim  = kf(G,[[7.2,0],[8,0.86],[13.3,0.86],[14,0]]); // 景深压暗其余节点
    const pRpcReq  = seg(G,11.2,12.0);                   // JSON-RPC 请求脉冲
    const pRpcRes  = seg(G,12.2,13.0);                   // JSON-RPC 结果回传
    const pTape    = seg(G,13.2,14.0);                   // 底部纸带展开
    const pFin     = seg(G,14.3,15.0);                   // 终局落版

    ctx.save();
    ctx.globalAlpha=worldA;
    ctx.translate(W/2,H/2);ctx.scale(camZ,camZ);ctx.translate(-camX,-camY);

    const lx=460, rx=1460, busX=960;

    // 1. M × N 乱线（Step 3-4，在 Step 5 随 pBus 坍缩消散）
    const spagVis = pSpag*(1-pBus);
    if(spagVis>0.01){
      HOSTS.forEach((h,i)=>{
        SERVERS.forEach((sv,j)=>{
          if(sv.isNew && pNewNode<0.05)return;
          const p = sv.isNew ? pNewNode*(1-pBus) : clamp(spagVis*1.4-(i*0.07+j*0.05));
          drawBeam(lx+28,h.y,rx-28,sv.y,p,sv.isNew?'rgba(255,140,120,0.85)':'rgba(232,106,88,0.45)',sv.isNew?2:1.3,1-pBus,true);
        });
      });
      text(pNewNode>0.4?'每加 1 个工具，4 个 AI 全部重连！':'M × N = 16 条定制耦合线',busX,885,24,RED,spagVis,700);
    }

    // 2. 中央暗金光学总线（Step 5 起生长并常驻）
    if(pBus>0.01){
      const bTop=245, bBot=lerp(760,865,pPlug);
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      // 总线发光芯
      const g=ctx.createLinearGradient(busX-36,0,busX+36,0);
      g.addColorStop(0,'rgba(226,170,66,0)');g.addColorStop(0.5,`rgba(255,208,98,${0.28*pBus})`);g.addColorStop(1,'rgba(226,170,66,0)');
      ctx.fillStyle=g;ctx.fillRect(busX-36,bTop,72,(bBot-bTop)*pBus);
      ctx.globalCompositeOperation='source-over';
      // 双轨金线
      drawBeam(busX-5,bTop,busX-5,bBot,pBus,GOLD_HI,2.2,1);
      drawBeam(busX+5,bTop,busX+5,bBot,pBus,GOLD,1.6,0.8);
      glowText('MCP',busX,bTop-34,30,GOLD_HI,pBus,700,0.45);
      text('标准光学总线',busX,bTop-8,15,DIM,pBus*(1-decoDim*0.7));

      // M + N 正交光路接入（Step 6）
      if(pConn>0.01){
        HOSTS.forEach((h,i)=>{
          const isF=(i===0), a=isF?1:(1-decoDim);
          drawBeam(lx+28,h.y,busX-6,h.y,pConn,isF&&decoDim>0.2?GOLD_HI:GOLD,isF&&decoDim>0.2?2.8:1.6,a);
          if(pConn>0.85){ctx.globalCompositeOperation='lighter';core(busX-6,h.y,6,a);ctx.globalCompositeOperation='source-over';}
        });
        SERVERS.forEach((sv,j)=>{
          if(sv.isNew)return;
          const isF=(j===1), a=isF?1:(1-decoDim);
          drawBeam(busX+6,sv.y,rx-28,sv.y,pConn,isF&&decoDim>0.2?GOLD_HI:GOLD,isF&&decoDim>0.2?2.8:1.6,a);
          if(pConn>0.85){ctx.globalCompositeOperation='lighter';core(busX+6,sv.y,6,a);ctx.globalCompositeOperation='source-over';}
        });
      }
      // 第 5 个工具「合同库」1 根线吸上总线（Step 7）
      if(pPlug>0.01){
        const y5=SERVERS[4].y, a5=1-decoDim;
        drawBeam(rx-28,y5,busX+6,y5,pPlug,GOLD_HI,2.6,a5);
        if(pPlug>0.8){ctx.globalCompositeOperation='lighter';glow(busX+6,y5,36,a5*0.8);core(busX+6,y5,8,a5);ctx.globalCompositeOperation='source-over';}
        text('1 根线接入 → 全网打通',1210,y5-28,18,GOLD_HI,pPlug*a5,700);
      }
      ctx.restore();
    }

    // 3. 绘制左右发光星核节点
    HOSTS.forEach((h,i)=>{
      const isF=(i===0), a=aHosts*(isF?1:(1-decoDim));
      drawOrbNode(lx,h.y,h.name,a,true,isF&&decoDim>0.2?1:0,amb);
    });
    SERVERS.forEach((sv,j)=>{
      const baseA=sv.isNew?pNewNode:aServers;
      const isF=(j===1), a=baseA*(isF?1:(1-decoDim));
      drawOrbNode(rx,sv.y,sv.name,a,false,(isF&&decoDim>0.2)||(sv.isNew&&pPlug>0.4)?1:0,amb);
    });

    // 4. 三大标准原语聚焦卡片（Step 9-11，在聚焦态下浮现于总线下方）
    const prims=[
      {step:9,  t:'Tools · 工具',     d:'模型可调用的动作：search_cases( ) / read_file( )'},
      {step:10, t:'Resources · 资源', d:'可直接挂载的只读数据：合同原文 / 法规条文'},
      {step:11, t:'Prompts · 模板',   d:'服务端预置的标准化提示词与工作流入口'},
    ];
    prims.forEach(pr=>{
      const pa=bump(G,pr.step,0.52); if(pa<=0.01)return;
      const py=548+(1-pa)*14;
      ctx.save();ctx.globalAlpha*=pa;
      rr(busX-320,py-46,640,92,10);ctx.fillStyle='rgba(18,14,6,0.92)';ctx.fill();ctx.strokeStyle=GOLD_HI;ctx.lineWidth=1.8;ctx.stroke();
      glowText(pr.t,busX,py-14,24,GOLD_HI,1,700,0.4);
      text(pr.d,busX,py+20,17,IVORY,0.92);
      ctx.restore();
    });

    // 5. 运行时 JSON-RPC 光点脉冲（Step 12-13）
    if(pRpcReq>0.02 && pTape<0.8){
      const yH=HOSTS[0].y, yS=SERVERS[1].y;
      const ra=(1-pTape*1.25);
      ctx.save();ctx.globalAlpha*=clamp(ra);
      // 请求光点：Host -> Bus -> Server
      const t1 = pRpcRes<0.1 ? ((amb*0.55)%1) : 1;
      if(pRpcRes<0.3){
        let px,py;
        if(t1<0.4){px=lerp(lx+28,busX,t1/0.4);py=yH;}
        else if(t1<0.6){px=busX;py=lerp(yH,yS,(t1-0.4)/0.2);}
        else{px=lerp(busX,rx-28,(t1-0.6)/0.4);py=yS;}
        ctx.globalCompositeOperation='lighter';glow(px,py,38,1);core(px,py,9,1);ctx.globalCompositeOperation='source-over';
        text('JSON-RPC 请求：search_cases("第585条")',busX,545,20,GOLD_HI,pRpcReq*(1-pRpcRes*3),700);
      }
      // 返回光点：Server -> Bus -> Host
      if(pRpcRes>0.05){
        const t2=(amb*0.55)%1; let px,py;
        if(t2<0.4){px=lerp(rx-28,busX,t2/0.4);py=yS;}
        else if(t2<0.6){px=busX;py=lerp(yS,yH,(t2-0.4)/0.2);}
        else{px=lerp(busX,lx+28,(t2-0.6)/0.4);py=yH;}
        ctx.globalCompositeOperation='lighter';glow(px,py,42,1);core(px,py,10,1);ctx.globalCompositeOperation='source-over';
        text('JSON-RPC 返回：3 份最高院类案摘要',busX,545,20,PALE,pRpcRes,700);
      }
      ctx.restore();
    }

    // 6. 底部无缝衔接原版纤维打孔纸带（Step 14-15）
    if(pTape>0.01){
      const ty=965, th=126, tx=180, tw=1560;
      ctx.save();ctx.globalAlpha*=pTape;
      // 纸带本体 + 纤维 + 齿孔
      const tgr=ctx.createLinearGradient(0,ty-th/2,0,ty+th/2);
      tgr.addColorStop(0,'rgba(78,56,20,0.72)');tgr.addColorStop(0.5,'rgba(26,18,7,0.76)');tgr.addColorStop(1,'rgba(78,56,20,0.72)');
      ctx.fillStyle=tgr;ctx.fillRect(tx,ty-th/2,tw,th);
      if(!FIBER_PAT)FIBER_PAT=ctx.createPattern(FIBER,'repeat');
      ctx.fillStyle=FIBER_PAT;ctx.fillRect(tx,ty-th/2,tw,th);
      ctx.strokeStyle='rgba(236,184,78,0.92)';ctx.lineWidth=1.8;
      ctx.beginPath();ctx.moveTo(tx,ty-th/2);ctx.lineTo(tx+tw,ty-th/2);ctx.moveTo(tx,ty+th/2);ctx.lineTo(tx+tw,ty+th/2);ctx.stroke();
      for(let hx=tx+20;hx<tx+tw-12;hx+=36){[ty-th/2+9,ty+th/2-9].forEach(hy=>{ctx.fillStyle='#030303';ctx.fillRect(hx-2,hy-2,4,4);});}

      const segs=[
        [380,'MCP 工具定义（写入前端）','search_cases( ) · read_file( )',GOLD_HI],
        [480,'用户提问 + 模型发出调用请求','模型自己不运行工具，只写下请求',IVORY],
        [630,'MCP Server 返回结果（写回末尾）','整根纸带再送回模型 → 生成最终回答',PALE]
      ];
      let sx=tx+24;
      segs.forEach(([w,t,sub,col])=>{
        rr(sx,ty-42,w,84,7);ctx.fillStyle='rgba(12,10,5,0.72)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
        text(t,sx+w/2,ty-12,18,col,1,700);text(sub,sx+w/2,ty+16,14,DIM,1);sx+=w+16;
      });
      ctx.restore();
    }

    ctx.restore(); // 结束摄影机变换
  }

  /* ---------- 终局收束落版 (Step 15) ---------- */
  const finA=seg(G,14.4,15.0);
  if(finA>0.01){
    ctx.save();ctx.globalAlpha=finA;
    rich('一次封装，随处接入——{MCP} 让 Agent 真正连上现实世界',W/2,92,34,1,IVORY);
    brandMark(W/2,1018,24,1);
    ctx.restore();
  }

  /* ---------- 顶部引导语（严格先退后进，零叠字） & 右下角进度 ---------- */
  const lo=Math.floor(G), hi=Math.min(LAST,Math.ceil(G)), f=G-lo;
  const ha=STEPS[lo].hint, hb=STEPS[hi].hint;
  if(ha===hb) rich(ha,W/2,92,34,0.95);
  else {
    const aOut=1-ease(clamp(f/0.38)), aIn=ease(clamp((f-0.5)/0.42));
    if(aOut>0.01) rich(ha,W/2,92-(1-aOut)*10,34,0.95*aOut);
    if(aIn>0.01) rich(hb,W/2,92+(1-aIn)*10,34,0.95*aIn);
  }
  const st=STEPS[Math.round(G)];
  text(`${String(st.scene).padStart(2,'0')} · ${SCENES[st.scene]}    ${Math.round(G)+1} / ${STEPS.length}`,1860,1040,18,'rgba(244,237,223,0.52)',1,400,'right');
  ctx.fillStyle='rgba(244,237,223,0.16)';ctx.fillRect(1660,1058,200,2);
  ctx.fillStyle=GOLD;ctx.fillRect(1660,1058,200*G/LAST,2);
  ctx.restore();
}

/* ==================== 交互（与你原版完全一致的手感） ==================== */
let G=0, target=0, anim=null, auto=false; const t0=performance.now();
function go(i){
  i=clamp(Math.round(i),0,LAST);if(i===target&&!anim)return;
  const from=G, fwd=i===Math.round(target)+1&&i>from;
  target=i;anim={from,to:i,start:performance.now(),dur:fwd?STEPS[i].dur:Math.min(850,350+Math.abs(i-from)*60),linear:fwd};
}
function next(){go(target+1);} function prev(){go(target-1);}
function tick(now){
  if(anim){
    const p=clamp((now-anim.start)/anim.dur);
    G=anim.linear?lerp(anim.from,anim.to,p):lerp(anim.from,anim.to,ease(p));
    if(p>=1){G=anim.to;anim=null;if(auto&&G<LAST)setTimeout(()=>auto&&go(target+1),700);}
  }
  render(G,(now-t0)/1000);requestAnimationFrame(tick);
}
addEventListener('keydown',e=>{
  if(e.target.id==='lesson-back')return;

  const k=e.key;
  if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();prev();}
  else if(k==='Home')go(0); else if(k==='End')go(LAST);
  else if(k==='f'||k==='F')toggleFS();
  else if(k==='a'||k==='A'){auto=!auto;if(auto)next();}
});
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,b:e.button};});
cv.addEventListener('pointerup',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y,b=pd.b;pd=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();return;}
  if(Math.abs(dx)<14&&Math.abs(dy)<14){if(b===2)prev();else e.shiftKey?prev():next();}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();prev();});
const fsBtn=document.getElementById('fs');
function toggleFS(){const d=document,el=d.documentElement;if(!d.fullscreenElement)el.requestFullscreen?.();else d.exitFullscreen?.();}
fsBtn.addEventListener('pointerdown',e=>e.stopPropagation());
fsBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleFS();});

requestAnimationFrame(tick);
})();
</script></body></html>
