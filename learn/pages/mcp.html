<script src="../assets/lesson-engine.js"></script>
<script>
// @title MCP 到底是什么 · AI 应用接工具的统一插口
// @desc 各自对接是 M × N，统一协议后是 M + N（可拖动工具数量对比）；MCP Server 提供工具、资源、提示模板；运行时按 JSON-RPC 调用、结果回传；工具说明放在纸带前部，结果写回纸带末尾。
(function(){'use strict';
const {C,LY,ctx,clamp,lerp,ease,seg,lin,bump,damp,text,glowText,rich,measure,rr,glow,glowAdd,card,block,tape,line,arrowHead,qbez,S}=LE;
const {IVORY,GOLD,GOLD_HI,PALE,DIM,DIM2,RED,GREEN,ICE,PURPLE}=C;
const SCENES=['开场','各自对接','统一协议','动手加工具','Server 里有什么','一次调用','回到纸带','收束'];
const STEPS=[
 S('title',0,2600,''),
 S('sides',1,2800,'左边是各种 {AI 应用}，右边是外部的{工具与数据}'),
 S('mesh',1,3000,'各自对接：每一对都要单独写一套，{M × N}'),
 S('bus',2,3000,'{MCP}：大家都只对接{同一套协议}，M × N 变成 {M + N}'),
 S('add',2,2800,'新增「合同库」：写一个 MCP Server，所有支持 MCP 的应用都能接'),
 S('drag',3,1800,'{拖动}右侧工具的数量，比一比 M × N 和 M + N',true),
 S('prims',4,3400,'一个 MCP Server 可提供三类东西：{工具}（可执行的动作）、{资源}（可读的数据）、{提示模板}'),
 S('req',5,3000,'运行时：应用按协议发出调用请求（{JSON-RPC}），例如调用「检索案例」工具'),
 S('res',5,2800,'Server 在外部执行，把{结构化结果}沿原路送回'),
 S('tape',6,3200,'落回纸带：工具的{名称、说明、参数格式}放在纸带前部，调用结果写回{纸带末尾}'),
 S('cost',6,3000,'接的工具越多，前部的说明越长——工具也要{按需接入}'),
 S('final',7,3200,''),
];
const SI={};STEPS.forEach((s,i)=>SI[s.id]=i);const LAST=STEPS.length-1;
const HOSTS=['Claude Code','Cursor','法律助手','客服机器人'];const M=HOSTS.length;
const SERV=['文件系统','邮箱','日历','数据库','案例库','合同库','网页搜索','飞书','Git','工商查询','裁判文书','知识库'];
let nUser=null,nDisp=6;
function geo(){const P=LY.port,H=LY.H;
  if(!P)return{P,hx:360,sx:1560,bx:960,top:250,bot:900,tapeC:{x:960,y:540+1150}};
  return{P,hy:560,sy:H-640,by:H*0.5,tapeC:{x:540,y:H*0.5+H*1.1}};}
function hostPos(g,i){if(!g.P)return{x:g.hx,y:lerp(g.top+60,g.bot-60,(i+0.5)/M-0.5/M+0.5/M*0)};return{x:lerp(150,930,i/(M-1)),y:g.hy};}
function hp(g,i){if(!g.P){const y=g.top+90+i*((g.bot-g.top-180)/(M-1));return{x:g.hx,y};}return{x:lerp(160,920,i/(M-1)),y:g.hy};}
function sp(g,j,n){if(!g.P){const y=n<=1?(g.top+g.bot)/2:g.top+40+j*((g.bot-g.top-80)/(n-1));return{x:g.sx,y};}
  const cols=n<=4?n:Math.ceil(n/2),row=n<=4?0:Math.floor(j/cols),col=n<=4?j:j%cols,cc=n<=4?n:cols;return{x:cc<=1?540:lerp(150,930,col/(cc-1)),y:g.sy+row*120};}
function node(x,y,lab,st,a,P,fs){if(a<=0.01)return;const w=P?Math.max(170,measure(lab,fs||26,700)+30):Math.max(200,measure(lab,fs||24,700)+40),h=P?70:64;block(x-w/2,y-h/2,w,h,{style:st,a,lw:1.8});text(lab,x,y,fs||(P?24:24),IVORY,a,700);}
function render(G,amb,dt){const W=LY.W,H=LY.H,P=LY.port;const g=geo();
  LE.bg(amb,0,0);
  LE.title('MCP 到底是什么','AI 应用接工具的{统一插口}',LE.easeOut(clamp(amb/1.8)),seg(G,0.05,0.6),{portLines:['MCP','到底是什么']});
  if(G<0.3)return;const fin=1-seg(G,LAST-0.7,LAST);
  const pan=LE.easeCam(clamp((G-(SI.tape-0.9))/0.8));const zin=seg(G,SI.prims-0.85,SI.prims-0.2)*(1-seg(G,SI.req-0.85,SI.req-0.3));
  const at=LE.isAt('drag');if(at&&nUser!=null)nDisp=damp(nDisp,nUser,dt,10);else if(!at)nDisp=G<SI.add-0.5?5:6;
  let n=G<SI.add-0.5?5:Math.round(nDisp);if(G>SI.drag+0.01)n=6;
  // 镜头：推近案例库
  const target=sp(g,4,n);const rqz=P?0:seg(G,SI.req-0.8,SI.req-0.3)*(1-seg(G,SI.tape-0.9,SI.tape-0.5));const cx=lerp(lerp(W/2,target.x-(P?0:260),zin),g.tapeC.x,pan),cy=lerp(lerp(H/2+rqz*110,target.y+(P?-300:0),zin),g.tapeC.y,pan),z=lerp(1,P?1.0:1.25,zin)*(1-0.12*bump(G,SI.tape-0.5,0.5))*(1-0.14*rqz);
  ctx.save();LE.camera(cx,cy,z);
  const gA=seg(G,0.4,1)*(1-seg(G,SI.tape-0.5,SI.tape-0.2))*fin;
  const mesh=seg(G,SI.mesh-0.8,SI.mesh-0.2),bus=seg(G,SI.bus-0.8,SI.bus-0.2);
  if(gA>0.01){
    // 连线
    for(let i=0;i<M;i++){const h=hp(g,i);for(let j=0;j<n;j++){const s=sp(g,j,n);const isNew=j>=5&&G<SI.drag;const ap=isNew?seg(G,SI.add-0.6,SI.add-0.1):1;
      const mA=mesh*(1-bus)*gA*ap;if(mA>0.01){ctx.globalAlpha=mA*0.55;ctx.strokeStyle=j===5?RED:'rgba(244,237,223,0.6)';ctx.lineWidth=1.3;ctx.beginPath();if(P){ctx.moveTo(h.x,h.y+35);ctx.bezierCurveTo(h.x,g.by,s.x,g.by,s.x,s.y-35);}else{ctx.moveTo(h.x+100,h.y);ctx.bezierCurveTo(g.bx,h.y,g.bx,s.y,s.x-100,s.y);}ctx.stroke();ctx.globalAlpha=1;}}}
    if(bus>0.01){const ba=bus*gA;// 总线
      if(!P){const gr=ctx.createLinearGradient(g.bx-14,0,g.bx+14,0);gr.addColorStop(0,'rgba(255,190,80,0)');gr.addColorStop(0.5,'rgba(255,214,120,0.95)');gr.addColorStop(1,'rgba(255,190,80,0)');ctx.globalAlpha=ba;ctx.fillStyle=gr;ctx.fillRect(g.bx-14,g.top-20,28,g.bot-g.top+40);ctx.globalAlpha=1;glowText('MCP',g.bx,g.top-56,40,GOLD_HI,ba*(1-seg(G,SI.req-0.8,SI.req-0.4)*(1-seg(G,SI.tape-0.9,SI.tape-0.6))),700);}
      else{const gr=ctx.createLinearGradient(0,g.by-14,0,g.by+14);gr.addColorStop(0,'rgba(255,190,80,0)');gr.addColorStop(0.5,'rgba(255,214,120,0.95)');gr.addColorStop(1,'rgba(255,190,80,0)');ctx.globalAlpha=ba;ctx.fillStyle=gr;ctx.fillRect(60,g.by-14,960,28);ctx.globalAlpha=1;glowText('MCP',540,g.by-50,44,GOLD_HI,ba,700);}
      const ln=(p,isH,ap,col)=>{ctx.globalAlpha=ba*ap;ctx.strokeStyle=col||GOLD;ctx.lineWidth=2.4;ctx.beginPath();if(P){ctx.moveTo(p.x,isH?p.y+35:p.y-35);ctx.lineTo(p.x,g.by);}else{ctx.moveTo(isH?p.x+100:p.x-100,p.y);ctx.lineTo(g.bx,p.y);}ctx.stroke();ctx.globalAlpha=1;};
      for(let i=0;i<M;i++)ln(hp(g,i),true,1);for(let j=0;j<n;j++){const isNew=j>=5&&G<SI.drag;ln(sp(g,j,n),false,isNew?seg(G,SI.add-0.6,SI.add-0.1):1,j===5&&G<SI.drag+0.5?GOLD_HI:null);}
      for(let k=0;k<6;k++){const t=((amb*0.4+k/6)%1);if(P)glowAdd(lerp(60,1020,t),g.by,22,0.7*ba);else glowAdd(g.bx,lerp(g.top,g.bot,t),22,0.7*ba);}}
    for(let i=0;i<M;i++){const h=hp(g,i);node(h.x,h.y,HOSTS[i],'ice',gA*seg(G,SI.sides-0.8+i*0.08,SI.sides-0.4+i*0.08),P);}
    for(let j=0;j<n;j++){const s=sp(g,j,n);const isNew=j>=5&&G<SI.drag;const ap=isNew?seg(G,SI.add-0.6,SI.add-0.1):1;node(s.x,s.y,SERV[j],j===5&&G<SI.drag+0.5?'hot':(j===4&&zin>0.3?'hot':'gold'),gA*ap*seg(G,SI.sides-0.6+j*0.06,SI.sides-0.2+j*0.06),P);}
    if(!P){text('AI 应用（M）',g.hx,g.top-40,24,ICE,gA,700);text('工具与数据（N）',g.sx,g.top-40-(n>6?0:0),24,GOLD_HI,gA,700);}
    else{text('AI 应用（M）',540,g.hy-80,26,ICE,gA,700);text('工具与数据（N）',540,g.sy-80,26,GOLD_HI,gA,700);}
    // 计数
    const cA=gA*seg(G,SI.mesh-0.5,SI.mesh)*(1-zin)*(1-seg(G,SI.req-0.9,SI.req-0.6));if(cA>0.01){const x=P?540:g.bx,y=P?g.by+(bus>0.5?110:0):g.bot+80;
      if(bus<0.5)glowText(`${M} × ${n} = ${M*n} 套对接`,x,P?g.by:y,P?44:40,RED,cA*(1-bus*2),700);
      else rich(`${M} × ${n} = ${M*n}  →  {${M} + ${n} = ${M+n}}`,x,y,P?40:38,cA*(bus*2-1));}
    if(at){const t=dragTrack(g);ctx.globalAlpha=gA;LE.line(t.x0,t.y,t.x1,t.y,'rgba(244,237,223,0.3)',4,1);ctx.globalAlpha=1;[1,4,8,12].forEach(v=>text(String(v),lerp(t.x0,t.x1,(v-1)/11),t.y+(P?36:30),P?22:18,DIM,gA,700));
      const kx=lerp(t.x0,t.x1,(nDisp-1)/11);ctx.globalAlpha=gA;ctx.beginPath();ctx.arc(kx,t.y,14,0,7);ctx.fillStyle=GOLD_HI;ctx.fill();ctx.globalAlpha=1;glowAdd(kx,t.y,34,0.8);if(nUser==null)LE.dragHint(kx,t.y,'拖动：工具数量',amb,1,{dy:-44});}
    // 三类能力
    if(zin>0.01){const s=sp(g,4,n);const cw=P?620:520,x=P?s.x-cw/2:s.x-cw-150,y=P?s.y-760:s.y-250;const za=zin*gA;card(x,y,cw,P?600:500,{a:za,stroke:GOLD_HI});glowText('案例库 · MCP Server',x+30,y+50,P?32:28,GOLD_HI,za,700,0.3,'left');
      const pr=[['工具 Tools','search_cases(关键词) → 检索案例','可执行的动作',GREEN],['资源 Resources','case://2024/某判决书全文','可读取的数据',ICE],['提示模板 Prompts','「类案检索报告」模板','预置的工作流入口',PURPLE]];
      pr.forEach((p,k)=>{const e=seg(G,SI.prims-0.6+k*0.12,SI.prims-0.3+k*0.12)*za;const yy=y+(P?130:120)+k*(P?150:120);text(p[0],x+30,yy,P?28:24,p[3],e,700,'left');text(p[2],x+cw-30,yy,P?22:18,DIM,e,400,'right');text(p[1],x+30,yy+(P?46:40),P?22:19,IVORY,e,400,'left');});}
    // 请求/结果
    const rq=seg(G,SI.req-0.7,SI.req-0.05),rs=seg(G,SI.res-0.7,SI.res-0.05);const showR=seg(G,SI.req-0.8,SI.req-0.4)*(1-seg(G,SI.tape-0.8,SI.tape-0.4));
    if(showR>0.01){const h=hp(g,0),s=sp(g,4,n);const path=t=>{if(P){if(t<0.5){const u=t/0.5;return{x:h.x,y:lerp(h.y+35,g.by,u)};}const u=(t-0.5)/0.5;return{x:lerp(h.x,s.x,Math.min(1,u*2)),y:u<0.5?g.by:lerp(g.by,s.y-35,(u-0.5)*2)};}
        if(t<0.3)return{x:lerp(h.x+100,g.bx,t/0.3),y:h.y};if(t<0.7)return{x:g.bx,y:lerp(h.y,s.y,(t-0.3)/0.4)};return{x:lerp(g.bx,s.x-100,(t-0.7)/0.3),y:s.y};};
      const p1=path(rq*(1-rs)+ (rs>0?1-rs:0)*0);const pk=rs>0.01?path(1-rs):path(rq);glowAdd(pk.x,pk.y,50,0.9*showR*gA,rs>0.01?LE.SPR.GREEN:LE.SPR.HALO);
      const bx=P?90:600,by=P?g.by+170:g.bot+60,bw=P?900:720;const js=rs<0.3?['{ "method": "tools/call",','  "params": { "name": "search_cases",','    "arguments": { "q": "违约金 调减" } } }']:['{ "result": { "content": [','  { "type": "text", "text": "共 3 件类案：…" } ] } }'];
      card(bx,by,bw,P?190:170,{a:showR*gA,stroke:rs>0.3?'rgba(91,214,160,0.8)':'rgba(143,216,255,0.8)'});text(rs<0.3?'请求（JSON-RPC，示意）':'结果（示意）',bx+24,by+32,P?22:18,rs<0.3?ICE:GREEN,showR*gA,700,'left');
      js.forEach((l,k)=>text(l,bx+24,by+(P?76:68)+k*(P?36:30),P?22:19,PALE,showR*gA,400,'left'));}}
  // 纸带场景
  const tA=seg(G,SI.tape-0.6,SI.tape-0.1)*fin;
  if(tA>0.01){const T=g.tapeC;const cs=seg(G,SI.cost-0.8,SI.cost-0.1);const L=P?1500:1700;const a0=P?T.y-L/2:T.x-L/2;if(P)tape(a0,a0+L,T.x-200,330,{vert:true,a:tA});else tape(a0,a0+L,T.y,210,{a:tA});
    const nt=Math.round(lerp(3,12,cs));const segs=[['System','gold',90]];for(let k=0;k<nt;k++)segs.push([k<3?['search_cases','read_file','send_mail'][k]:`工具 ${k+1}`,'ice',P?lerp(110,70,cs):lerp(130,80,cs)]);
    segs.push(['用户提问','gold',P?140:200],['调用 search_cases','hot',P?150:220],['结果：3 件类案','green',P?150:220]);
    let a=a0+20;const total=segs.reduce((s2,x)=>s2+x[2]+8,0);const over=Math.max(0,total-(L-40));
    segs.forEach(([t,st,w],k)=>{w=w-(k>0&&k<=nt?over/nt:0);const e=seg(tA,Math.min(0.6,k*0.04),Math.min(1,0.4+k*0.04));if(P){block(T.x-200-140,a,280,w,{style:st,a:tA*e});if(w>40)rich(t,T.x-200,a+w/2,22,tA*e,{maxW:250,weight:700});}else{block(a,T.y-76,w,152,{style:st,a:tA*e});rich(t,a+w/2,T.y,20,tA*e,{maxW:w-12,weight:700});}a+=w+8;});
    const lab=(s,col,frac)=>{if(P)text(s,T.x+0,a0+L*frac,26,col,tA,700,'left');else text(s,a0+L*frac,T.y-150,26,col,tA,700);};
    lab(cs>0.5?`工具说明 × ${nt}：越接越长`:'工具说明（名称 · 用途 · 参数格式）',ICE,P?0.18:0.22);lab('结果写回末尾',GREEN,P?0.88:0.86);
    if(cs>0.3)rich('只接这次需要的工具，或用按需加载的方式（如 Skill）',P?540:T.x,P?T.y+L/2+60:T.y+150,P?26:24,tA*cs,{maxW:P?960:0});}
  ctx.restore();
  LE.finale(['各自对接是 {M × N}，统一走 {MCP} 是 {M + N}','Server 提供{工具}、{资源}、{提示模板}；调用走 {JSON-RPC}','落回纸带：{工具说明}在前部，{调用结果}写回末尾'],seg(G,LAST-0.8,LAST),'MCP（Model Context Protocol）由 Anthropic 于 2024 年发布；示例中的工具名、请求与结果为示意，以官方规范为准。');}
function dragTrack(g){return g.P?{x0:160,x1:920,y:g.sy+300}:{x0:1300,x1:1820,y:g.bot+90};}
const drags=[{step:'drag',cursor:'ew-resize',hit:pt=>{const t=dragTrack(geo());return pt.x>t.x0-50&&pt.x<t.x1+50&&Math.abs(pt.y-t.y)<60;},move:pt=>{const t=dragTrack(geo());nUser=1+clamp((pt.x-t.x0)/(t.x1-t.x0))*11;}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{nUser=null;},onSeek:(g,st)=>{nUser=st.n??null;if(nUser!=null)nDisp=nUser;}});
})();

</script></body></html>
