// @title KV Cache 与 Prompt Caching · 纸带上的「冰封」缓存

(function(){'use strict';

const STEPS=[
 S('title',0,2600,''),
 S('recomp',1,4200,'没有缓存时：每生成一个新词，前面{所有位置}的 K、V 都要重算一遍'),
 S('kv',2,4200,'{KV Cache}：算过的 K、V 存进显存「冻住」，下一步直接复用，只为{新的一格}计算'),
 S('count',2,2600,'以生成 8 个词为例：重算 1+2+…+8 = {36} 次，缓存后只需 {8} 次'),

const TOK=['违约金','过分','高于','损失','，','可以','请求','减少'];

const QS={t:'新提问',k:0.3,w:170},TS={t:'当前时间 06:19',k:0.02,w:200};
const FULL=SEGS.reduce((a,s)=>a+s.k,0)+QS.k+TS.k;
let slotUser=null,slotDisp=null,CAM={x:960,y:540,z:1};
function geoA(){const P=LY.port,H=LY.H;if(!P)return{P,x0:250,step:180,w:150,y:600,chipY:[412,462]};
  return{P,y0:470,step:Math.min(150,(H-470-560)/8),h:116,x:330,w:380,chipX:[640,740]};}
function geoB(){const P=LY.port,H=LY.H;if(!P)return{P,ox:2300,oy:0,a0:110,L:1700,c:500,th:170,bh:126};
  return{P,ox:0,oy:H*1.15,a0:400,L:H-400-560,c:540,th:600,bh:520};}
function segLayout(gb,slot){const P=gb.P,sc=P?(gb.L-60)/(SEGS.reduce((a,s)=>a+s.w,0)+QS.w+TS.w+12*6):1;const gap=12;

function RB(gb,a0,a1,h){return gb.P?[gb.ox+gb.c-h/2,gb.oy+gb.a0+a0,h,a1-a0]:[gb.ox+gb.a0+a0,gb.oy+gb.c-h/2,a1-a0,h];}

    ctx.fillStyle=k%3?'rgba(170,230,255,0.75)':'rgba(240,122,98,0.8)';ctx.beginPath();ctx.moveTo(0,-sz);ctx.lineTo(sz*0.6,sz*0.4);ctx.lineTo(-sz*0.5,sz*0.6);ctx.closePath();ctx.fill();ctx.restore();}ctx.restore();}
function render(G,amb,dt){const W=LY.W,H=LY.H,P=LY.port;const ga=geoA(),gb=geoB();
  const mv=LE.easeCam(clamp((G-(SI.count+0.15))/0.85));const pull=Math.sin(Math.PI*mv);
  const c1=P?{x:540,y:H/2+20}:{x:960,y:560},c2=P?{x:540,y:gb.oy+H/2+20}:{x:gb.ox+960,y:560};

  LE.title('KV Cache 与 Prompt Caching','算过的就{别再算}：从单次生成到跨请求复用',LE.easeOut(clamp(amb/1.8)),seg(G,0.05,0.6),{portLines:['KV Cache','与 Prompt Caching'],portSize:96});
  if(G<0.25)return;

  LE.finale(['生成时：{KV Cache} 让算过的位置不再重算','跨请求：前缀{一字不差}，才能命中 Prompt Caching','排布：{不变的放前面}，时间戳等会变的内容放后面'],seg(G,LAST-0.8,LAST),'价格以 Anthropic 官方文档为例（读缓存 0.1×、5 分钟写入 1.25×）；其他厂商规则不同。token 数与成本条为示意。');}
function actA(G,amb,g){const P=g.P;const inA=seg(G,0.3,1);

    const p=pos(i);const bw=g.w,bh=P?g.h:110;block(p.x-bw/2,p.y-bh/2,bw,bh,{style:i===cur-1?'hot':'gold',a:a*appear});

    const kvA=a*appear;const flash=!inKV?clamp(1-frac*3)*(i<cur):(i===cur-1?clamp(1-frac*3):0);const frozen=inKV&&i<cur-1?1:0;

      ctx.globalAlpha=kvA;rr(cp.x-w/2,cp.y-h/2,w,h,8);ctx.fillStyle=frozen?'rgba(143,216,255,0.18)':'rgba(255,208,98,0.14)';ctx.fill();ctx.strokeStyle=frozen?ICE:GOLD;ctx.lineWidth=1.4;ctx.stroke();ctx.globalAlpha=1;
      text(lab,cp.x,cp.y,P?30:22,frozen?ICE:GOLD_HI,kvA,700);if(flash>0.01)glowAdd(cp.x,cp.y,P?60:46,0.9*flash);});}
  const done=Math.floor(n+1e-6);const ops=inKV?done:done*(done+1)/2;
  const pA=inA*(1-seg(G,SI.count-0.6,SI.count-0.2));const px=P?540:960,py=P?g.y0+8*g.step+90:790;
  if(pA>0.01){rich(inKV?'本步只算{新的一格}的 K、V':`本步重算 {${done}} 个位置的 K、V`,px,py,P?36:28,pA);text(`累计计算：${ops} 次`,px,py+(P?56:44),P?30:22,inKV?ICE:DIM,pA,700);
    if(inKV)text('浅蓝 = 已缓存（存放在显存里）',px,py+(P?100:80),P?26:19,DIM2,pA);}
  const cA=seg(G,SI.count-0.7,SI.count)*(1-seg(G,SI.count+0.3,SI.count+0.8));
  if(cA>0.01){const bx=P?140:560,bw=800,by=P?g.y0+8*g.step+70:770;
    [['不缓存',36,GOLD],['KV Cache',8,ICE]].forEach(([lab,v,col],k)=>{const y=by+k*(P?100:70),w=bw*v/36*lin(G,SI.count-0.6,SI.count-0.1);
      text(lab,bx,y-(P?34:0),P?30:22,col,cA,700,P?'left':'right');const x0=P?bx:bx+20;ctx.globalAlpha=cA;rr(x0,y-(P?0:12),w,P?26:24,6);ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1;
      text(String(v)+' 次',x0+w+14,y+(P?13:0),P?30:22,col,cA,700,'left');});
    text('只数 K、V 的计算次数；注意力本身仍要读全部缓存',P?540:960,by+(P?230:150),P?26:19,DIM2,cA);}}
function actB(G,amb,dt,g){const P=g.P;const inA=seg(G,SI.count+0.5,SI.agent);
  let sT=kf(G,[[SI.shatter,0],[SI.drag,0],[SI.rule,4]]);if(LE.isAt('drag')&&slotUser!=null)sT=slotUser;

  const ts=L.ts,q=[lerp(L0.q[0]-L0.ts[1]+L0.ts[0]-12,L.q[0],tsIn),0];q[1]=q[0]+(L.q[1]-L.q[0]);
  if(P)tape(g.oy+g.a0-24,g.oy+g.a0+g.L+24,g.ox+g.c,g.th,{vert:true,a:inA});else tape(g.ox+g.a0-24,g.ox+g.a0+g.L+24,g.oy+g.c,g.th,{a:inA});
  const invalid=i=>G>SI.stamp-0.05&&tsIn>0.5&&(pos[i][0]+pos[i][1])/2>ts[0];
  SEGS.forEach((s,i)=>{const [x,y,w,h]=RB(g,pos[i][0],pos[i][1],g.bh);const a=inA*seg(G,SI.count+0.6+i*0.08,SI.agent-0.2+i*0.06);
    block(x,y,w,h,{style:invalid(i)&&G>SI.shatter-0.3&&G<SI.rule-0.3?'dim':'gold',a});
    text(s.t,x+w/2,y+h/2-(P?16:14),P?36:26,IVORY,a,700);text(`约 ${s.k}k token`,x+w/2,y+h/2+(P?26:22),P?26:18,DIM,a);});
  {const [x,y,w,h]=RB(g,q[0],q[1],g.bh);block(x,y,w,h,{style:'hot',a:inA});text(QS.t,x+w/2,y+h/2,P?34:24,GOLD_HI,inA,700);}
  const rA=inA*(1-seg(G,SI.pc-0.4,SI.pc));if(rA>0.01){const k=1+Math.floor(lin(G,SI.agent-0.7,SI.agent-0.05)*2.99);const [x,y,w,h]=RB(g,q[0],q[1],g.bh);
    rich(`第 {${k}} 轮请求：整段前缀再发一遍`,P?g.ox+540:x+w/2-200,P?y+h+70:y-60,P?34:26,rA);}
  const iceA=seg(G,SI.pc-0.7,SI.pc);const shatT=lin(G,SI.shatter-0.8,SI.shatter-0.1);
  SEGS.forEach((s,i)=>{const [x,y,w,h]=RB(g,pos[i][0],pos[i][1],g.bh);const after=invalid(i);
    let crack=0;if(after)crack=G<SI.drag-0.5?clamp(shatT*1.4-i*0.12):1;
    const a=iceA*(after&&crack>=1?(G>=SI.drag-0.5?0:1-clamp((shatT-0.7)/0.3)):1);ice(x,y,w,h,a,amb+i,crack);

    if(after&&crack>=1)text('需重算',x+w/2,y+(P?h-26:h+28),P?26:19,RED,inA*tsIn*(1-seg(G,SI.rule-0.3,SI.rule)),700);});
  if(tsIn>0.01){const [x,y,w,h]=RB(g,ts[0],ts[1],g.bh);const drop=(1-tsIn)*(P?-200:-160);ctx.save();if(P)ctx.translate(drop,0);else ctx.translate(0,drop);
    block(x,y,w,h,{style:'red',a:tsIn,lw:2});text('当前时间',x+w/2,y+h/2-(P?18:15),P?32:22,RED,tsIn,700);text('06:19（每轮都变）',x+w/2,y+h/2+(P?24:20),P?26:17,PALE,tsIn);ctx.restore();
    if(STEPS[Math.round(G)].id==='drag'&&LE.isAt('drag'))LE.dragHint(x+w/2,y+h/2,slotUser==null?(P?'↕ 拖动':'← 拖动 →'):'',amb,1,{dy:P?0:g.bh/2+36,dx:P?-g.bh/2-110:0,r:34});}
  const mA=seg(G,SI.price-0.7,SI.price)*(1-seg(G,SI.vram-0.6,SI.vram-0.2));
  const mx=P?g.ox+140:g.ox+g.a0+180,my=P?g.oy+g.a0+g.L+120:g.oy+g.c+g.bh/2+110,mw=P?800:1000;
  if(mA>0.01){let cached=0;SEGS.forEach((s,i)=>{if(!invalid(i))cached+=s.k;});if(G<SI.price-0.2)cached=0;const cost=cached*0.1+(FULL-cached);
    text('本轮输入成本（相对值，示意）',mx,my-(P?40:30),P?28:20,DIM,mA,400,'left');

    text(cached>0?`命中 ${cached}k token × 0.1，其余全价`:'全部按全价计算',mx+mw,my+(P?70:52),P?26:19,cached>0?ICE:RED,mA,400,'right');}

function w2(pt){return{x:(pt.x-LY.W/2)/CAM.z+CAM.x,y:(pt.y-LY.H/2)/CAM.z+CAM.y};}
const drags=[{step:'drag',cursor:'grab',hit:pt=>{const g=geoB(),p=w2(pt);return LY.port?Math.abs(p.x-(g.ox+g.c))<g.bh/2+140&&p.y>g.oy+g.a0-40&&p.y<g.oy+g.a0+g.L+40:Math.abs(p.y-(g.oy+g.c))<g.bh/2+140&&p.x>g.ox+g.a0-40&&p.x<g.ox+g.a0+g.L+40;},
  move:pt=>{const g=geoB(),p=w2(pt);const a=(LY.port?p.y-g.oy:p.x-g.ox)-g.a0;const L=segLayout(g,0);let acc=0;const bounds=[0];SEGS.forEach(sg=>{acc+=sg.w*L.sc+12;bounds.push(acc);});
    let k=4;for(let i=0;i<4;i++){if(a<bounds[i+1]){k=i+clamp((a-bounds[i])/(bounds[i+1]-bounds[i]));break;}}slotUser=clamp(k,0,4);},
  end:()=>{if(slotUser!=null)slotUser=Math.round(slotUser);}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{slotUser=null;},onSeek:(g,st)=>{slotUser=st.slot??null;slotDisp=null;}});
})();
