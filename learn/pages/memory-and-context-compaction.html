(function(){'use strict';

      text(`第 ${k} 轮 · 已压缩 ${st.comp} 次`,P?g.c:g.a0+g.L/2,P?g.a0-40:g.c-g.th/2-36,P?30:22,GOLD_HI,inA,700);

const LIDX={};{let k=0,d=0;TURNS.slice(0,nFull-KEEPN).forEach(t=>{LIDX[t.id]=KEEP[t.t]?k++:d++;});}
function lensPos(g,t,i,srt){const L=g.lens,P=g.P,keep=!!KEEP[t.t],j=LIDX[t.id];
