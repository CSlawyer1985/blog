<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>Evals 评测与防退化 · 光学风洞与自动校准靶场</title>

<style>

#dock::-webkit-scrollbar{display:none}

.sbtn:hover{color:#FFE9B8;border-color:rgba(226,170,66,.35)}

<canvas id="c"></canvas>
<div id="tools">
  <button class="tbtn" id="autoBtn" title="自动播放 (A)">自动 A</button>
  <button class="tbtn" id="cleanBtn" title="纯净录屏 (H)">纯净 H</button>
  <button class="tbtn" id="fsBtn" title="全屏 (F)">全屏 F</button>
</div>
<div id="dock"></div>
<script>
(function(){
'use strict';
const FONT='"HSerif","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const IVORY='#F4EDDF', GOLD='#E2AA42', GOLD_HI='#FFD062', PALE='#FFE9B8', DIM='rgba(244,237,223,0.62)', RED='#E86A58', GREEN='#4FD198', BLUE='#6AA9FF', ICE='#7CE8FF';

const SCENES=['开场','盲改困境','黄金测试集','双层裁判透镜','回归校准','评测飞轮'];
const S=(id,scene,dur,hint)=>({id,scene,dur,hint});
const STEPS=[
  S('title',0,2500,''),
  S('vibe_edit',1,2200,'传统盲改：调了一行提示词，肉眼试了 2 个案例觉得变好了，准备直接上线'),
  S('regress_pain',1,2600,'隐性退化（{Regression}）：A 场景修好了，没测到的 B、C 老场景却暗中崩了！'),
  S('golden_set',2,2500,'工程解法：把真实案件与刁钻边界题沉淀为{黄金测试集 (Golden Dataset)}'),
  S('wind_tunnel',2,2600,'将新版 Skill 放入{光学风洞}，并发射入全部标准考题，拒绝“凭感觉”'),
  S('code_grader',3,2600,'第一层透镜：{确定性代码裁判}——毫秒级硬校验格式、数学计算与法条引用'),
  S('llm_judge',3,2600,'第二层透镜：{LLM-as-a-Judge}——由独立裁判模型按评分量表（Rubric）评判逻辑与口径'),
  S('diff_matrix',4,2800,'{回归校准靶盘}亮起：新版 v1.1 修好了 4 题，但揪出 2 道核心红线题发生退化！'),
  S('gate_block',4,2400,'发布闸门自动亮红拦截——在用户踩坑之前，把退化死死挡在风洞里'),
  S('fix_pass',4,2600,'定向修复后重跑风洞：通过率跃升至 {97%}、红线退化归零，绿灯放行上线'),
  S('flywheel',5,2600,'{评测飞轮 (Eval Flywheel)}：线上每次真实报错，都立刻沉淀为第 N+1 道新考题'),
  S('final',5,2600,''),
];
const LAST=STEPS.length-1;
const SCENE_FIRST=SCENES.map((_,i)=>STEPS.findIndex(s=>s.scene===i));

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeCam=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;
const seg=(G,a,b)=>ease(clamp((G-a)/(b-a)));
function kf(G,pts,fn=ease){if(G<=pts[0][0])return pts[0][1];for(let i=0;i<pts.length-1;i++){if(G<=pts[i+1][0]){const a=pts[i],b=pts[i+1];return lerp(a[1],b[1],fn((G-a[0])/(b[0]-a[0])));}}return pts[pts.length-1][1];}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ==================== 画布与原版光学贴图 ==================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1920, H=1080; let view={s:1,ox:0,oy:0,dpr:1};
function resize(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';
  const s=Math.min(w/W,h/H);view={s,ox:(w-W*s)/2,oy:(h-H*s)/2,dpr};
}
addEventListener('resize',resize); resize();

const mcache=new Map();
function font(sz,wt=400){return `${wt} ${sz}px ${FONT}`;}
function measure(t,sz,wt=400){const k=t+'|'+wt;let v=mcache.get(k);if(v===undefined){ctx.font=font(100,wt);v=ctx.measureText(t).width/100;mcache.set(k,v);}return v*sz;}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function text(str,x,y,sz,col,a=1,wt=400,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.font=font(sz,wt);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(str,x,y);ctx.globalAlpha=prev;
}
function glowText(str,x,y,sz,col,a=1,wt=700,blur=0.45,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  ctx.save();ctx.shadowColor=col===ICE?'rgba(124,232,255,0.65)':'rgba(255,186,60,0.6)';ctx.shadowBlur=sz*blur;text(str,x,y,sz,col,a,wt,al);ctx.restore();
}
function rich(str,x,y,sz,a=1,col=IVORY){
  if(ctx.globalAlpha*clamp(a)<=0.004||!str)return;
  const parts=[];str.split(/(\{[^}]*\})/).forEach(s=>{if(!s)return;if(s[0]==='{')parts.push([s.slice(1,-1),1]);else parts.push([s,0]);});
  let tw=0;parts.forEach(p=>{p[2]=measure(p[0],sz,p[1]?700:400);tw+=p[2];});let x0=x-tw/2;
  parts.forEach(p=>{if(p[1])glowText(p[0],x0,y,sz,GOLD_HI,a,700,0.45,'left');else text(p[0],x0,y,sz,col,a,400,'left');x0+=p[2];});
}
function brandMark(x,y,sz,a=1){
  if(ctx.globalAlpha*clamp(a)<=0.004)return;
  const s1='陈石律师',s2='  ·  ',s3='chenshi.ai';
  const w1=measure(s1,sz*0.8),w2=measure(s2,sz*0.8),w3=measure(s3,sz,700),tw=w1+w2+w3;let x0=x-tw/2;
  text(s1,x0,y,sz*0.8,IVORY,a*0.78,400,'left');x0+=w1;text(s2,x0,y,sz*0.8,GOLD,a*0.8,400,'left');x0+=w2;glowText(s3,x0,y,sz,GOLD_HI,a,700,0.3,'left');
}

function mkSprite(stops){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const SPR_HALO=mkSprite([[0,'rgba(255,228,170,0.9)'],[0.14,'rgba(255,196,96,0.52)'],[1,'rgba(200,120,30,0)']]);
const SPR_CORE=mkSprite([[0,'rgba(255,250,235,1)'],[0.25,'rgba(255,226,160,0.9)'],[1,'rgba(255,170,60,0)']]);
const SPR_RED =mkSprite([[0,'rgba(255,195,185,0.92)'],[0.2,'rgba(232,106,88,0.5)'],[1,'rgba(180,40,30,0)']]);
const SPR_GRN =mkSprite([[0,'rgba(180,255,220,0.92)'],[0.2,'rgba(79,209,152,0.5)'],[1,'rgba(20,120,80,0)']]);
const SPR_ICE =mkSprite([[0,'rgba(210,248,255,0.95)'],[0.2,'rgba(124,232,255,0.52)'],[1,'rgba(40,140,200,0)']]);
function glow(x,y,r,a=1,spr=SPR_HALO){const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||r<=0.5)return;const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.drawImage(spr,x-r,y-r,2*r,2*r);ctx.globalAlpha=prev;}
function core(x,y,r,a=1){glow(x,y,r,a,SPR_CORE);}

const DUST=(()=>{const r=mulberry(2038);return Array.from({length:60},()=>({x:r(),y:r(),vx:(r()-0.5)*0.004,vy:-0.003-r()*0.006,r:1.2+r()*2.5,a:0.1+r()*0.22,ph:r()*6.28}));})();

// 32 格测试靶盘（4 列 × 8 行）：固定标出 4 个新修复格与 2 个隐性退化红线格
const CELLS = Array.from({length:32},(_,i)=>({
  col: i % 4, row: Math.floor(i / 4),
  improved: [3, 11, 18, 26].includes(i),
  regressed: [9, 22].includes(i),
}));

// 绘制光学裁判透镜（弧形玻璃感）
function drawLens(x, y, h, col, title, sub, a){
  if(a<=0.01)return;
  ctx.save();ctx.globalAlpha*=a;
  const w=26;
  ctx.beginPath();
  ctx.moveTo(x, y-h/2);
  ctx.quadraticCurveTo(x+w, y, x, y+h/2);
  ctx.quadraticCurveTo(x-w, y, x, y-h/2);
  ctx.closePath();
  const g=ctx.createLinearGradient(x-w,y-h/2,x+w,y+h/2);
  g.addColorStop(0,'rgba(255,255,255,0.22)');g.addColorStop(0.5,'rgba(124,232,255,0.08)');g.addColorStop(1,'rgba(255,255,255,0.22)');
  ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.stroke();
  ctx.globalCompositeOperation='lighter';glow(x,y,80,0.35,col===ICE?SPR_ICE:SPR_HALO);ctx.globalCompositeOperation='source-over';
  glowText(title, x, y-h/2-34, 19, col, 1, 700, 0.3);
  text(sub, x, y+h/2+26, 14, DIM, 1);
  ctx.restore();
}

/* ============================== 主渲染 ============================== */
function render(G,amb){
  const {s,ox,oy,dpr}=view;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(s*dpr,0,0,s*dpr,ox*dpr,oy*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.fillStyle='#030304';ctx.fillRect(0,0,W,H);

  // 背景精密网格 + 暖光 + 金尘
  ctx.strokeStyle='rgba(226,170,66,0.022)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const bg=ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,960);
  bg.addColorStop(0,'rgba(120,84,26,0.15)');bg.addColorStop(0.6,'rgba(24,48,68,0.06)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  DUST.forEach(d=>{const dx=((d.x+amb*d.vx)%1+1)%1*W,dy=((d.y+amb*d.vy)%1+1)%1*H;glow(dx,dy,d.r*3,d.a*(0.55+0.45*Math.sin(amb*1.4+d.ph)));});
  ctx.restore();

  /* ---------- 0. 开场标题 (0 -> 0.55) ---------- */
  const a0=1-seg(G,0.02,0.55);
  if(a0>0.005){
    const intro=clamp(amb/2.4), out=seg(G,0.02,0.55);
    const title='Evals 评测与防退化', fs=98, tw=measure(title,fs,700);
    let x=W/2-tw/2; const rnd=mulberry(53); let ci=0;
    ctx.save();
    for(const ch of title){
      const cw=measure(ch,fs,700), ca=seg(intro,0.06+ci*0.028,0.34+ci*0.028);
      const dx=(rnd()-0.5)*220*out, dy=-(35+rnd()*140)*out;
      glowText(ch,x+cw/2+dx,445+(1-ca)*24+dy,fs,PALE,ca*(1-out),700,0.35);
      x+=cw; ci++;
    }
    const lw=820*seg(intro,0.28,0.82)*(1-out);
    ctx.globalCompositeOperation='lighter';
    const lg=ctx.createLinearGradient(W/2-lw/2,0,W/2+lw/2,0);lg.addColorStop(0,'rgba(124,232,255,0)');lg.addColorStop(0.5,`rgba(124,232,255,${0.95*(1-out)})`);lg.addColorStop(1,'rgba(124,232,255,0)');
    ctx.fillStyle=lg;ctx.fillRect(W/2-lw/2,540,lw,2);glow(W/2,541,60,0.7*(1-out),SPR_ICE);ctx.globalCompositeOperation='source-over';
    rich('{光学风洞} · {双层裁判透镜} · {回归校准靶盘}',W/2,605,31,seg(intro,0.55,1)*(1-out),DIM);
    brandMark(W/2,870,28,seg(intro,0.7,1)*(1-out));
    ctx.restore();
  }

  /* ---------- 1. 盲改打地鼠困境 (G: 0.45 -> 2.65) ---------- */
  const vibeA=seg(G,0.45,1.0)*(1-seg(G,2.2,2.75));
  if(vibeA>0.005){
    const pReg=seg(G,1.2,2.0);
    ctx.save();ctx.globalAlpha=vibeA;
    // 左侧：改了一行 Prompt
    rr(220,380,440,280,14);ctx.fillStyle='rgba(28,22,11,0.92)';ctx.fill();ctx.strokeStyle=GOLD_HI;ctx.lineWidth=2;ctx.stroke();
    glowText('Prompt / Skill v1.1',440,445,26,GOLD_HI,1,700,0.35);
    text('“加了一句：请重点审查违约金比例”',440,515,19,IVORY,1);
    text('肉眼抽测 2 个案例 → 感觉不错！',440,585,18,GREEN,1,700);

    // 右侧：3 个真实场景（A 亮绿，B/C 暗中闪红崩溃！）
    const cases=[
      {t:'场景 A · 违约金审查', ok:true,  y:345},
      {t:'场景 B · 诉讼时效核查', ok:false, y:520},
      {t:'场景 C · 管辖条款审查', ok:false, y:695},
    ];
    cases.forEach(cs=>{
      const bad = !cs.ok && pReg>0.2;
      ctx.strokeStyle=bad?RED:GREEN;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(665,520);ctx.lineTo(1060,cs.y);ctx.stroke();
      rr(1065,cs.y-52,580,104,12);
      ctx.fillStyle=bad?'rgba(85,20,16,0.78)':'rgba(14,56,42,0.68)';ctx.fill();
      ctx.strokeStyle=bad?RED:GREEN;ctx.lineWidth=2;ctx.stroke();
      if(bad){ctx.globalCompositeOperation='lighter';glow(1355,cs.y,110,0.4*pReg,SPR_RED);ctx.globalCompositeOperation='source-over';}
      text(cs.t,1355,cs.y-14,21,bad?RED:GREEN,1,700);
      text(bad?'✕ 隐性退化：原本正常，改完后反而漏判！':'✓ 抽测通过',1355,cs.y+20,16,IVORY,0.95);
    });
    ctx.restore();
  }

  /* ---------- 2~5. 光学风洞连续摄影机舞台 (G >= 2.5) ---------- */
  const windA=seg(G,2.5,3.1);
  if(windA>0.005){
    // 五次方运镜：Step 5-6 推近双层裁判透镜，Step 7-9 移向右侧回归靶盘，Step 10 拉远看评测飞轮
    const camX = kf(G,[[3,960],[4,960],[5,1050],[6,1120],[7,1340],[9,1340],[10,960],[11,960]], easeCam);
    const camY = kf(G,[[3,540],[4,540],[5,540],[6,540],[7,540],[9,540],[10,540],[11,540]], easeCam);
    const camZ = kf(G,[[3,1.0],[4,1.0],[5,1.18],[6,1.18],[7,1.16],[9,1.16],[10,0.94],[11,0.92]], easeCam);

    const pBeams = seg(G,3.2,4.0);
    const pCode  = seg(G,4.2,5.0);
    const pJudge = seg(G,5.2,6.0);
    const pDiff  = seg(G,6.2,7.0);
    const pBlock = seg(G,7.2,8.0)*(1-seg(G,8.3,9.0));
    const pFix   = seg(G,8.3,9.0);
    const pWheel = seg(G,9.3,10.0);
    const pFin   = seg(G,10.4,11.0);

    ctx.save();ctx.globalAlpha=windA;
    ctx.translate(W/2,H/2);ctx.scale(camZ,camZ);ctx.translate(-camX,-camY);

    const srcX=230, agentX=610, lens1X=920, lens2X=1150, gridX=1410;

    // 1. 左侧：黄金测试集发射器（Golden Dataset）
    rr(srcX-130,275,260,530,14);ctx.fillStyle='rgba(26,20,10,0.9)';ctx.fill();ctx.strokeStyle=GOLD_HI;ctx.lineWidth=2.2;ctx.stroke();
    glowText('Golden Set',srcX,330,24,GOLD_HI,1,700,0.35);
    text('黄金测试集 (100 题)',srcX,364,15,DIM,1);
    ['• 历史真实案件','• 刁钻边界陷阱','• 必守合规红线','• 格式与计算题'].forEach((it,i)=>{
      text(it,srcX-95,435+i*62,17,IVORY,0.9,400,'left');
    });
    if(pWheel>0.2){
      text('+ 第 101 题 (线上新错题)',srcX,735,16,GREEN,pWheel,700);
    }

    // 2. 光学风洞并发光束（从 Golden Set 射穿 Agent 与双层透镜，直达右侧靶盘）
    if(pBeams>0.01){
      const endX = lerp(srcX+135, gridX-25, pBeams);
      for(let i=0;i<9;i++){
        const y=320+i*55;
        const isRegBeam = (i===2 || i===6) && pDiff>0.2 && pFix<0.5;
        const col = isRegBeam ? 'rgba(232,106,88,0.65)' : (pFix>0.5 ? 'rgba(79,209,152,0.52)' : 'rgba(255,208,98,0.38)');
        ctx.strokeStyle=col;ctx.lineWidth=isRegBeam?2.4:1.4;
        ctx.beginPath();ctx.moveTo(srcX+132,y);ctx.lineTo(endX,y);ctx.stroke();
        // 流动光粒
        const pt=((amb*0.7+i*0.13)%1);
        const px=lerp(srcX+132,endX,pt);
        ctx.save();ctx.globalCompositeOperation='lighter';
        glow(px,y,16,0.75,isRegBeam?SPR_RED:(pFix>0.5?SPR_GRN:SPR_HALO));
        ctx.restore();
      }
    }

    // 3. 风洞中央：被测 Agent / Skill 核心
    ctx.save();
    ctx.globalCompositeOperation='lighter';glow(agentX,540,115,0.55);core(agentX,540,28,0.95);ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=pFix>0.5?GREEN:GOLD_HI;ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(agentX,540,44,0,Math.PI*2);ctx.stroke();
    glowText(pFix>0.5?'Skill v1.2':'Skill v1.1',agentX,540,20,pFix>0.5?GREEN:PALE,1,700,0.3);
    text('风洞被测版本',agentX,608,16,DIM,1);
    ctx.restore();

    // 4. 双层裁判透镜（Code Grader & LLM-as-a-Judge）
    drawLens(lens1X, 540, 470, ICE, 'Code Grader', '确定性校验 · 格式/数学/引用', pCode);
    drawLens(lens2X, 540, 470, GOLD_HI, 'LLM-as-a-Judge', '按量表评判逻辑、口径与完整性', pJudge);

    // 5. 右侧：32 格回归校准靶盘（Step 7 起亮起）
    if(pDiff>0.01){
      const cw=68, ch=52, gap=10;
      const gW=4*cw+3*gap, gH=8*ch+7*gap;
      const gx0=gridX, gy0=540-gH/2;

      ctx.save();ctx.globalAlpha*=pDiff;
      rr(gx0-18,gy0-52,gW+36,gH+112,14);ctx.fillStyle='rgba(16,14,9,0.92)';ctx.fill();
      ctx.strokeStyle=pBlock>0.2?RED:(pFix>0.5?GREEN:GOLD);ctx.lineWidth=2.2;ctx.stroke();
      text(pFix>0.5?'✓ 回归靶盘 (v1.2 · 全绿通过)':'回归校准靶盘 (v1.1 vs v1.0)',gx0+gW/2,gy0-24,18,pFix>0.5?GREEN:PALE,1,700);

      CELLS.forEach(c=>{
        const cx=gx0+c.col*(cw+gap), cy=gy0+c.row*(ch+gap);
        const isRed = c.regressed && pFix < 0.5;
        const isImp = c.improved || (c.regressed && pFix >= 0.5);
        rr(cx,cy,cw,ch,5);
        ctx.fillStyle = isRed ? 'rgba(232,106,88,0.42)' : (isImp ? 'rgba(79,209,152,0.34)' : 'rgba(79,209,152,0.14)');
        ctx.fill();
        ctx.strokeStyle = isRed ? RED : (isImp ? GREEN : 'rgba(79,209,152,0.45)');
        ctx.lineWidth = (isRed||isImp) ? 2 : 1;ctx.stroke();
        if(isRed){
          ctx.globalCompositeOperation='lighter';glow(cx+cw/2,cy+ch/2,36,0.75,SPR_RED);ctx.globalCompositeOperation='source-over';
          text('退化!',cx+cw/2,cy+ch/2,14,RED,1,700);
        } else if(isImp){
          text('↑ 修复',cx+cw/2,cy+ch/2,13,GREEN,1,700);
        } else {
          text('✓',cx+cw/2,cy+ch/2,15,GREEN,0.75);
        }
      });

      // 靶盘底部统计与发布闸门状态
      const footY=gy0+gH+30;
      if(pBlock>0.1){
        text('⛔ 发现 2 项红线退化 · 阻断上线！',gx0+gW/2,footY,17,RED,1,700);
      } else if(pFix>0.4){
        text('🚀 通过率 97% · 0 退化 · 绿灯放行',gx0+gW/2,footY,17,GREEN,pFix,700);
      } else {
        text('修复 +4 题  |  隐性退化 -2 题',gx0+gW/2,footY,16,GOLD_HI,1,700);
      }
      ctx.restore();
    }

    // 6. Step 10: 评测飞轮回流弧线（线上新错题 -> 回到左侧 Golden Set）
    if(pWheel>0.02){
      ctx.save();ctx.globalAlpha*=pWheel;
      ctx.strokeStyle=GREEN;ctx.lineWidth=2.6;ctx.setLineDash([10,7]);ctx.lineDashOffset=-amb*45;
      ctx.beginPath();ctx.moveTo(gridX+140,830);ctx.quadraticCurveTo(960,965,srcX,810);ctx.stroke();ctx.setLineDash([]);
      text('↺ 线上真实报错自动沉淀为新考题 · 靶场越打越厚（Eval Flywheel）',960,905,20,GREEN,1,700);
      ctx.restore();
    }

    ctx.restore(); // 结束摄影机变换
  }

  /* ---------- 终局收束落版 (Step 11) ---------- */
  const finA=seg(G,10.4,11.0);
  if(finA>0.01){
    ctx.save();ctx.globalAlpha=finA;
    rich('没有 {Evals} 的迭代叫盲人摸象，有了 {Evals} 才是真正的工程演进',W/2,92,32,1,IVORY);
    brandMark(W/2,965,26,1);
    ctx.restore();
  }

  // 电影暗角
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.38,W/2,H/2,W*0.66);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

  /* ---------- 顶部引导语（先退后进，零叠字） & 进度 ---------- */
  const lo=Math.floor(G), hi=Math.min(LAST,Math.ceil(G)), f=G-lo;
  const ha=STEPS[lo].hint, hb=STEPS[hi].hint;
  if(ha===hb) rich(ha,W/2,92,33,0.95);
  else {
    const aOut=1-ease(clamp(f/0.38)), aIn=ease(clamp((f-0.5)/0.42));
    if(aOut>0.01) rich(ha,W/2,92-(1-aOut)*10,33,0.95*aOut);
    if(aIn>0.01) rich(hb,W/2,92+(1-aIn)*10,33,0.95*aIn);
  }
  const st=STEPS[Math.round(G)];
  text(`${String(st.scene).padStart(2,'0')} · ${SCENES[st.scene]}    ${Math.round(G)+1} / ${STEPS.length}`,1860,1025,18,'rgba(244,237,223,0.52)',1,400,'right');
  ctx.fillStyle='rgba(244,237,223,0.16)';ctx.fillRect(1620,1044,240,2);
  ctx.fillStyle=GOLD;ctx.fillRect(1620,1044,240*G/LAST,2);
  ctx.restore();
}

/* ==================== 交互与播控 ==================== */
let G=0, target=0, anim=null, auto=false; const t0=performance.now();
const dock=document.getElementById('dock');
SCENES.forEach((name,idx)=>{
  const b=document.createElement('button');b.className='sbtn';b.textContent=`${String(idx).padStart(2,'0')} ${name}`;
  b.addEventListener('pointerdown',e=>e.stopPropagation());
  b.addEventListener('pointerup',e=>{e.stopPropagation();go(SCENE_FIRST[idx]);});
  dock.appendChild(b);
});
function syncDock(){const sc=STEPS[Math.round(target)].scene;dock.querySelectorAll('.sbtn').forEach((b,i)=>b.classList.toggle('active',i===sc));}
function go(i){
  i=clamp(Math.round(i),0,LAST);if(i===target&&!anim)return;
  const from=G, fwd=i===Math.round(target)+1&&i>from;
  target=i;anim={from,to:i,start:performance.now(),dur:fwd?STEPS[i].dur:Math.min(850,350+Math.abs(i-from)*60),linear:fwd};syncDock();
}
function next(){go(target+1);} function prev(){go(target-1);}
function tick(now){
  if(anim){
    const p=clamp((now-anim.start)/anim.dur);
    G=anim.linear?lerp(anim.from,anim.to,p):lerp(anim.from,anim.to,ease(p));
    if(p>=1){G=anim.to;anim=null;if(auto&&G<LAST)setTimeout(()=>auto&&go(target+1),700);}
  }
  render(G,(now-t0)/1000);requestAnimationFrame(tick);
}
let idleTimer=null;
function wake(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>document.body.classList.add('idle'),3200);}
['mousemove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wake)); wake();

const autoBtn=document.getElementById('autoBtn'), cleanBtn=document.getElementById('cleanBtn'), fsBtn=document.getElementById('fsBtn');
function toggleAuto(){auto=!auto;autoBtn.classList.toggle('on',auto);autoBtn.textContent=auto?'自动中':'自动 A';if(auto)next();}
function toggleClean(){document.body.classList.toggle('clean');}
function toggleFS(){const d=document,el=d.documentElement;if(!d.fullscreenElement)el.requestFullscreen?.();else d.exitFullscreen?.();}
[autoBtn,cleanBtn,fsBtn].forEach(b=>b.addEventListener('pointerdown',e=>e.stopPropagation()));
autoBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleAuto();});
cleanBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleClean();});
fsBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleFS();});

addEventListener('keydown',e=>{
  if(e.target.id==='lesson-back')return;

  const k=e.key;
  if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();prev();}
  else if(k==='Home')go(0); else if(k==='End')go(LAST);
  else if(k==='f'||k==='F')toggleFS();
  else if(k==='a'||k==='A')toggleAuto();
  else if(k==='h'||k==='H')toggleClean();
});
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,b:e.button};});
cv.addEventListener('pointerup',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y,b=pd.b;pd=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();return;}
  if(Math.abs(dx)<14&&Math.abs(dy)<14){if(b===2)prev();else e.shiftKey?prev():next();}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();prev();});

syncDock(); requestAnimationFrame(tick);
})();
</script></body></html>
