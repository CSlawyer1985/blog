<script>
// @title Evals 评测与防退化 · 改一行提示词，怎么知道没改坏别处
// @desc 凭感觉改提示词容易让老场景悄悄退化；用固定测试集、代码判分与模型评审、新旧版本逐题对比和红线闸门，把退化挡在上线前；线上问题再补成新题。
(function(){'use strict';
const {C,LY,ctx,clamp,lerp,ease,seg,lin,bump,damp,text,glowText,rich,measure,rr,glow,glowAdd,card,block,tape,line,arrowHead,qbez,S}=LE;
const {IVORY,GOLD,GOLD_HI,PALE,DIM,DIM2,RED,GREEN,ICE,PURPLE}=C;
const SCENES=['开场','凭感觉改','测试集','两层判分','逐题对比','动手切版本','评测飞轮','收束'];
const STEPS=[
 S('title',0,2600,''),
 S('vibe',1,3000,'凭感觉改：改了一行提示词，试了 2 个例子都不错，就想上线'),
 S('regress',1,3000,'可没测到的老场景，可能{悄悄变差}——这叫{退化（Regression）}'),
 S('golden',2,3000,'解法：把真实案件、刁钻边界、红线题沉淀成一套{固定测试集}，每题写清期望'),
 S('run',2,2800,'每次改动，都把{整套题}跑一遍，不靠印象'),
 S('code',3,3000,'第一层：{代码判分}——格式、金额计算、引用编号这类能写成规则的，直接用程序校验'),
 S('judge',3,3000,'第二层：{模型评审}——按评分细则（Rubric）打分；评审本身也要人工抽查校准'),
 S('diff',4,3200,'新旧版本{逐题对比}：v1.1 修好了 4 题，却有 2 题从通过变成不通过（题目数为示意）'),
 S('gate',4,2800,'总通过率还上升了，但其中一题是{红线题}——发布闸门不放行'),
 S('drag',5,1800,'{拖动}版本滑块，对比 v1.0 / v1.1 / v1.2 每道题的结果',true),
 S('fix',5,2800,'定向修复成 v1.2，{重跑整套题}：红线全过，闸门放行'),
 S('fly',6,3200,'{评测飞轮}：线上每发现一个新问题，就补成一道新题，测试集越用越厚'),
 S('final',7,3200,''),
];
const SI={};STEPS.forEach((s,i)=>SI[s.id]=i);const LAST=STEPS.length-1;
const N=20,RL=new Set([2,5,9,14]);
const FAILS=[new Set([3,7,11,15,18]),new Set([5,12,18]),new Set([18])];const VER=['v1.0','v1.1','v1.2'];
const CAT=i=>RL.has(i)?'红线':(i<8?'真实案件':'边界题');
let vUser=null,vDisp=1;
function geo(){const P=LY.port,H=LY.H;
  if(!P)return{P,cols:5,cw:180,ch:92,gx:200,gy:108,gc:{x:860,y:620},tape:{y:240,x0:420,x1:1500},gate:{x:1640,y:610},track:{x0:560,x1:1240,y:930}};
  return{P,cols:4,cw:200,ch:96,gx:220,gy:112,gc:{x:540,y:H*0.5+40},tape:{y:470,x0:110,x1:970},gate:{x:540,y:H*0.5+40+330+150},track:{x0:200,x1:880,y:H-330}};}
function cpos(g,i){const r=Math.floor(i/g.cols),c=i%g.cols;const rows=Math.ceil(N/g.cols);return{x:g.gc.x+(c-(g.cols-1)/2)*g.gx,y:g.gc.y+(r-(rows-1)/2)*g.gy};}
function status(ver,i){return FAILS[ver].has(i)?0:1;}
function render(G,amb,dt){const W=LY.W,H=LY.H,P=LY.port;const g=geo();
  LE.bg(amb,0,0);
  LE.title('Evals 评测与防退化','改一行提示词，怎么知道{没改坏别处}',LE.easeOut(clamp(amb/1.8)),seg(G,0.05,0.6),{portLines:['Evals','评测与防退化']});
  if(G<0.3)return;const fin=1-seg(G,LAST-0.7,LAST);const inA=seg(G,0.3,1)*fin;
  // 版本纸带（提示词）
  const T=g.tape;const tw=T.x1-T.x0;tape(T.x0-20,T.x1+20,T.y,P?100:96,{a:inA});const parts=['角色设定','分析步骤','输出格式','注意事项'];
  // 当前版本
  let ver=G<SI.diff-0.5?1:(G<SI.fix-0.5?1:2);const at=LE.isAt('drag');if(at){const tgt=vUser==null?1:vUser;vDisp=damp(vDisp,tgt,dt,12);ver=Math.round(vDisp);}else vDisp=ver;
  if(G>SI.drag+0.01&&G<SI.fix-0.5)ver=1;
  parts.forEach((p,k)=>{const x=T.x0+k*tw/4+8,w=tw/4-16;const ed=k===1;const glowE=ed?bump(G,SI.vibe-0.2,0.6):0;block(x,T.y-(P?36:34),w,P?72:68,{style:ed&&G>SI.vibe-0.5?'hot':'gold',a:inA});text(p,x+w/2,T.y,P?26:22,IVORY,inA,700);if(glowE>0)glowAdd(x+w/2,T.y,90,0.6*glowE*inA);});
  glowText(at?VER[Math.round(vDisp)]:(G<SI.vibe-0.4?'v1.0':VER[ver]),P?T.x0+30:T.x0-110,P?T.y-90:T.y,P?32:30,GOLD_HI,inA,700,0.4,P?'left':'center');
  // 两个手测样例
  const vb=seg(G,SI.vibe-0.6,SI.vibe-0.1)*(1-seg(G,SI.regress-0.9,SI.regress-0.5));
  if(vb>0.01){[0,1].forEach(k=>{const x=P?140+k*420:640+k*460,y=P?700:420,w=P?380:400;card(x,y,w,P?110:96,{a:vb*inA});text(`手测样例 ${k+1}`,x+24,y+(P?36:32),P?24:19,DIM,vb*inA,400,'left');glowText('✓ 看起来不错',x+24,y+(P?78:68),P?28:24,GREEN,vb*inA,700,0.3,'left');});}
  // 测试题网格
  const gA=seg(G,SI.regress-0.7,SI.regress-0.2)*inA*(1-seg(G,SI.fly-0.85,SI.fly-0.4));
  const known=G<SI.run-0.5;const runP=seg(G,SI.run-0.8,SI.run-0.1);const cd=seg(G,SI.code-0.8,SI.code-0.1),jd=seg(G,SI.judge-0.8,SI.judge-0.1);const df=seg(G,SI.diff-0.8,SI.diff-0.2)*(1-seg(G,SI.fly-0.8,SI.fly-0.4));
  const gold=seg(G,SI.golden-0.8,SI.golden-0.2);
  for(let i=0;i<N;i++){const p=cpos(g,i);const e=seg(gA,i*0.02,0.6+i*0.02);if(e<=0.01)continue;const x=p.x-g.cw/2,y=p.y-g.ch/2;
    let st='dim';let label=`Q${i+1}`;let s=status(ver,i);
    if(known){if(G>SI.regress-0.4&&(i===5||i===12))st='red';else if(gold>0.5)st='gold';}
    else{const reached=runP>=(i+1)/N*0.9;st=reached?(s?'green':'red'):'gold';}
    block(x,y,g.cw,g.ch,{style:st,a:e,lw:RL.has(i)&&gold>0.3?2.4:1.4});
    text(label,x+(P?18:14),y+(P?26:22),P?24:18,IVORY,e,700,'left');if(gold>0.01)text(CAT(i),x+g.cw-(P?16:12),y+(P?26:22),P?20:15,RL.has(i)?RED:DIM,e*gold,700,'right');
    if(known&&(i===5||i===12)&&G>SI.regress-0.4){text('变差了',x+g.cw/2,y+g.ch*0.68,P?24:18,RED,e*seg(G,SI.regress-0.4,SI.regress),700);}
    else if(known&&G>SI.regress-0.4&&gold<0.5)text('没测',x+g.cw/2,y+g.ch*0.68,P?22:16,DIM2,e*(1-gold),400);
    if(!known&&runP>0.9){const yy=y+g.ch*0.68;
      if(cd>0.01&&jd<0.5)text(s||i!==18?'✓ 格式 ✓ 计算':'✗ 计算错误',x+g.cw/2,yy,P?20:15,s?GREEN:RED,e*cd,700);
      if(jd>0.01&&df<0.3){const sc=s?(4+(i%2)):2;text(`评审 ${sc}/5`,x+g.cw/2,yy,P?22:16,sc>=4?GREEN:RED,e*jd*(1-df),700);}
      if(df>0.01){const prev=status(0,i),now=status(ver,i);const tag=prev===now?'':(now?'修好 ↑':'退化 ↓');if(tag)glowText(tag,x+g.cw/2,yy,P?24:18,now?GREEN:RED,e*df,700,0.3);else text(now?'—':'仍失败',x+g.cw/2,yy,P?20:15,DIM2,e*df,400);}}}
  // 题库说明
  if(gold>0.01&&G<SI.run){rich('每题写清{期望}：结论、依据、金额、不能出现的说法',P?540:g.gc.x,P?cpos(g,N-1).y+g.ch/2+70:cpos(g,N-1).y+g.ch/2+50,P?28:24,gold*inA*(1-seg(G,SI.run-0.6,SI.run-0.2)),{maxW:P?960:0});}
  // 透镜扫描
  const sweep=(t,col,lab)=>{if(t<=0.01||t>=0.999)return;const first=cpos(g,0),last=cpos(g,N-1);const yy=lerp(first.y-g.ch,last.y+g.ch,t);ctx.globalAlpha=0.8*inA;const gr=ctx.createLinearGradient(0,yy-30,0,yy+30);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(0.5,col);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.fillRect(first.x-g.cw,yy-30,(last.x-first.x)+g.cw*2,60);ctx.globalAlpha=1;text(lab,first.x-g.cw/2-14,yy,P?24:20,IVORY,inA,700,'right');};
  sweep(lin(G,SI.code-0.7,SI.code-0.15),'rgba(91,214,160,0.45)',P?'':'代码判分');sweep(lin(G,SI.judge-0.7,SI.judge-0.15),'rgba(195,160,255,0.45)',P?'':'模型评审');
  const rub=jd*(1-seg(G,SI.diff-0.8,SI.diff-0.3));if(rub>0.01){const x=P?90:1270,y=P?cpos(g,N-1).y+g.ch/2+40:300,w=P?900:540;if(!P){}
    card(P?x:1500-0,P?y:250,P?w:380,P?200:300,{a:rub*inA,stroke:'rgba(195,160,255,0.7)'});const bx=P?x:1500,by=P?y:250;text('评分细则（示意）',bx+24,by+38,P?24:20,PURPLE,rub*inA,700,'left');
    ['结论是否明确','依据是否引到条文','金额是否算对','风险是否提示'].forEach((r,k)=>text('· '+r,bx+24+(P&&k%2?440:0),by+(P?90+Math.floor(k/2)*50:84+k*46),P?24:20,IVORY,rub*inA,400,'left'));}
  // 通过率 + 闸门
  const gt=seg(G,SI.gate-0.7,SI.gate-0.1)*fin*(1-seg(G,SI.fly-0.8,SI.fly-0.4));
  const rate=v=>Math.round((N-FAILS[v].size)/N*100);
  if(df>0.01){const vprev=0;const x=P?540:g.gate.x,y=P?cpos(g,0).y-g.ch/2-70:g.gc.y-260;rich(`通过率 ${rate(vprev)}% → {${rate(ver)}%}`,x,y,P?30:28,df*inA);}
  if(gt>0.01){const redFail=[...RL].some(i=>FAILS[ver].has(i));const ok=!redFail;const x=g.gate.x,y=P?g.gate.y:g.gate.y;
    const w=P?600:260,h=P?150:300;card(x-w/2,y-h/2+(P?0:40),w,h,{a:gt,stroke:ok?'rgba(91,214,160,0.9)':'rgba(240,122,98,0.9)'});glowAdd(x,y-(P?20:40),P?50:60,0.8*gt*(0.7+0.3*Math.sin(amb*4)),ok?LE.SPR.GREEN:LE.SPR.RED);
    ctx.globalAlpha=gt;ctx.beginPath();ctx.arc(x,y-(P?20:40),P?22:26,0,7);ctx.fillStyle=ok?GREEN:RED;ctx.fill();ctx.globalAlpha=1;
    glowText(ok?'放行':'拦截',x,y+(P?40:40),P?36:34,ok?GREEN:RED,gt,700);text(ok?'红线题全部通过':'红线题 Q6 退化',x,y+(P?78:96),P?24:20,IVORY,gt,400);text('发布闸门',x,y-(P?60:130),P?24:20,DIM,gt,700);}
  // 版本滑块
  const tk=seg(G,SI.drag-0.6,SI.drag-0.1)*(1-seg(G,SI.fly-0.8,SI.fly-0.4))*fin;
  if(tk>0.01){const t=g.track;LE.line(t.x0,t.y,t.x1,t.y,'rgba(244,237,223,0.35)',4,tk);VER.forEach((v,k)=>{const x=lerp(t.x0,t.x1,k/2);ctx.globalAlpha=tk;ctx.beginPath();ctx.arc(x,t.y,10,0,7);ctx.fillStyle=GOLD;ctx.fill();ctx.globalAlpha=1;text(v,x,t.y+(P?44:36),P?26:20,IVORY,tk,700);});
    const kx=lerp(t.x0,t.x1,(at?vDisp:ver)/2);glowAdd(kx,t.y,40,0.8*tk);ctx.globalAlpha=tk;ctx.beginPath();ctx.arc(kx,t.y,16,0,7);ctx.fillStyle=GOLD_HI;ctx.fill();ctx.globalAlpha=1;if(at&&vUser==null)LE.dragHint(kx,t.y,'拖动',amb,1,{dy:P?-50:-40});}
  // 飞轮
  const fl=seg(G,SI.fly-0.7,SI.fly-0.1)*fin;
  if(fl>0.01){const cx=P?540:g.gc.x,cy=P?g.gc.y+20:g.gc.y,R=P?380:330;const nodes=['线上发现新问题','补成第 21 题','加入测试集','改版本、跑全套','闸门判断上线'];
    ctx.globalAlpha=fl*0.6;ctx.strokeStyle=GOLD;ctx.lineWidth=3;ctx.setLineDash([10,10]);ctx.lineDashOffset=-amb*40;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0;ctx.globalAlpha=1;
    nodes.forEach((n,k)=>{const an=-Math.PI/2+k*2*Math.PI/5;const x=cx+Math.cos(an)*R,y=cy+Math.sin(an)*R;const e=seg(fl,k*0.1,0.5+k*0.1);const w=P?300:270;block(x-w/2,y-(P?40:34),w,P?80:68,{style:k===0?'red':(k===1?'hot':'gold'),a:e});text(n,x,y,P?26:22,IVORY,e,700);});
    const mv=(amb*0.15)%1;const an=-Math.PI/2+mv*2*Math.PI;glowAdd(cx+Math.cos(an)*R,cy+Math.sin(an)*R,30,0.9*fl);
    glowText(`${N+1} 题`,cx,cy-10,P?60:54,GOLD_HI,fl,700);text('测试集越用越厚',cx,cy+(P?50:44),P?26:22,DIM,fl);}
  LE.finale(['凭感觉改，最怕没测到的{老场景悄悄退化}','{固定测试集} + {代码判分} + {模型评审}，每次改动跑全套','{逐题对比}新旧版本，红线退化就{不放行}；线上问题再补成新题'],seg(G,LAST-0.8,LAST),'题目数量、通过率、评审分数与版本号均为示意。模型评审（LLM-as-a-Judge）有偏差，需要定期用人工判分校准。');}
const drags=[{step:'drag',cursor:'ew-resize',hit:pt=>{const t=geo().track;return pt.x>t.x0-60&&pt.x<t.x1+60&&Math.abs(pt.y-t.y)<70;},move:pt=>{const t=geo().track;vUser=clamp((pt.x-t.x0)/(t.x1-t.x0))*2;},end:()=>{if(vUser!=null)vUser=Math.round(vUser);}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{vUser=null;},onSeek:(g,st)=>{vUser=st.v??null;if(vUser!=null)vDisp=vUser;}});
})();

</script></body></html>
