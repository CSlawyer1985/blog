<script src="../assets/lesson-engine.js"></script>
<script>
// @title Hooks 到底是什么 · 提示词是告示牌，Hook 是门锁
// @desc Agent 循环里，提示词里的规矩可能被忽略；Hook 是挂在固定节点、由运行框架执行的脚本：工具前拦截并把理由反馈给模型、工具后自动检查、结束前验收。可拖动请求路径看拦截效果。
(function(){'use strict';
const {C,LY,ctx,clamp,lerp,ease,seg,lin,bump,damp,text,glowText,rich,measure,rr,glow,glowAdd,card,block,tape,line,arrowHead,qbez,S}=LE;
const {IVORY,GOLD,GOLD_HI,PALE,DIM,DIM2,RED,GREEN,ICE,PURPLE}=C;
const SCENES=['开场','Agent 循环','告示牌失灵','挂上 Hook','动手试路径','更多挂载点','收束'];
const STEPS=[
 S('title',0,2600,''),
 S('loop',1,3000,'Agent 在一个{循环}里工作：模型读纸带、提出工具请求，运行框架去执行，结果写回纸带'),
 S('sign',2,2600,'我们在提示词里写：「{不要直接覆盖正式合同}」'),
 S('fail',2,3000,'可模型是按概率生成的：上下文一长，这句话{可能被忽略}，请求照样执行了'),
 S('gate',3,3000,'{Hook}：在循环的固定节点挂一段{脚本}，由运行框架执行，不靠模型自觉'),
 S('block',3,2800,'{PreToolUse}：工具执行前检查——命中规则就{拦下}，不执行'),
 S('bounce',3,3000,'拦截理由{反馈给模型}，它改成写入草稿副本，重新提交，通过'),
 S('drag',4,1800,'{拖动}请求里的文件路径，看 Hook 放不放行',true),
 S('post',5,2800,'{PostToolUse}：工具执行后自动跑脚本——格式化、脱敏、合规检查'),
 S('stop',5,2800,'{Stop}：准备结束前做最后验收；不达标，可以让它继续干'),
 S('all',5,3000,'常见挂载点：会话开始、提交提问、工具前、工具后、结束前……（以 Claude Code 为例）'),
 S('compare',6,3000,'区别：提示词是「{请随手关门}」的告示，Hook 是{装上的门锁}——锁的规则也要写对'),
 S('final',6,3200,''),
];
const SI={};STEPS.forEach((s,i)=>SI[s.id]=i);const LAST=STEPS.length-1;
const PATHS=[['合同/正式合同.docx',0,'正式合同不许直接覆盖'],['合同/草稿/修订稿.docx',1,'草稿目录，放行'],['~/.ssh/id_rsa',0,'案件目录之外，禁止访问']];
let pUser=null,pDisp=0;
function geo(){const P=LY.port,H=LY.H;if(!P)return{P,cx:960,cy:620,rx:600,ry:300};return{P,cx:540,cy:H*0.52,rx:390,ry:640};}
function E(g,deg){const t=deg*Math.PI/180;return{x:g.cx+g.rx*Math.cos(t),y:g.cy+g.ry*Math.sin(t)};}
// 节点角度（land 与 port 用同一套角度；port 椭圆竖长）
const ND=[['纸带（上下文）',180,'gold'],['模型',-90,'hot'],['工具请求',-35,'ice'],['执行工具',35,'gold'],['结果写回纸带',90,'green']];
function nodeBox(g,p,lab,st,a){if(a<=0.01)return;const w=g.P?Math.max(200,measure(lab,26,700)+36):Math.max(170,measure(lab,24,700)+40),h=g.P?72:64;block(p.x-w/2,p.y-h/2,w,h,{style:st,a,lw:1.8});text(lab,p.x,p.y,g.P?26:24,IVORY,a,700);}
function gateAt(g,deg,col,lab,a,amb,closed){if(a<=0.01)return;const p=E(g,deg);const t=deg*Math.PI/180;const nx=Math.cos(t)*(g.P?1:1),ny=Math.sin(t);// 法向近似为径向
  const L=g.P?90:80;ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x-nx*L,p.y-ny*L);ctx.lineTo(p.x+nx*L,p.y+ny*L);ctx.stroke();ctx.lineCap='butt';ctx.globalAlpha=1;
  glowAdd(p.x,p.y,60,0.5*a*(0.7+0.3*Math.sin(amb*4)),col===RED?LE.SPR.RED:(col===GREEN?LE.SPR.GREEN:LE.SPR.HALO));
  if(g.P){const lp={x:p.x-nx*(L+16),y:p.y-ny*(L+16)-34};text(lab,lp.x,lp.y,26,col,a,700,nx>0.3?'right':(nx<-0.3?'left':'center'));}else{const lp={x:p.x+nx*(L+20),y:p.y+ny*(L+20)};text(lab,lp.x,lp.y,22,col,a,700,nx>0.3?'left':(nx<-0.3?'right':'center'));}}
function render(G,amb,dt){const W=LY.W,H=LY.H,P=LY.port;const g=geo();
  LE.bg(amb,0,0);
  LE.title('Hooks 到底是什么','提示词是{告示牌}，Hook 是{门锁}',LE.easeOut(clamp(amb/1.8)),seg(G,0.05,0.6),{portLines:['Hooks','到底是什么']});
  if(G<0.3)return;const fin=1-seg(G,LAST-0.7,LAST);const cmp=seg(G,SI.compare-0.8,SI.compare-0.3);const rA=seg(G,0.4,1)*fin*(1-cmp);
  const zoom=seg(G,SI.all-0.8,SI.all-0.2);ctx.save();LE.camera(g.cx,g.cy,1-0.1*zoom,g.cx,g.cy);
  // 轨道
  if(rA>0.01){ctx.globalAlpha=rA*0.5;ctx.strokeStyle=GOLD;ctx.lineWidth=3;ctx.setLineDash([2,10]);ctx.lineDashOffset=-amb*30;ctx.beginPath();ctx.ellipse(g.cx,g.cy,g.rx,g.ry,0,0,7);ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0;ctx.globalAlpha=1;
    ND.forEach((n,k)=>nodeBox(g,E(g,n[1]),n[0],n[2],rA*seg(G,SI.loop-0.8+k*0.08,SI.loop-0.4+k*0.08)));
    // 光点循环
    if(G<SI.sign-0.3||G>SI.all-0.5){for(let k=0;k<3;k++){const d=((amb*40+k*120)%360)-180;glowAdd(E(g,d).x,E(g,d).y,26,0.8*rA);}}}
  // 告示牌
  const sg=seg(G,SI.sign-0.7,SI.sign-0.1)*(1-seg(G,SI.gate-0.6,SI.gate-0.1)*0.5)*(1-seg(G,SI.post-0.8,SI.post-0.4))*rA;
  if(sg>0.01){const p=E(g,180);const x=P?p.x+60:p.x-120,y=P?p.y+80:p.y+60;card(x,y,P?380:300,P?120:100,{a:sg,stroke:'rgba(255,208,98,0.7)'});text('提示词里写着：',x+20,y+(P?34:28),P?22:18,DIM,sg,400,'left');rich('「不要直接覆盖正式合同」',x+20,y+(P?82:68),P?24:20,sg,{align:'left',maxW:P?340:270,color:PALE,weight:700});}
  // 请求光点（fail / block / bounce / drag）
  const center={x:g.cx,y:g.cy};
  const st=Math.round(G);const sid=STEPS[clamp(st,0,LAST)].id;
  const gt=seg(G,SI.gate-0.7,SI.gate-0.1);
  let decision=null;// 当前请求与结果
  if(G>SI.fail-0.8&&G<SI.post-0.4){let path=0,phase=0;
    if(G<SI.gate-0.5){phase=lin(G,SI.fail-0.6,SI.fail);path=0;decision={pass:true,hook:false};}
    else if(G<SI.bounce-0.5){phase=lin(G,SI.block-0.7,SI.block-0.1);path=0;decision={pass:false,hook:true};}
    else if(G<SI.drag-0.5){phase=lin(G,SI.bounce-0.5,SI.bounce-0.05);path=1;decision={pass:true,hook:true,retry:true};}
    else{const at=LE.isAt('drag');if(at&&pUser!=null)pDisp=damp(pDisp,pUser,dt,12);else pDisp=0;path=clamp(Math.round(pDisp),0,2);phase=at?((amb*0.4)%1):1;decision={pass:!!PATHS[path][1],hook:true};}
    const req=PATHS[path];const from=-35,gateD=0,to=35;let d;const blocked=decision.hook&&!decision.pass;
    if(blocked){d=lerp(from,gateD-4,clamp(phase*1.6));}else d=lerp(from,to,phase);
    const pp=E(g,d);glowAdd(pp.x,pp.y,40,0.95*rA,blocked&&phase>0.6?LE.SPR.RED:LE.SPR.HALO);
    if(blocked&&phase>0.55){// 反弹回模型
      const bp=lin(phase,0.6,1);const q=qbez(E(g,-4),center,E(g,-90),bp);glowAdd(q.x,q.y,26,0.8*rA,LE.SPR.RED);}
    // 中央说明卡
    const cw=P?620:640,ch=P?330:230,cx0=g.cx-cw/2,cy0=g.cy-ch/2;const ca=rA*seg(G,SI.fail-0.6,SI.fail-0.2);
    card(cx0,cy0,cw,ch,{a:ca,stroke:decision.pass?(decision.hook?'rgba(91,214,160,0.8)':'rgba(240,122,98,0.8)'):'rgba(240,122,98,0.9)'});
    text(decision.retry?'工具请求（重新提交）':'工具请求',cx0+28,cy0+36,P?22:18,DIM,ca,400,'left');text(`写入  ${req[0]}`,cx0+28,cy0+(P?84:78),P?28:24,PALE,ca,700,'left');
    let res;if(!decision.hook)res=['已执行：正式合同被覆盖','提示词里的规矩没拦住',RED];else if(decision.pass)res=['Hook 检查通过 → 执行',req[2],GREEN];else res=['Hook 拦截 → 不执行',req[2]+'（理由反馈给模型）',RED];
    glowText(res[0],cx0+28,cy0+(P?150:136),P?30:26,res[2],ca,700,0.3,'left');rich(res[1],cx0+28,cy0+(P?200:180),P?24:20,ca,{align:'left',maxW:cw-56,color:IVORY});
    if(LE.isAt('drag')){const t=dragTrack(g);LE.line(t.x0,t.y,t.x1,t.y,'rgba(244,237,223,0.3)',4,ca);PATHS.forEach((p,k)=>{const x=lerp(t.x0,t.x1,k/2);text(['正式合同','草稿副本','密钥文件'][k],x,t.y+(P?40:32),P?24:18,k===path?GOLD_HI:DIM,ca,700);});
      const kx=lerp(t.x0,t.x1,pDisp/2);ctx.beginPath();ctx.arc(kx,t.y,14,0,7);ctx.fillStyle=GOLD_HI;ctx.fill();glowAdd(kx,t.y,34,0.8);if(pUser==null)LE.dragHint(kx,t.y,'拖动',amb,1,{dy:-40});}
    if(!decision.hook&&phase>0.7){const p=E(g,35);glowAdd(p.x,p.y,90,0.7*rA,LE.SPR.RED);}}
  // 闸门们
  const pre=gt*rA;if(pre>0.01){const col=decision&&decision.hook?(decision.pass?GREEN:RED):GOLD_HI;gateAt(g,0,col,'PreToolUse',pre,amb);}
  const po=seg(G,SI.post-0.7,SI.post-0.1)*rA;if(po>0.01){gateAt(g,62,GREEN,'PostToolUse',po,amb);if(G<SI.stop-0.4){const cw=P?620:640,cx0=g.cx-cw/2,cy0=g.cy-(P?150:100);const pa=po*(1-seg(G,SI.stop-0.8,SI.stop-0.4));card(cx0,cy0,cw,P?300:200,{a:pa,stroke:'rgba(91,214,160,0.8)'});
      text('工具执行后，自动运行：',cx0+28,cy0+36,P?22:18,DIM,pa,400,'left');['格式化文件','检查是否含身份证号等敏感信息','核对文件是否写在案件目录内'].forEach((t,k)=>{text('✓ '+t,cx0+28,cy0+(P?90:80)+k*(P?56:40),P?26:21,GREEN,pa*seg(G,SI.post-0.5+k*0.1,SI.post-0.2+k*0.1),700,'left');});}}
  const sp=seg(G,SI.stop-0.7,SI.stop-0.1)*rA;if(sp>0.01){const p=E(g,-90);const ex={x:p.x+(P?0:0),y:p.y-(P?170:150)};LE.line(p.x,p.y-36,ex.x,ex.y+36,GOLD,3,sp);LE.arrowHead(ex.x,ex.y+30,-Math.PI/2,16,GOLD,sp);
    const lab='最终回答';text(lab,ex.x+(P?0:0),ex.y,P?26:22,PALE,sp,700);const gp={x:p.x,y:(p.y-36+ex.y+36)/2};ctx.globalAlpha=sp;ctx.strokeStyle=PURPLE;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(gp.x-60,gp.y);ctx.lineTo(gp.x+60,gp.y);ctx.stroke();ctx.lineCap='butt';ctx.globalAlpha=1;text('Stop',gp.x+80,gp.y,P?26:22,PURPLE,sp,700,'left');
    if(G<SI.all-0.4){const cw=P?620:640,cx0=g.cx-cw/2,cy0=g.cy-(P?150:100);const pa=sp*(1-seg(G,SI.all-0.8,SI.all-0.4));card(cx0,cy0,cw,P?300:200,{a:pa,stroke:'rgba(195,160,255,0.8)'});text('结束前验收（示例规则）：',cx0+28,cy0+36,P?22:18,DIM,pa,400,'left');
      [['每个结论都有出处',1],['金额已用脚本复算',1],['待办清单为空',0]].forEach(([t,ok],k)=>text((ok?'✓ ':'✗ ')+t,cx0+28,cy0+(P?90:80)+k*(P?56:40),P?26:21,ok?GREEN:RED,pa,700,'left'));text('→ 未通过：继续干',cx0+cw-28,cy0+(P?260:166),P?24:20,RED,pa,700,'right');}}
  const al=zoom*rA;if(al>0.01){[[180,'SessionStart',ICE,1],[150,'UserPromptSubmit',ICE,1]].forEach(([d,l,c])=>{const p=E(g,d);const q={x:p.x+(P?-0:-0),y:p.y};gateAt(g,d===180?205:150,c,l,al,amb);});
    rich('Hook 是普通{脚本}：由运行框架在这些节点{必然触发}；拦不拦、怎么拦，取决于脚本写的规则',P?540:g.cx,P?g.cy+g.ry+150:g.cy,P?28:26,al,{maxW:P?900:620});}
  ctx.restore();
  // 对比
  if(cmp>0.01){const a=cmp*fin;const xs=P?[[90,H*0.22],[90,H*0.55]]:[[220,300],[1000,300]];const ww=P?900:700,hh=P?460:440;
    [['提示词 · 告示牌','「请随手关门」','写在纸带上，模型{可能遵守}，也可能忽略','适合：偏好、风格、一般要求',PALE],['Hook · 门锁','门自动锁上','运行框架{一定执行}这段脚本','适合：红线、必须检查的步骤',GREEN]].forEach((c,k)=>{const [x,y]=xs[k];const e=seg(cmp,k*0.2,0.6+k*0.2)*a;card(x,y,ww,hh,{a:e,stroke:k?'rgba(91,214,160,0.8)':undefined});
      glowText(c[0],x+ww/2,y+(P?70:70),P?40:36,c[4],e,700);text(c[1],x+ww/2,y+(P?150:150),P?30:28,IVORY,e,700);rich(c[2],x+ww/2,y+(P?240:240),P?28:24,e,{maxW:ww-80});text(c[3],x+ww/2,y+(P?360:340),P?26:22,DIM,e);});}
  LE.finale(['提示词里的规矩是{告示}：上下文一长，可能被忽略','{Hook} 是挂在循环节点上的{脚本}：由运行框架执行','工具前{拦截}并反馈理由，工具后{检查}，结束前{验收}'],seg(G,LAST-0.8,LAST),'挂载点名称以 Claude Code 为例（另有 Notification、SubagentStop、PreCompact、SessionEnd 等）；其他产品叫法不同。示例路径与规则为示意。');}
function dragTrack(g){return g.P?{x0:g.cx-240,x1:g.cx+240,y:g.cy+250}:{x0:g.cx-220,x1:g.cx+220,y:g.cy+170};}
const drags=[{step:'drag',cursor:'ew-resize',hit:pt=>{const t=dragTrack(geo());return pt.x>t.x0-60&&pt.x<t.x1+60&&Math.abs(pt.y-t.y)<60;},move:pt=>{const t=dragTrack(geo());pUser=clamp((pt.x-t.x0)/(t.x1-t.x0))*2;},end:()=>{if(pUser!=null)pUser=Math.round(pUser);}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{pUser=null;},onSeek:(g,st)=>{pUser=st.p??null;if(pUser!=null)pDisp=pUser;}});
})();

</script></body></html>
