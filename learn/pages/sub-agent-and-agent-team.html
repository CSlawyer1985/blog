    if(dg<=0.5)text('并行的总耗时 ≈ 最慢那条 + 协调开销',pan.x+30,pan.y+(P?340:300),P?22:18,DIM,pa,400,'left');
    if(dg>0.01){const t=dragTrack(g);const da=pa*dg;LE.line(t.x0,t.y,t.x1,t.y,'rgba(244,237,223,0.3)',4,da);const kx=lerp(t.x0,t.x1,(nDisp-1)/7);LE.line(t.x0,t.y,kx,t.y,GOLD_HI,4,da);for(let i=1;i<=8;i++)text(String(i),lerp(t.x0,t.x1,(i-1)/7),t.y+(P?34:30),P?20:16,i===n?GOLD_HI:DIM,da,700);
      ctx.globalAlpha=da;ctx.beginPath();ctx.arc(kx,t.y,14,0,7);ctx.fillStyle=GOLD_HI;ctx.fill();ctx.globalAlpha=1;LE.glowAdd(kx,t.y,34,0.8*da);if(LE.isAt('drag')&&nUser==null)LE.dragHint(kx,t.y,'拖动',amb,1,{dy:-40});
      text('耗时以 1 个 Agent 为 100%；Token 以 1 个 Agent 为 1 倍（示意）',pan.x+30,pan.y+pan.h-(P?40:30),P?20:16,DIM2,da,400,'left');}}}
function dragTrack(g){const q=cGeo(g);const pan=q.pan;return{x0:pan.x+(g.P?80:300),x1:pan.x+pan.w-(g.P?80:340),y:pan.y+(g.P?440:330)};}
function toWorld(pt){const W=LY.W,H=LY.H;return{x:(pt.x-W/2)/CAM.z+CAM.x,y:(pt.y-H/2)/CAM.z+CAM.y};}
function choose(G,a){if(a<=0.01)return;const W=LY.W,H=LY.H,P=LY.port;const cs=[['一个 Agent','任务小、资料少','最省 Token、最好排查',PALE],['Sub-Agent','要翻大量资料','脏活外包，主纸带干净',ICE],['Agent Team / 多轨','分工明确、需要互相协作','更快，但更贵、更难协调',GOLD_HI]];
  cs.forEach(([t,w,r,col],k)=>{const e=a*seg(a,k*0.15,0.6+k*0.15);const cw=P?900:500,ch=P?320:360;const x=P?90:W/2-(cw*3+60)/2+k*(cw+30),y=P?H*0.2+k*(ch+40):H/2-ch/2+20;card(x,y,cw,ch,{a:e});glowText(t,x+cw/2,y+(P?70:80),P?40:34,col,e,700,0.3);text('适合：'+w,x+cw/2,y+(P?150:170),P?28:24,IVORY,e,400);text(r,x+cw/2,y+(P?220:240),P?26:22,DIM,e,400);});}
function render(G,amb,dt){const P=LY.port;const g=geo();
  LE.bg(amb,0,0);
  LE.title('Sub-Agent 与 Agent Team','{外包}、{协作}、{并行}与{质检}',LE.easeOut(clamp(amb/1.8)),seg(G,0.05,0.6),{portLines:['Sub-Agent','与 Agent Team']});
  if(G<0.3)return;const fin=1-seg(G,LAST-0.7,LAST);const ch=seg(G,SI.choose-0.7,SI.choose-0.2);
  const at=LE.isAt('drag');if(at&&nUser!=null)nDisp=damp(nDisp,nUser,dt,12);else if(!at)nDisp=3;
  const cam=camAt(g,G);CAM=cam;ctx.save();LE.camera(cam.x,cam.y,cam.z);const base=seg(G,0.4,1)*fin*(1-ch);
  sceneA(g,G,amb,base*(1-seg(G,SI.team-0.3,SI.team+0.3)*0.0));sceneB(g,G,amb,base*seg(G,SI.team-1,SI.team-0.4));sceneC(g,G,amb,base*seg(G,SI.par-1,SI.par-0.4));ctx.restore();
  choose(G,ch*fin);
  LE.finale(['一条纸带装不下大活，就{拆}','{Sub-Agent}：独立纸带干脏活，只交回{摘要}','{Team}：共享清单、互相发消息；加{质检闸门}把关','更快的代价是更多 {Token}——按任务选'],seg(G,LAST-0.8,LAST),'耗时与 Token 曲线为示意。Anthropic 在 2025 年介绍其多 Agent 研究系统时提到：多 Agent 的 Token 消耗约为普通对话的 15 倍。');}
const drags=[{step:'drag',cursor:'ew-resize',hit:pt=>{const w=toWorld(pt);const t=dragTrack(geo());return w.x>t.x0-60&&w.x<t.x1+60&&Math.abs(w.y-t.y)<60;},move:pt=>{const w=toWorld(pt);const t=dragTrack(geo());nUser=1+clamp((w.x-t.x0)/(t.x1-t.x0))*7;},end:()=>{if(nUser!=null)nUser=Math.round(nUser);}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{nUser=null;},onSeek:(g,st)=>{nUser=st.n??null;if(nUser!=null)nDisp=nUser;}});
})();

</script></body></html>
