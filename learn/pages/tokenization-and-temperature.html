<script>
(function(){

/* ------------------------------ 时间轴 ------------------------------ */

const STEPS=[

/* ------------------------------ 工具函数 ------------------------------ */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeCam=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const seg=(G,a,b)=>ease(clamp((G-a)/(b-a)));
function kf(G,pts,fn=ease){if(G<=pts[0][0])return pts[0][1];for(let i=0;i<pts.length-1;i++){if(G<=pts[i+1][0]){const a=pts[i],b=pts[i+1];return lerp(a[1],b[1],fn((G-a[0])/(b[0]-a[0])));}}return pts[pts.length-1][1];}

      if(cw+w>maxW&&ln.length){let cut=lb>=0&&ln.length-lb<8?lb+1:ln.length;const carry=ln.splice(cut);lines.push(carry);cw=carry.reduce((s,[c2,h2])=>s+measure(c2,size,h2?700:bw),0);lb=-1;}
      lines[lines.length-1].push([c,h]);cw+=w;if('，、：；。？！ ）·'.includes(c))lb=lines[lines.length-1].length-1;}}

    let tw=0;runs.forEach(r=>{r[2]=measure(r[0],size,r[1]?700:bw);tw+=r[2];});let x0=x-tw/2;const yy=y0+li*lh;
    runs.forEach(r=>{if(r[1])glowText(r[0],x0,yy,size,GOLD_HI,alpha,700,0.45,'left');else text(r[0],x0,yy,size,opt.color||IVORY,alpha,bw,'left');x0+=r[2];});});return n;}
function brandMark(x,y,size,alpha){if(alpha<=0.003)return;const a='陈石律师',d='  ·  ',b='chenshi.ai';
  const wa=measure(a,size*0.8),wd=measure(d,size*0.8),wb=measure(b,size,700),tw=wa+wd+wb;let x0=x-tw/2;

/* ------------------------------ 内容数据（全部可复现） ------------------------------ */
// 切分与编号：OpenAI cl100k_base（GPT-4 / GPT-3.5 所用）实测；o200k_base（GPT-4o）对照
const WORD='strawberry', WCUT=[[0,3,'496'],[3,5,'675'],[5,10,'15717']];
const NUM='1234567', NCUT=[[0,3,'4513'],[3,6,'10961'],[6,7,'22']];
const ZH_A=[['违','½'],['违','½'],['约'],['金'],['过'],['分'],['高'],['于'],['损','½'],['损','½'],['失']]; // cl100k：违、损 各被拆成 2 个字节片段
const ZH_B=['违','约','金','过','分','高','于','损','失']; // o200k：一字一块
// 下一个 token 的候选与 logits（示意数值，按分数从高到低）
const CAND=[['减少',3.2],['调整',2.1],['降低',1.6],['酌减',0.9],['增加',-0.6],['飞翔',-2.5]];
const BAD={'增加':1,'飞翔':1};
function probs(T){const z=CAND.map(c=>c[1]/Math.max(T,0.05));const m=Math.max(...z);const e=z.map(v=>Math.exp(v-m));const s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s);}
function nucleus(p,P){let c=0,k=0;for(;k<p.length;k++){c+=p[k];if(c>=P-1e-9){k++;break;}}return Math.max(1,Math.min(k,p.length));}
const UNI=(()=>{const r=mulberry(20261125);return Array.from({length:40},()=>r());})();
function draw(p,u){let c=0;for(let i=0;i<p.length;i++){c+=p[i];if(u<c)return i;}return p.length-1;}

/* ------------------------------ 交互状态 ------------------------------ */
let Tuser=null, Puser=null, Tdisp=1, Pdisp=0.9, dragging=null;
function Tline(G){return kf(G,[[SI.softmax,1],[SI.cold,0.3],[SI.hot,1.6],[SI.drag,1.0],[SI.sample,1.0],[SI.topp,1.0]]);}

/* ------------------------------ 版式坐标 ------------------------------ */
function geo(){ // 概率区（屏幕坐标，camera 已落位后）
  if(!PORT) return {barX0:460,barW:1000,barTop:300,barBase:700,lab:744,sl:{x0:640,x1:1280,y:900},q:{y:196},rib:{x0:300,y1:826,y2:916}};
  const H=LY.H;return {barX0:80,barW:920,barTop:0.27*H,barBase:0.27*H+0.30*H,lab:0.57*H+48,sl:{x0:170,x1:910,y:0.57*H+0.13*H},q:{y:0.19*H},rib:{x0:60,y1:0.57*H+0.12*H,y2:0.57*H+0.21*H}};}
function slT(x,g){return Math.pow(10,lerp(Math.log10(0.1),Math.log10(2),clamp((x-g.sl.x0)/(g.sl.x1-g.sl.x0))));}
function Tx(T,g){return lerp(g.sl.x0,g.sl.x1,(Math.log10(T)-Math.log10(0.1))/(Math.log10(2)-Math.log10(0.1)));}

/* ------------------------------ 渲染 ------------------------------ */

function render(G,amb,dt){

  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save();ctx.translate(view.ox,view.oy);ctx.scale(view.s,view.s);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  // 氛围
  {const g=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,PORT?1100:950);g.addColorStop(0,'rgba(128,84,22,0.16)');g.addColorStop(0.55,'rgba(60,38,10,0.05)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
   ctx.fillStyle='#FFE3A8';DUST.forEach(d=>{ctx.globalAlpha=d.a*(0.6+0.4*Math.sin(amb*0.6+d.ph));ctx.fillRect(d.x*W,d.y*H,d.s,d.s);});ctx.globalAlpha=1;}

    {const g=ctx.createRadialGradient(W/2,y0,0,W/2,y0,PORT?620:760);g.addColorStop(0,`rgba(150,100,30,${0.22*intro*(1-out)})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
    if(PORT){glowText('分词与温度',W/2,y0,fs,PALE,easeOut(intro)*(1-out),700,0.28);}
    else glowText('分词与温度',W/2,y0,fs,PALE,easeOut(intro)*(1-out),700,0.28);
    const lw=(PORT?700:780)*seg(intro,0.3,0.85);ctx.fillStyle=`rgba(226,170,66,${0.8*(1-out)})`;ctx.fillRect(W/2-lw/2,y0+(PORT?96:84),lw,1.5);

    brandMark(W/2,PORT?0.8*H:y0+300,PORT?40:30*K,seg(intro,0.7,1)*(1-out));}

  if(tA||cam<H){ctx.save();ctx.translate(0,-cam);
    const inA=seg(G,0.4,1), cut=seg(G,1.2,2), idv=seg(G,2.15,2.8), cnt=seg(G,3.2,3.8)*(1-seg(G,4.2,4.7));
    const up=seg(G,4.1,4.8); // 第 5 步起，strawberry 行缩小上移，腾出数字与中文
    const fs0=PORT?150:156, fs=lerp(fs0,PORT?92:84,up);
    const rowY=lerp(PORT?0.40*H:450,PORT?0.20*H:255,up);
    // 字母与切块
    const gapW=lerp(0,PORT?44:58,cut)*(fs/fs0);
    const chars=[...WORD];const cw=chars.map(c=>measure(c,fs,400));
    const tot=cw.reduce((a,b)=>a+b,0)+gapW*2;let x=W/2-tot/2;const pos=[];
    chars.forEach((c,i)=>{if(i===3||i===5)x+=gapW;pos.push(x+cw[i]/2);x+=cw[i];});
    const letterA=inA*(1-0.72*idv*(1-cnt*0.9));

      if(cut>0.01){ctx.globalAlpha=cut*inA;rr(xl,yt,xr-xl,h,14*(fs/fs0));const g=ctx.createLinearGradient(0,yt,0,yt+h);g.addColorStop(0,'rgba(226,170,66,0.16)');g.addColorStop(1,'rgba(226,170,66,0.05)');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(226,170,66,0.85)';ctx.lineWidth=1.4;ctx.stroke();ctx.globalAlpha=1;}
      // 编号
      const idy=rowY+h/2+(PORT?54:44)*(fs/fs0)+ (1-idv)*16;
      glowText(id,(xl+xr)/2,idy,(PORT?44:40)*(fs/fs0)/(1-0.25*up),GOLD_HI,idv*inA,700,0.35);
    });
    chars.forEach((c,i)=>{const isR=c==='r';const red=isR?cnt:0;
      if(red>0.01)glow(pos[i],rowY,fs*0.55,0.7*red,SPR_RED);
      text(c,pos[i],rowY+fs*0.02,fs,red>0.5?RED:IVORY,Math.max(letterA,red*inA),400);});
    if(idv>0.01&&up<1){const a=idv*(1-up);rich('模型收到：{[ 496, 675, 15717 ]}',W/2,rowY+(PORT?250:240),PORT?42:34,a);
      text('OpenAI cl100k 分词器实测；GPT-4o 的 o200k 会切成 st · raw · berry',W/2,rowY+(PORT?320:300),PORT?28:22,DIM2,a);}
    if(cnt>0.01)rich('3 个 r：1 个在 {str}，2 个在 {berry}；要数对，模型得「记得」每个 token 的拼写',W/2,rowY-(PORT?190:170),PORT?36:28,cnt,{maxW:PORT?960:0});
    // 数字
    const nA=seg(G,4.3,5);if(nA>0.01){const y=PORT?0.43*H:520,f=PORT?110:96;const ch=[...NUM];const gw=lerp(0,40,seg(G,4.5,5));
      const w=ch.map(c=>measure(c,f,400));let tx=W/2-(w.reduce((a,b)=>a+b,0)+gw*2)/2;const p=[];ch.forEach((c,i)=>{if(i===3||i===6)tx+=gw;p.push(tx+w[i]/2);tx+=w[i];});
      text('数字',PORT?W/2:W/2-440,PORT?y-110:y,PORT?30:26,DIM,nA,400,PORT?'center':'left');
      NCUT.forEach(([a,b,id])=>{const xl=p[a]-w[a]/2-12,xr=p[b-1]+w[b-1]/2+12;ctx.globalAlpha=nA;rr(xl,y-f*0.55,xr-xl,f*1.1,12);ctx.fillStyle='rgba(226,170,66,0.1)';ctx.fill();ctx.strokeStyle='rgba(226,170,66,0.8)';ctx.lineWidth=1.3;ctx.stroke();ctx.globalAlpha=1;
        text(id,(xl+xr)/2,y+f*0.55+30,PORT?32:26,GOLD_HI,nA*0.9,700);});
      ch.forEach((c,i)=>text(c,p[i],y,f,IVORY,nA));

      const row=(cells,y,lab,n,k0)=>{const tw=cells.length*cwid+(cells.length-1)*gap;let x0=W/2-tw/2+(PORT?0:90);
        text(lab,PORT?W/2:x0-40,PORT?y-f-14:y,PORT?28:24,DIM,zA,400,PORT?'center':'right');
        cells.forEach((c,i)=>{const a=zA*seg(G,k0+i*0.03,k0+0.25+i*0.03);const ch=Array.isArray(c)?c[0]:c,frag=Array.isArray(c)&&c[1];const x=x0+i*(cwid+gap);
          ctx.globalAlpha=a;rr(x,y-f*0.62,cwid,f*1.24,10);ctx.fillStyle=frag?'rgba(240,122,98,0.10)':'rgba(226,170,66,0.10)';ctx.fill();ctx.strokeStyle=frag?'rgba(240,122,98,0.8)':'rgba(226,170,66,0.8)';ctx.lineWidth=1.3;ctx.stroke();ctx.globalAlpha=1;
          if(frag){ctx.save();rr(x,y-f*0.62,cwid,f*1.24,10);ctx.clip();const half=(i>0&&Array.isArray(cells[i-1])&&cells[i-1][0]===ch)?1:0;text(ch,x+cwid/2+(half?-cwid*0.5:cwid*0.5),y,f,RED,a*0.9);ctx.restore();}
          else text(ch,x+cwid/2,y,f,IVORY,a);});
        text(n,x0+tw+(PORT?0:30),PORT?y+f+18:y,PORT?30:28,GOLD_HI,zA,700,PORT?'right':'left');};
      row(ZH_A,yA,'cl100k（GPT-4）','11 个 token',5.4);row(ZH_B,yB,'o200k（GPT-4o）','9 个 token',5.6);
      text('红框：一个汉字被拆成两个字节片段',PORT?W/2:W/2+90,yA+(PORT?120:62),PORT?26:20,'rgba(240,122,98,0.85)',zA*seg(G,5.7,6));}
    ctx.restore();}

  /* ---------- 下半场：打分、温度、采样、Top-P ---------- */

    // Top-P

    const keep=tp>0?nucleus(p,Pdisp):CAND.length;let pk=p.slice();

    });

    // Top-P 累加带
    if(tp>0.01){const y=g.barBase+ (PORT?110:96),x0=g.barX0,w=g.barW;let c=0;
      p.forEach((v,i)=>{const xa=x0+w*c,xb=x0+w*(c+v);ctx.globalAlpha=tp*(i<keep?0.85:0.25);ctx.fillStyle=i%2?'rgba(255,208,98,0.75)':'rgba(226,170,66,0.95)';ctx.fillRect(xa,y-9,Math.max(0,xb-xa-1),18);c+=v;});ctx.globalAlpha=1;
      const xp=x0+w*Pdisp;ctx.save();ctx.globalAlpha=tp;ctx.strokeStyle=GOLD_HI;ctx.lineWidth=2.4;ctx.shadowColor='rgba(255,190,60,0.8)';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(xp,g.barTop-10);ctx.lineTo(xp,y+26);ctx.stroke();ctx.restore();

    // 温度滑杆

    if(slA>0.01){const s=g.sl;ctx.globalAlpha=slA;const gr=ctx.createLinearGradient(s.x0,0,s.x1,0);gr.addColorStop(0,'rgba(143,216,255,0.75)');gr.addColorStop(0.45,'rgba(226,170,66,0.85)');gr.addColorStop(1,'rgba(240,110,80,0.85)');

      glow(tx,s.y,28+(live?10*pul:0)+(dragging==='T'?12:0),0.8*slA);ctx.globalAlpha=slA;ctx.beginPath();ctx.arc(tx,s.y,11,0,Math.PI*2);ctx.fillStyle=PALE;ctx.fill();ctx.globalAlpha=1;

      if(live&&Tuser===null)text('← 拖动 →',tx,s.y+70,PORT?28:22,GOLD_HI,0.6+0.4*pul);

    // 采样：两条结果带

  if(fA>0.01){ctx.fillStyle=`rgba(0,0,0,${0.82*fA})`;ctx.fillRect(0,0,W,H);

  ctx.restore();}
function bumpK(G,c,w){return clamp(1-Math.abs(G-c)/w);}
function drawHint(G){const lo=Math.floor(G),hi=Math.min(LAST,Math.ceil(G));const ta=STEPS[lo].hint,tb=STEPS[hi].hint,f=G-lo;

/* ------------------------------ 交互 ------------------------------ */
let G=0,target=0,anim=null,auto=false,frozenAmb=null;const t0=performance.now();
function go(i){i=clamp(Math.round(i),0,LAST);if(i===target&&!anim)return;const from=G,fwd=i===Math.round(target)+1&&i>from;
  const dur=fwd?STEPS[i].dur:Math.min(900,350+Math.abs(i-from)*60);target=i;anim={from,to:i,start:performance.now(),dur,linear:fwd};Tuser=null;Puser=null;}
function tick(now){const dt=lastNow?Math.min(0.05,(now-lastNow)/1000):0.016;lastNow=now;
  if(anim){const p=clamp((now-anim.start)/anim.dur);G=anim.linear?lerp(anim.from,anim.to,p):lerp(anim.from,anim.to,ease(p));if(p>=1){G=anim.to;anim=null;if(auto&&G<LAST)setTimeout(()=>auto&&go(target+1),700);}}

function next(){go(target+1);}function prev(){go(target-1);}
addEventListener('keydown',e=>{if(e.target.id==='lesson-back')return;const k=e.key;

  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'||k==='ArrowUp'){e.preventDefault();prev();}
  else if(k==='Home')go(0);else if(k==='End')go(LAST);else if(k==='f'||k==='F')toggleFS();else if(k==='a'||k==='A'){auto=!auto;if(auto)next();}});
// 拖动：只在可操作的步骤生效（温度滑杆 / Top-P 截断线）；其余点按 = 下一步，与第一课一致
function toDesign(e){return{x:(e.clientX-view.ox)/view.s,y:(e.clientY-view.oy)/view.s};}
function hitDrag(pt){if(anim)return null;const st=STEPS[target];if(!st.inter)return null;const g=geo();

['touchmove','gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.id==='fs'||e.target.id==='lesson-back')return;if(e.cancelable)e.preventDefault();},{passive:false}));
const fsBtn=document.getElementById('fs');function toggleFS(){const d=document,el=d.documentElement;try{if(!(d.fullscreenElement||d.webkitFullscreenElement))(el.requestFullscreen||el.webkitRequestFullscreen).call(el);else(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(err){}}

addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
