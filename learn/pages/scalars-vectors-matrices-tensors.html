(function(){'use strict';

      if(hd>0.01){text('头 1',g.mx.x+1.5*g.gx,g.mx.y-g.ch/2-(g.P?96:110),g.P?26:22,GOLD_HI,hd*sA,700);text('头 2',g.mx.x+5.5*g.gx+(g.P?24:40),g.mx.y-g.ch/2-(g.P?96:110),g.P?26:22,ICE,hd*sA,700);}}}
  ctx.restore();
  // 全景
  if(allT>0.01){const a=allT*fin;const P2=P;const spots=P2?[[300,H*0.3],[780,H*0.3],[300,H*0.6],[780,H*0.6]]:[[330,520],[730,520],[1150,520],[1600,520]];
    const labs=[['0 维','标量'],['1 维','向量'],['2 维','矩阵'],['3 维及以上','张量']];
    spots.forEach(([x,y],k)=>{const e=seg(allT,k*0.15,0.5+k*0.15)*a;if(e<=0.01)return;const cw=P2?62:58,ch=P2?40:38;
      if(k===0)cell(x,y,cw*1.3,ch*1.3,0.7,e,'hot',18);
      if(k===1)for(let j=0;j<4;j++)cell(x,y+(j-1.5)*(ch+6),cw,ch,VAL[0][j],e,'hot',15);
      if(k===2)for(let i=0;i<3;i++)for(let j=0;j<3;j++)cell(x+(j-1)*(cw+6),y+(i-1)*(ch+6),cw,ch,VAL[i][j],e,'gold',15);
      if(k===3){for(let d=2;d>=0;d--)for(let i=0;i<3;i++)for(let j=0;j<3;j++){const xx=x+(j-1)*(cw+6)+d*24-24,yy=y+(i-1)*(ch+6)-d*22+22;if(d===0)cell(xx,yy,cw,ch,VAL[i][j],e,'gold',15);else block(xx-cw/2,yy-ch/2,cw,ch,{style:'dim',a:e*0.8,r:6});}}
      glowText(labs[k][0],x,y+(P2?220:200),P2?40:34,GOLD_HI,e,700);text(labs[k][1],x,y+(P2?272:246),P2?30:24,IVORY,e,700);
      if(k<3&&!P2)text('→',x+200,y,40,GOLD,e,700);});
    rich('标量、向量、矩阵其实都是张量：分别是 {0、1、2 维}的张量',W/2,P?H*0.78:860,P?30:28,a*seg(allT,0.6,1),{maxW:P?940:0});}
  LE.finale(['{标量}一个数，{向量}一串数，{矩阵}一张表','词元变成向量，一句话就是一张表；计算主要是{矩阵乘法}','一次处理多句话，就是{张量}：(批量, 句长, 维度)'],seg(G,LAST-0.8,LAST),'向量数值、维度（8 维）与相似度均为示意；真实模型的词向量通常有上千维，相似与否也要看具体模型。');}
const drags=[{step:'drag',cursor:'grab',hit:pt=>{const g=geo();return Math.hypot(pt.x-g.plane2.x,pt.y-g.plane2.y)<g.plane2.r*1.15;},
  move:pt=>{const g=geo();let a=Math.atan2(-(pt.y-g.plane2.y),pt.x-g.plane2.x)*180/Math.PI;if(a<0)a+=360;angUser=a;}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{angUser=null;},onSeek:(g,st)=>{angUser=st.ang??null;if(angUser!=null)angDisp=angUser;}});
})();
