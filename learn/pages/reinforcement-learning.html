// @title 强化学习：RL、RLHF 与 GRPO · 不给答案，只给打分

(function(){'use strict';

const STEPS=[
 S('title',0,2600,''),

 S('final',8,3200,''),

const SI={};STEPS.forEach((s,i)=>SI[s.id]=i);const LAST=STEPS.length-1;
// 迷宫 9×5：1=墙

 {p:[[0,2],[1,2],[2,2],[2,1]],r:-1},
 {p:[[0,2],[0,1],[0,0],[1,0],[2,0],[3,0],[4,0]],r:-1},
 {p:[[0,2],[0,3],[0,4],[1,4]],r:-1},
 {p:[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2]],r:-1},
 {p:[[0,2],[1,2],[2,2],[2,3],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4]],r:10},
 {p:[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[5,1],[5,0],[6,0],[7,0],[8,0],[8,1],[8,2],[8,3],[8,4]],r:10},
];
const ANS=[{t:'200 × 10% = 20 万',ok:1},{t:'200 × 10% = 2 万',ok:0},{t:'上限 10%，即 20 万',ok:1},{t:'违约金就是 200 万',ok:0}];
let rUser=null;const rDisp=[1,0,1,0];
function geo(){const P=LY.port,H=LY.H;// 三个场景：迷宫 A，RLHF B，GRPO C

function camAt(g,G){const k1=LE.easeCam(clamp((G-(SI.ab-0.9))/0.8)),k2=LE.easeCam(clamp((G-(SI.grpo-0.9))/0.8)),k3=LE.easeCam(clamp((G-(SI.aha-0.9))/0.8));

    const fi=Math.floor(prog),fr=prog-fi;if(fi<n-1){const q0=mcell(g,...pt.p[fi]),q1=mcell(g,...pt.p[fi+1]);ctx.lineTo(lerp(q0.x,q1.x,fr),lerp(q0.y,q1.y,fr));}ctx.stroke();ctx.lineCap='butt';ctx.globalAlpha=1;
    if(cyc>=1&&cyc<1.25&&pol<0.5){const q=mcell(g,...pt.p[n-1]);const f=1-(cyc-1)/0.25;glowAdd(q.x,q.y,60*f+20,0.8*f*a,pt.r>0?LE.SPR.GREEN:LE.SPR.RED);glowText(pt.r>0?'+10':'−1',q.x,q.y-40-(1-f)*30,g.P?36:30,pt.r>0?GREEN:RED,a*f,700);}});

function vsScene(g,G,a){if(a<=0.01)return;const P=g.P,o=g.A;const rows=P?[[o.y-420,'微调 SFT'],[o.y+120,'强化学习 RL']]:[[o.y-150,'微调 SFT'],[o.y+150,'强化学习 RL']];
  rows.forEach(([y,lab],k)=>{const x0=P?90:240;glowText(lab,P?540:x0+90,P?y-90:y,P?36:28,k?GOLD_HI:ICE,a,700);
    const bx=P?[90,400,710]:[480,900,1320],bw=P?280:340;const labs=k?['题目','模型自己尝试','打分：+1 / −1']:['题目','标准答案（人写好）','照着学，逐字对齐'];
    labs.forEach((t,i)=>{const e=seg(G,SI.vs-0.8+i*0.12+k*0.25,SI.vs-0.4+i*0.12+k*0.25)*a;block(bx[i],y-(P?50:44),bw,P?100:88,{style:k?(i===2?'hot':'gold'):(i===1?'ice':'gold'),a:e});rich(t,bx[i]+bw/2,y,P?26:24,e,{maxW:bw-24,weight:700});

function rlhf(g,G,amb,a){if(a<=0.01)return;const P=g.P,o=g.B;const ab=seg(G,SI.ab-0.7,SI.ab-0.1),rm=seg(G,SI.rm-0.8,SI.rm-0.2);
  const q={x:P?90:o.x-760,y:P?o.y-760:o.y-330,w:P?900:1520,h:P?96:84};block(q.x,q.y,q.w,q.h,{style:'ice',a});text('问题：甲方逾期付款，我能主张多少违约金？',q.x+q.w/2,q.y+q.h/2,P?28:26,ICE,a,700);

  const texts=['回答 A：可以主张违约金，具体看合同。','回答 B：先看合同约定的违约金条款；若约定过高，对方可请求调减，法院会参考实际损失等因素；请提供合同第几条。'];

    glowText('奖励模型',R.x+(P?40:40),R.y+(P?50:46),P?34:28,GOLD_HI,a*rm,700,0.4,'left');text('（用大量「A 和 B 哪个好」的人类偏好训练）',R.x+(P?40:220),R.y+(P?100:46),P?22:18,DIM,a*rm,400,'left');
    const outs=[['新回答 1',0.82],['新回答 2',0.31],['新回答 3',0.64]];outs.forEach(([t,s],i)=>{const y=R.y+(P?170:110)+i*(P?60:40);const e=seg(rm,0.3+i*0.15,0.7+i*0.15)*a;text(t,R.x+40,y,P?26:20,IVORY,e,700,'left');
      const bw=(P?480:600)*s;ctx.globalAlpha=e;rr(R.x+(P?200:170),y-10,bw,20,5);ctx.fillStyle=s>0.6?GREEN:RED;ctx.fill();ctx.globalAlpha=1;text(s.toFixed(2),R.x+(P?210:180)+bw,y,P?24:19,IVORY,e,700,'left');});
    rich('分数{越高}，生成这类回答的倾向就被{加强}（分数为示意）',P?540:R.x+R.w-40,P?R.y+R.h-60:R.y+R.h-40,P?26:22,a*seg(rm,0.6,1),{align:P?'center':'right',maxW:P?840:0});}}
function grpo(g,G,amb,a,dt){if(a<=0.01)return;const P=g.P,o=g.Cc;const gp=seg(G,SI.group-0.8,SI.group-0.2),ad=seg(G,SI.adv-0.8,SI.adv-0.2);
  const q={x:P?90:o.x-800,y:P?o.y-820:o.y-340,w:P?900:1600,h:P?120:84};block(q.x,q.y,q.w,q.h,{style:'ice',a});rich('题：合同总价 200 万，违约金上限为总价的 10%，最多能主张多少？',q.x+q.w/2,q.y+q.h/2,P?28:26,a,{maxW:q.w-40,weight:700,color:ICE});
  const chk={x:P?90:o.x-800,y:P?o.y-660:o.y-230,w:P?900:1600,h:P?64:56};const ck=seg(G,SI.grpo-0.4,SI.grpo);block(chk.x,chk.y,chk.w,chk.h,{style:'green',a:a*ck});text('规则判分：答案 = 20 万 → 1 分，否则 0 分',chk.x+chk.w/2,chk.y+chk.h/2,P?26:22,GREEN,a*ck,700);
  // 读取当前分数
  const at=LE.isAt('drag');for(let i=0;i<4;i++){const tgt=at&&rUser?rUser[i]:ANS[i].ok;rDisp[i]=at?damp(rDisp[i],tgt,dt,12):tgt;}
  const mean=rDisp.reduce((s,v)=>s+v,0)/4,sd=Math.sqrt(rDisp.reduce((s,v)=>s+(v-mean)**2,0)/4)||1e-6;
  const adv=rDisp.map(r=>sd<0.02?0:(r-mean)/sd);
  for(let i=0;i<4;i++){const e=seg(gp,i*0.12,0.5+i*0.12)*a;if(e<=0.01)continue;
    const c=P?{x:90,y:o.y-540+i*250,w:480,h:110}:{x:o.x-800+i*410,y:o.y-130,w:370,h:110};
    const ok=rDisp[i]>0.5;block(c.x,c.y,c.w,c.h,{style:ck>0.5&&G>SI.group-0.3?(ok?'green':'red'):'gold',a:e});rich(ANS[i].t,c.x+c.w/2,c.y+c.h/2-(P?0:8),P?28:24,e,{maxW:c.w-30,weight:700});

      text(`得分 ${rDisp[i].toFixed(2)}`,sb.x+(P?0:sb.w/2),sb.y-(P?-sb.h-26:16),P?24:19,IVORY,sA,700,P?'left':'center');}

      if(!P){LE.line(base.x,base.y,base.x,base.y-L,adv[i]>=0?GREEN:RED,10,aA);if(Math.abs(adv[i])>0.05)LE.arrowHead(base.x,base.y-L-(adv[i]>0?12:-12),adv[i]>0?-Math.PI/2:Math.PI/2,26,adv[i]>=0?GREEN:RED,aA);
        text(`优势 ${adv[i]>=0?'+':'−'}${Math.abs(adv[i]).toFixed(2)}`,base.x,o.y+400,22,adv[i]>=0?GREEN:RED,aA,700);}
      else{const x=620+185,y=c.y+120;text(`优势 ${adv[i]>=0?'+':'−'}${Math.abs(adv[i]).toFixed(2)} ${adv[i]>0.05?'↑ 加强':(adv[i]<-0.05?'↓ 削弱':'')}`,x,y+20,26,adv[i]>=0?GREEN:RED,aA,700);}}

function aha(g,G,amb,a){if(a<=0.01)return;const P=g.P,o=g.Cc;const x=P?90:o.x-800,w=P?900:1600,y=P?o.y-300:o.y-120;card(x,y,w,P?520:300,{a,stroke:'rgba(195,160,255,0.7)'});

function pipe(g,G,amb,a){if(a<=0.01)return;const P=g.P,o=g.Cc;const st=[['预训练','海量文本 · 学语言与知识','gold'],['SFT 微调','示范答案 · 学格式与指令','ice'],['RL 强化学习','打分 · 按偏好或对错优化','hot']];

function render(G,amb,dt){const W=LY.W,H=LY.H,P=LY.port;const g=geo();

  rlhf(g,G,amb,seg(G,SI.ab-0.6,SI.ab-0.1)*(1-seg(G,SI.grpo-0.4,SI.grpo)));
  grpo(g,G,amb,seg(G,SI.grpo-0.6,SI.grpo-0.1)*(1-seg(G,SI.aha-0.8,SI.aha-0.4))*fin,dt);
  aha(g,G,amb,seg(G,SI.aha-0.6,SI.aha-0.1)*(1-seg(G,SI.pipe-0.8,SI.pipe-0.4))*fin);
  pipe(g,G,amb,seg(G,SI.pipe-0.7,SI.pipe-0.2)*fin);
  ctx.restore();
  LE.finale(['强化学习{不给答案，只给打分}：高分的做法被加强','{RLHF}：人类偏好 → 奖励模型 → 给新回答打分','{GRPO}：一组回答比{组内平均}，规则可判对错的题尤其适用'],seg(G,LAST-0.8,LAST),'迷宫分值、奖励模型分数、组大小与思考片段均为示意。GRPO 见 DeepSeekMath（2024），R1-Zero 的「顿悟时刻」见 DeepSeek-R1 技术报告（2025）。');}
function toWorld(pt){const W=LY.W,H=LY.H;return{x:(pt.x-W/2)/CAM.z+CAM.x,y:(pt.y-H/2)/CAM.z+CAM.y};}
function barOf(i){const g=geo(),o=g.Cc;if(g.P){const cy=o.y-540+i*250;return{x:620,y:cy+10,w:370,h:40};}const cx=o.x-800+i*410;return{x:cx,y:o.y+40,w:370,h:34};}
let dragI=-1;
const drags=[{step:'drag',cursor:'ew-resize',hit:p=>{const w=toWorld(p);for(let i=0;i<4;i++){const b=barOf(i);if(w.x>b.x-20&&w.x<b.x+b.w+20&&w.y>b.y-30&&w.y<b.y+b.h+30){dragI=i;return true;}}return false;},
  move:p=>{const w=toWorld(p);const b=barOf(dragI);if(!rUser)rUser=ANS.map(a=>a.ok);rUser[dragI]=clamp((w.x-b.x)/b.w);},end:()=>{dragI=-1;}}];
LE.run({steps:STEPS,scenes:SCENES,render,drags,onGo:()=>{rUser=null;},onSeek:(g,st)=>{rUser=st.r||null;}});
})();
