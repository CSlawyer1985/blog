<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
/* 将原文件中的两行 @font-face{font-family:'HSerif'...} 粘贴至此即可恢复原版衬线体 */
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}

canvas{display:block;touch-action:none}

#dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:5px;padding:6px 10px;border-radius:10px;background:rgba(8,7,4,.78);border:1px solid rgba(226,170,66,.22);backdrop-filter:blur(8px);z-index:10;max-width:95vw;overflow-x:auto;transition:opacity .4s}
#dock::-webkit-scrollbar{display:none}
.sbtn{font:12px "HSerif","Songti SC",serif;color:rgba(244,237,223,.55);background:none;border:1px solid transparent;border-radius:5px;padding:4px 9px;white-space:nowrap;cursor:pointer;transition:all .2s}
.sbtn:hover{color:#FFE9B8;border-color:rgba(226,170,66,.35)}
.sbtn.active{color:#FFD062;border-color:rgba(255,208,98,.6);background:rgba(226,170,66,.16);font-weight:700}
body.idle #tools,body.idle #dock,body.clean #tools,body.clean #dock{opacity:0;pointer-events:none}

<a id="lesson-back" href="../index.html">← 返回模块目录</a>
<canvas id="c"></canvas>
<div id="tools">
  <button class="tbtn" id="autoBtn" title="自动播放 (A)">自动 A</button>
  <button class="tbtn" id="cleanBtn" title="纯净录屏 (H)">纯净 H</button>
  <button class="tbtn" id="fsBtn" title="全屏 (F)">全屏 F</button>
</div>
<div id="dock"></div>
<script>
(function(){
'use strict';
const FONT='"HSerif","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif';
const IVORY='#F4EDDF', GOLD='#E2AA42', GOLD_HI='#FFD062', PALE='#FFE9B8', DIM='rgba(244,237,223,0.62)', RED='#E86A58', GREEN='#4FD198', BLUE='#6AA9FF', ICE='#7CE8FF';

const SCENES=['开场','裸奔风险','光学隔离舱','舱内防爆与断网','物理审批钥匙','纵深防御'];
const S=(id,scene,dur,hint)=>({id,scene,dur,hint});
const STEPS=[
  S('title',0,2500,''),
  S('naked',1,2200,'当 Agent 拥有终端（Bash）与文件读写权，直接在你的{真实宿主机}上运行'),
  S('blast_host',1,2600,'一旦触发幻觉或{提示词注入}，一条误删/泄密指令瞬间击穿本机核心资产！'),
  S('drop_box',2,2600,'安全防线 ①：降下{防爆光学隔离舱 (Sandbox)}——将 Agent 关进独立容器/微虚拟机'),
  S('least_priv',2,2500,'安全防线 ②：{最小权限挂载}——仅通过气闸放行「当前案件目录」，其余文件彻底隐身'),
  S('contain',3,2600,'即使舱内跑出毁灭性脚本，冲击波也被{防爆舱壁完全吸收}，宿主机毫发无损、毫秒级重置'),
  S('egress',3,2500,'{零信任网络出口 (Egress)}：试图把机密发往未知外网？出口防火墙直接截断红光'),
  S('need_real',4,2400,'但真正干活终究要触碰现实世界：发邮件给客户、推送代码、覆盖正式文件……'),
  S('hitl_pause',4,2600,'安全防线 ③：{高危动作强制冻结}——不可逆操作在气闸门前亮红暂停，等待人类复核'),
  S('hitl_key',4,2800,'人类核对参数无误，插入{金色物理审批钥匙 (Human-in-the-Loop)}，闸门转绿放行'),
  S('overview',5,2600,'拉远看纵深防御：{隔离舱}防误伤 · {最小权限}防越界 · {审批钥匙}防不可逆'),
  S('final',5,2600,''),
];
const LAST=STEPS.length-1;
const SCENE_FIRST=SCENES.map((_,i)=>STEPS.findIndex(s=>s.scene===i));

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeCam=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;
const seg=(G,a,b)=>ease(clamp((G-a)/(b-a)));
function kf(G,pts,fn=ease){if(G<=pts[0][0])return pts[0][1];for(let i=0;i<pts.length-1;i++){if(G<=pts[i+1][0]){const a=pts[i],b=pts[i+1];return lerp(a[1],b[1],fn((G-a[0])/(b[0]-a[0])));}}return pts[pts.length-1][1];}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ==================== 画布与原版光学贴图 ==================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1920, H=1080; let view={s:1,ox:0,oy:0,dpr:1};
function resize(){
  const w=innerWidth,h=innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px';
  const s=Math.min(w/W,h/H);view={s,ox:(w-W*s)/2,oy:(h-H*s)/2,dpr};
}
addEventListener('resize',resize); resize();

const mcache=new Map();
function font(sz,wt=400){return `${wt} ${sz}px ${FONT}`;}
function measure(t,sz,wt=400){const k=t+'|'+wt;let v=mcache.get(k);if(v===undefined){ctx.font=font(100,wt);v=ctx.measureText(t).width/100;mcache.set(k,v);}return v*sz;}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function text(str,x,y,sz,col,a=1,wt=400,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.font=font(sz,wt);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(str,x,y);ctx.globalAlpha=prev;
}
function glowText(str,x,y,sz,col,a=1,wt=700,blur=0.45,al='center'){
  const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||!str)return;
  ctx.save();ctx.shadowColor=col===ICE?'rgba(124,232,255,0.65)':'rgba(255,186,60,0.6)';ctx.shadowBlur=sz*blur;text(str,x,y,sz,col,a,wt,al);ctx.restore();
}
function rich(str,x,y,sz,a=1,col=IVORY){
  if(ctx.globalAlpha*clamp(a)<=0.004||!str)return;
  const parts=[];str.split(/(\{[^}]*\})/).forEach(s=>{if(!s)return;if(s[0]==='{')parts.push([s.slice(1,-1),1]);else parts.push([s,0]);});
  let tw=0;parts.forEach(p=>{p[2]=measure(p[0],sz,p[1]?700:400);tw+=p[2];});let x0=x-tw/2;
  parts.forEach(p=>{if(p[1])glowText(p[0],x0,y,sz,GOLD_HI,a,700,0.45,'left');else text(p[0],x0,y,sz,col,a,400,'left');x0+=p[2];});
}
function brandMark(x,y,sz,a=1){
  if(ctx.globalAlpha*clamp(a)<=0.004)return;
  const s1='陈石律师',s2='  ·  ',s3='chenshi.ai';
  const w1=measure(s1,sz*0.8),w2=measure(s2,sz*0.8),w3=measure(s3,sz,700),tw=w1+w2+w3;let x0=x-tw/2;
  text(s1,x0,y,sz*0.8,IVORY,a*0.78,400,'left');x0+=w1;text(s2,x0,y,sz*0.8,GOLD,a*0.8,400,'left');x0+=w2;glowText(s3,x0,y,sz,GOLD_HI,a,700,0.3,'left');
}

function mkSprite(stops){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const SPR_HALO=mkSprite([[0,'rgba(255,228,170,0.9)'],[0.14,'rgba(255,196,96,0.52)'],[1,'rgba(200,120,30,0)']]);
const SPR_CORE=mkSprite([[0,'rgba(255,250,235,1)'],[0.25,'rgba(255,226,160,0.9)'],[1,'rgba(255,170,60,0)']]);
const SPR_RED =mkSprite([[0,'rgba(255,195,185,0.92)'],[0.2,'rgba(232,106,88,0.5)'],[1,'rgba(180,40,30,0)']]);
const SPR_GRN =mkSprite([[0,'rgba(180,255,220,0.92)'],[0.2,'rgba(79,209,152,0.5)'],[1,'rgba(20,120,80,0)']]);
const SPR_ICE =mkSprite([[0,'rgba(210,248,255,0.95)'],[0.2,'rgba(124,232,255,0.52)'],[1,'rgba(40,140,200,0)']]);
function glow(x,y,r,a=1,spr=SPR_HALO){const eff=ctx.globalAlpha*clamp(a);if(eff<=0.004||r<=0.5)return;const prev=ctx.globalAlpha;ctx.globalAlpha=eff;ctx.drawImage(spr,x-r,y-r,2*r,2*r);ctx.globalAlpha=prev;}
function core(x,y,r,a=1){glow(x,y,r,a,SPR_CORE);}

const DUST=(()=>{const r=mulberry(2037);return Array.from({length:60},()=>({x:r(),y:r(),vx:(r()-0.5)*0.004,vy:-0.003-r()*0.006,r:1.2+r()*2.5,a:0.1+r()*0.22,ph:r()*6.28}));})();

// 宿主机左侧资产（3 项：仅第 2 项案件目录允许挂载，其余完全隔离）
const HOST_ASSETS=[
  {t:'财务密钥 & API Key', sub:'~/.ssh · .env',       y:330, allow:false},
  {t:'案件 A 工作目录',     sub:'/workspace/case_A',   y:540, allow:true},
  {t:'全所客户机密库',      sub:'/Documents/Clients',  y:750, allow:false},
];

// 绘制金色物理审批钥匙图标
function drawKey(x,y,scale,rot,a){
  if(a<=0.01)return;
  ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(scale,scale);
  ctx.globalCompositeOperation='lighter';glow(0,0,58,0.65);ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle=GOLD_HI;ctx.lineWidth=3.5;ctx.fillStyle='rgba(36,26,10,0.9)';
  ctx.beginPath();ctx.arc(-22,0,16,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(34,0);ctx.moveTo(18,0);ctx.lineTo(18,12);ctx.moveTo(28,0);ctx.lineTo(28,15);ctx.stroke();
  ctx.restore();
}

/* ============================== 主渲染 ============================== */
function render(G,amb){
  const {s,ox,oy,dpr}=view;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(s*dpr,0,0,s*dpr,ox*dpr,oy*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  ctx.fillStyle='#030304';ctx.fillRect(0,0,W,H);

  // 背景精密网格 + 暖光 + 金尘
  ctx.strokeStyle='rgba(226,170,66,0.022)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  const bg=ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,960);
  bg.addColorStop(0,'rgba(120,84,26,0.15)');bg.addColorStop(0.6,'rgba(24,48,68,0.06)');bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='lighter';
  DUST.forEach(d=>{const dx=((d.x+amb*d.vx)%1+1)%1*W,dy=((d.y+amb*d.vy)%1+1)%1*H;glow(dx,dy,d.r*3,d.a*(0.55+0.45*Math.sin(amb*1.4+d.ph)));});
  ctx.restore();

  /* ---------- 0. 开场标题 (0 -> 0.55) ---------- */
  const a0=1-seg(G,0.02,0.55);
  if(a0>0.005){
    const intro=clamp(amb/2.4), out=seg(G,0.02,0.55);
    const title='Sandbox 沙盒与安全边界', fs=92, tw=measure(title,fs,700);
    let x=W/2-tw/2; const rnd=mulberry(47); let ci=0;
    ctx.save();
    for(const ch of title){
      const cw=measure(ch,fs,700), ca=seg(intro,0.06+ci*0.026,0.34+ci*0.026);
      const dx=(rnd()-0.5)*220*out, dy=-(35+rnd()*140)*out;
      glowText(ch,x+cw/2+dx,445+(1-ca)*24+dy,fs,PALE,ca*(1-out),700,0.35);
      x+=cw; ci++;
    }
    const lw=840*seg(intro,0.28,0.82)*(1-out);
    ctx.globalCompositeOperation='lighter';
    const lg=ctx.createLinearGradient(W/2-lw/2,0,W/2+lw/2,0);lg.addColorStop(0,'rgba(124,232,255,0)');lg.addColorStop(0.5,`rgba(124,232,255,${0.95*(1-out)})`);lg.addColorStop(1,'rgba(124,232,255,0)');
    ctx.fillStyle=lg;ctx.fillRect(W/2-lw/2,540,lw,2);glow(W/2,541,60,0.7*(1-out),SPR_ICE);ctx.globalCompositeOperation='source-over';
    rich('{防爆光学隔离舱} · {最小权限气闸} · {物理审批钥匙}',W/2,605,31,seg(intro,0.55,1)*(1-out),DIM);
    brandMark(W/2,870,28,seg(intro,0.7,1)*(1-out));
    ctx.restore();
  }

  /* ---------- 1~5. 连续摄影机舞台 (G >= 0.45) ---------- */
  const worldA=seg(G,0.45,1.0);
  if(worldA>0.005){
    // 五次方运镜：Step 8-9 推近右侧审批气闸，Step 10 拉远看三层纵深防御全景
    const camX = kf(G,[[1,960],[6,960],[8,1280],[9,1280],[10,960],[11,960]], easeCam);
    const camY = kf(G,[[1,540],[6,540],[8,540],[9,540],[10,540],[11,540]], easeCam);
    const camZ = kf(G,[[1,1.0],[6,1.0],[8,1.22],[9,1.22],[10,0.95],[11,0.94]], easeCam);

    const pBlastHost = seg(G,1.2,2.0)*(1-seg(G,2.4,3.0)); // 裸奔爆炸波及宿主机
    const pDropBox   = seg(G,2.3,3.0);                    // 降下防爆光学隔离舱
    const pLeast     = seg(G,3.2,4.0);                    // 最小权限气闸挂载
    const pContain   = seg(G,4.2,5.0)*(1-seg(G,5.4,6.0)); // 舱内试爆被吸收
    const pEgress    = seg(G,5.3,6.0)*(1-seg(G,6.4,7.0)); // 外网泄密被拦截
    const pNeedReal  = seg(G,6.3,7.0);                    // 右侧现实世界目标显现
    const pPause     = seg(G,7.2,8.0);                    // 高危动作在气闸前冻结
    const pKey       = seg(G,8.2,9.0);                    // 插入物理审批钥匙放行
    const pOver      = seg(G,9.3,10.0);                   // 三层防线标注
    const pFin       = seg(G,10.4,11.0);

    ctx.save();ctx.globalAlpha=worldA;
    ctx.translate(W/2,H/2);ctx.scale(camZ,camZ);ctx.translate(-camX,-camY);

    const agX=960, agY=540;
    const boxX=680, boxY=245, boxW=560, boxH=590;
    const shakeHost = pBlastHost>0.2 ? Math.sin(amb*42)*8*pBlastHost : 0;

    // 1. 左侧：真实宿主机资产区
    ctx.save();ctx.translate(shakeHost,0);
    rr(110,225,380,630,14);ctx.fillStyle='rgba(20,16,10,0.75)';ctx.fill();
    ctx.strokeStyle=pBlastHost>0.3?RED:'rgba(226,170,66,0.45)';ctx.lineWidth=1.8;ctx.stroke();
    text('真实宿主机 (Host OS)',300,262,19,pBlastHost>0.3?RED:GOLD_HI,1,700);

    HOST_ASSETS.forEach(as=>{
      const dimHidden = (!as.allow && pLeast>0.1);
      const isHit = (pBlastHost>0.3);
      ctx.save();ctx.globalAlpha *= dimHidden ? (1 - pLeast*0.65) : 1;
      rr(145,as.y-46,310,92,9);
      ctx.fillStyle=isHit?'rgba(95,22,18,0.78)':(as.allow&&pLeast>0.3?'rgba(14,56,42,0.72)':'rgba(28,22,12,0.88)');ctx.fill();
      ctx.strokeStyle=isHit?RED:(as.allow&&pLeast>0.3?GREEN:'rgba(226,170,66,0.55)');ctx.lineWidth=1.8;ctx.stroke();
      text(as.t,300,as.y-12,19,isHit?RED:(as.allow&&pLeast>0.3?GREEN:IVORY),1,700);
      text(dimHidden?'🔒 舱外完全不可见':as.sub,300,as.y+18,14,dimHidden?DIM:PALE,0.9);
      ctx.restore();
    });

    // 裸奔时的直连光缆（Step 1-2，降下隔离舱后消失）
    if(pDropBox<0.8){
      const na=1-pDropBox*1.25;
      HOST_ASSETS.forEach(as=>{
        ctx.save();ctx.globalAlpha*=clamp(na);
        ctx.strokeStyle=pBlastHost>0.2?RED:'rgba(226,170,66,0.45)';ctx.lineWidth=pBlastHost>0.2?2.8:1.5;
        ctx.beginPath();ctx.moveTo(455,as.y);ctx.lineTo(agX-42,agY);ctx.stroke();
        ctx.restore();
      });
    }
    ctx.restore();

    // 2. 最小权限气闸通道（Step 4 起：仅放行「案件 A 目录」进入隔离舱）
    if(pLeast>0.02){
      ctx.save();ctx.globalAlpha*=pLeast;
      ctx.strokeStyle=GREEN;ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.lineDashOffset=-amb*35;
      ctx.beginPath();ctx.moveTo(455,540);ctx.lineTo(boxX,540);ctx.stroke();ctx.setLineDash([]);
      text('仅挂载单目录',568,512,16,GREEN,1,700);
      ctx.restore();
    }

    // 3. 中央核心：Agent 星核 + 爆炸冲击波
    if(pBlastHost>0.1){
      ctx.save();ctx.globalCompositeOperation='lighter';
      glow(agX,agY,420*pBlastHost,pBlastHost*0.75,SPR_RED);
      glow(300,540,260*pBlastHost,pBlastHost*0.65,SPR_RED);
      ctx.restore();
      text('⚠ rm -rf / 泄密指令直击宿主机！',agX,agY+110,22,RED,pBlastHost,700);
    }
    if(pContain>0.05){
      // 舱内试爆：冲击波被死死限制在隔离舱矩形内！
      ctx.save();ctx.beginPath();rr(boxX+6,boxY+6,boxW-12,boxH-12,16);ctx.clip();
      ctx.globalCompositeOperation='lighter';
      glow(agX,agY,310*pContain,pContain*0.85,SPR_RED);
      ctx.restore();
      text('💥 舱内高危脚本试爆 → 冲击波被隔离舱壁 100% 吸收！',agX,boxY+boxH-42,17,RED,pContain,700);
    }

    ctx.save();
    ctx.globalCompositeOperation='lighter';
    glow(agX,agY,105*(1+0.07*Math.sin(amb*2)),0.65);core(agX,agY,28,0.95);
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle=GOLD_HI;ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(agX,agY,36,0,Math.PI*2);ctx.stroke();
    glowText('AI Agent',agX,agY-58,25,GOLD_HI,1,700,0.35);
    text('Bash · 代码执行 · 文件读写',agX,agY+58,15,DIM,1);
    ctx.restore();

    // 4. 防爆光学隔离舱外壳（Step 3 从上方平滑降下罩住 Agent！）
    if(pDropBox>0.01){
      const dy=lerp(-420,0,pDropBox);
      ctx.save();ctx.globalAlpha*=pDropBox;ctx.translate(0,dy);
      const g=ctx.createLinearGradient(boxX,boxY,boxX+boxW,boxY+boxH);
      g.addColorStop(0,'rgba(124,232,255,0.11)');g.addColorStop(0.5,'rgba(20,42,64,0.06)');g.addColorStop(1,'rgba(124,232,255,0.14)');
      rr(boxX,boxY,boxW,boxH,18);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle=pContain>0.2?RED:ICE;ctx.lineWidth=3;ctx.stroke();
      // 内层细框体现防爆玻璃厚度
      rr(boxX+8,boxY+8,boxW-16,boxH-16,12);ctx.strokeStyle='rgba(124,232,255,0.35)';ctx.lineWidth=1;ctx.stroke();
      glowText('Sandbox · 防爆光学隔离舱',agX,boxY+34,21,ICE,1,700,0.35);
      ctx.restore();
    }

    // 5. 外网泄密拦截演示（Step 6）
    if(pEgress>0.02){
      ctx.save();ctx.globalAlpha*=pEgress;
      // 从 Agent 向上/右上射向“未知外网”的红色光束，撞在隔离舱右壁反弹
      ctx.strokeStyle=RED;ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.lineDashOffset=-amb*40;
      ctx.beginPath();ctx.moveTo(agX+38,agY-20);ctx.lineTo(boxX+boxW-6,355);ctx.stroke();ctx.setLineDash([]);
      ctx.globalCompositeOperation='lighter';glow(boxX+boxW,355,48,0.9,SPR_RED);ctx.globalCompositeOperation='source-over';
      rr(1430,315,340,80,10);ctx.fillStyle='rgba(75,20,16,0.65)';ctx.fill();ctx.strokeStyle=RED;ctx.lineWidth=1.8;ctx.stroke();
      text('✕ 未知外网服务器',1600,342,19,RED,1,700);text('出口防火墙拦截 · 禁止外传',1600,372,14,IVORY,0.9);
      ctx.restore();
    }

    // 6. 右侧：现实世界高危目标 + 物理审批钥匙闸门（Step 7-9）
    if(pNeedReal>0.02){
      const gateX=1345, targetX=1620;
      ctx.save();ctx.globalAlpha*=pNeedReal;
      // 现实世界目标卡
      rr(targetX-165,455,330,170,12);ctx.fillStyle='rgba(28,22,11,0.9)';ctx.fill();
      ctx.strokeStyle=pKey>0.6?GREEN:GOLD;ctx.lineWidth=2;ctx.stroke();
      text('现实世界不可逆操作',targetX,498,19,pKey>0.6?GREEN:GOLD_HI,1,700);
      text('• 发送客户正式邮件',targetX,540,16,IVORY,0.92);
      text('• 覆盖/删除正式合同',targetX,575,16,IVORY,0.92);

      // 从 Agent 射向气闸门的高危请求光束
      if(pPause>0.02){
        const beamCol=pKey>0.6?GREEN:RED;
        const endX=pKey>0.6?lerp(gateX,targetX-168,seg(pKey,0.5,1)):gateX-26;
        ctx.strokeStyle=beamCol;ctx.lineWidth=3.2;
        ctx.beginPath();ctx.moveTo(agX+38,agY);ctx.lineTo(endX,agY);ctx.stroke();

        // 审批气闸门
        const gateCol=pKey>0.6?GREEN:RED;
        rr(gateX-26,470,52,140,10);ctx.fillStyle=pKey>0.6?'rgba(14,62,42,0.88)':'rgba(85,20,16,0.88)';ctx.fill();
        ctx.strokeStyle=gateCol;ctx.lineWidth=2.6;ctx.stroke();
        ctx.globalCompositeOperation='lighter';glow(gateX,540,68,0.6,pKey>0.6?SPR_GRN:SPR_RED);ctx.globalCompositeOperation='source-over';
        text(pKey>0.6?'已解锁':'冻结中',gateX,444,17,gateCol,1,700);
        text('审批闸门',gateX,638,16,DIM,1,700);

        // 金色物理审批钥匙从上方飞入插进闸门并旋转解锁！（Step 9）
        if(pKey>0.02){
          const ky=lerp(330,540,clamp(pKey*1.4));
          const krot=lerp(-0.4,0,clamp((pKey-0.5)*2));
          drawKey(gateX,ky,1.0,krot,pKey);
          if(pKey>0.55) text('✓ 人类已复核批准 (Approve)',gateX,375,18,GREEN,seg(pKey,0.55,1),700);
        }
      }
      ctx.restore();
    }

    // 7. 底部纵深防御三层总结（Step 10）
    if(pOver>0.02 && pFin<0.8){
      ctx.save();ctx.globalAlpha*=pOver*(1-pFin*1.25);
      rr(W/2-540,895,1080,74,10);ctx.fillStyle='rgba(16,14,8,0.92)';ctx.fill();ctx.strokeStyle=GOLD_HI;ctx.lineWidth=1.8;ctx.stroke();
      rich('纵深防御三原则：{隔离舱}防误伤   ·   {最小权限}防越界   ·   {审批钥匙}防不可逆',W/2,932,20,1,IVORY);
      ctx.restore();
    }

    ctx.restore(); // 结束摄影机变换
  }

  /* ---------- 终局收束落版 (Step 11) ---------- */
  const finA=seg(G,10.4,11.0);
  if(finA>0.01){
    ctx.save();ctx.globalAlpha=finA;
    rich('给 Agent 足够大的{沙盒}去自由探索，把不可逆的{钥匙}死死握在人类手里',W/2,92,32,1,IVORY);
    brandMark(W/2,965,26,1);
    ctx.restore();
  }

  // 电影暗角
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.38,W/2,H/2,W*0.66);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

  /* ---------- 顶部引导语（先退后进，零叠字） & 进度 ---------- */
  const lo=Math.floor(G), hi=Math.min(LAST,Math.ceil(G)), f=G-lo;
  const ha=STEPS[lo].hint, hb=STEPS[hi].hint;
  if(ha===hb) rich(ha,W/2,92,33,0.95);
  else {
    const aOut=1-ease(clamp(f/0.38)), aIn=ease(clamp((f-0.5)/0.42));
    if(aOut>0.01) rich(ha,W/2,92-(1-aOut)*10,33,0.95*aOut);
    if(aIn>0.01) rich(hb,W/2,92+(1-aIn)*10,33,0.95*aIn);
  }
  const st=STEPS[Math.round(G)];
  text(`${String(st.scene).padStart(2,'0')} · ${SCENES[st.scene]}    ${Math.round(G)+1} / ${STEPS.length}`,1860,1025,18,'rgba(244,237,223,0.52)',1,400,'right');
  ctx.fillStyle='rgba(244,237,223,0.16)';ctx.fillRect(1620,1044,240,2);
  ctx.fillStyle=GOLD;ctx.fillRect(1620,1044,240*G/LAST,2);
  ctx.restore();
}

/* ==================== 交互与播控 ==================== */
let G=0, target=0, anim=null, auto=false; const t0=performance.now();
const dock=document.getElementById('dock');
SCENES.forEach((name,idx)=>{
  const b=document.createElement('button');b.className='sbtn';b.textContent=`${String(idx).padStart(2,'0')} ${name}`;
  b.addEventListener('pointerdown',e=>e.stopPropagation());
  b.addEventListener('pointerup',e=>{e.stopPropagation();go(SCENE_FIRST[idx]);});
  dock.appendChild(b);
});
function syncDock(){const sc=STEPS[Math.round(target)].scene;dock.querySelectorAll('.sbtn').forEach((b,i)=>b.classList.toggle('active',i===sc));}
function go(i){
  i=clamp(Math.round(i),0,LAST);if(i===target&&!anim)return;
  const from=G, fwd=i===Math.round(target)+1&&i>from;
  target=i;anim={from,to:i,start:performance.now(),dur:fwd?STEPS[i].dur:Math.min(850,350+Math.abs(i-from)*60),linear:fwd};syncDock();
}
function next(){go(target+1);} function prev(){go(target-1);}
function tick(now){
  if(anim){
    const p=clamp((now-anim.start)/anim.dur);
    G=anim.linear?lerp(anim.from,anim.to,p):lerp(anim.from,anim.to,ease(p));
    if(p>=1){G=anim.to;anim=null;if(auto&&G<LAST)setTimeout(()=>auto&&go(target+1),700);}
  }
  render(G,(now-t0)/1000);requestAnimationFrame(tick);
}
let idleTimer=null;
function wake(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>document.body.classList.add('idle'),3200);}
['mousemove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wake)); wake();

const autoBtn=document.getElementById('autoBtn'), cleanBtn=document.getElementById('cleanBtn'), fsBtn=document.getElementById('fsBtn');
function toggleAuto(){auto=!auto;autoBtn.classList.toggle('on',auto);autoBtn.textContent=auto?'自动中':'自动 A';if(auto)next();}
function toggleClean(){document.body.classList.toggle('clean');}
function toggleFS(){const d=document,el=d.documentElement;if(!d.fullscreenElement)el.requestFullscreen?.();else d.exitFullscreen?.();}
[autoBtn,cleanBtn,fsBtn].forEach(b=>b.addEventListener('pointerdown',e=>e.stopPropagation()));
autoBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleAuto();});
cleanBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleClean();});
fsBtn.addEventListener('pointerup',e=>{e.stopPropagation();toggleFS();});

addEventListener('keydown',e=>{
  if(e.target.id==='lesson-back')return;

  const k=e.key;
  if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(k)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();prev();}
  else if(k==='Home')go(0); else if(k==='End')go(LAST);
  else if(k==='f'||k==='F')toggleFS();
  else if(k==='a'||k==='A')toggleAuto();
  else if(k==='h'||k==='H')toggleClean();
});
let pd=null;
cv.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,b:e.button};});
cv.addEventListener('pointerup',e=>{if(!pd)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y,b=pd.b;pd=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev();return;}
  if(Math.abs(dx)<14&&Math.abs(dy)<14){if(b===2)prev();else e.shiftKey?prev():next();}});
cv.addEventListener('contextmenu',e=>{e.preventDefault();prev();});

syncDock(); requestAnimationFrame(tick);
})();
</script></body></html>
