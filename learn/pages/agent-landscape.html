function stEmbodied(o,a,f,amb){const ins=[['摄像头画面',-380,-260],['语音指令「把文件夹放进柜子」',-380,-150]];ins.forEach(([t,dx,dy])=>{block(o.x+dx-60,o.y+dy-30,420,60,{style:'dim',a});text(t,o.x+dx+150,o.y+dy,19,IVORY,a,400);});
