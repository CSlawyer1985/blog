ion_applicability":[]},{"id":"spc-overseas-chinese-trade-qingtian","title":"浙江青田：跨境买卖质量分歧如何进入专业调解","published":"2026-11-23","issuer":"最高人民法院、中国侨联","kind":"典型案例","state":"供参考","scope":"浙江丽水青田个案；所用机制不当然适用于其他地区","summary":"越南卖方向智利买方供货后，买方以产品来源、质量和认证等为由拒付余款。债权转让后，青田法院在当事人同意的基础上引入当地跨境调解机制，邀请贸促会专家协助处理质量标准分歧，最终达成协议。","practice":"在诉讼和调解前分别核对适用的质量标准、认证是否是付款条件、债权转让文件以及保证范围；本案为调解结果，不是关于质量争议的裁判规则。","source":"https://www.court.gov.cn/zixun/xiangqing/518291.html","checked":"2026-11-27","tags":{"industry":["外贸"],"region":["浙江省丽水市青田县"],"practice":["国际商事","争议解决"]},"region_ids":["331121"],"region_facts":["331121"],"region_applicability":[]},{"id":"spc-overseas-chinese-shanghai-clinical","title":"上海浦东：临床研发服务欠款和解获得司法确认","published":"2026-11-23","issuer":"最高人民法院、中国侨联","kind":"典型案例","state":"供参考","scope":"上海浦东个案","summary":"临床研发服务合同发生欠费，双方仍希望持续合作。经专业调解就付款方式和履行时间达成协议，上海浦东法院裁定调解协议有效。","practice":"把既往服务费、拟减免的违约金和后续服务里程碑分开；需要司法确认时，另核调解组织、期限和管辖条件。","source":"https://www.court.gov.cn/zixun/xiangqing/518291.html","checked":"2026-11-27","tags":{"industry":["医疗医药"],"region":["上海市浦东新区"],"practice":["合同","争议解决"]},"region_ids":["310115"],"region_facts":["310115"],"region_applicability":[]},{"id":"spc-overseas-chinese-guangxi-active-seal","title":"广西龙州：国有农场执行案如何保全经营与清偿","published":"2026-11-23","issuer":"最高人民法院、中国侨联","kind":"典型案例","state":"供参考","scope":"广西崇左龙州个案","summary":"生效判决确定华侨农场对罐头厂债务承担连带清偿责任。执行法院查明资产与持续经营情况，对四处房产采取允许受监管继续使用的查封措施，在和解后债务提前付清。","practice":"若查封资产仍用于生产经营，向执行法院分别提供可供执行资产、持续经营和现实还款能力的证据；本案不是被执行人当然有权解封。","source":"https://www.court.gov.cn/zixun/xiangqing/518291.html","checked":"2026-11-27","tags":{"industry":["建工地产"],"region":["广西壮族自治区崇左市龙州县"],"practice":["保全与执行","租赁"]},"region_ids":["451423"],"region_facts":["451423"],"region_applicability":[]},{"id":"spc-overseas-chinese-anhui-preservation","title":"安徽歙县：买卖欠款调解后如何衔接保全与执行","published":"2026-11-23","issuer":"最高人民法院、中国侨联","kind":"典型案例","state":"供参考","scope":"安徽黄山歙县个案","summary":"货款对账后仍未清偿。法院依法采取保全，结合查控结果推动双方约定限期付款并暂不解除保全；调解债权最终通过扣划及自主履行兑现。","practice":"拟定调解条款时，把分期履行、未付款后果与解除保全的节点写清，避免只谈总额而未解决执行保障。","source":"https://www.court.gov.cn/zixun/xiangqing/518291.html","checked":"2026-11-27","tags":{"industry":["制造业"],"region":["安徽省黄山市歙县"],"practice":["保全与执行","争议解决"]},"region_ids":["341021"],"region_facts":["341021"],"region_applicability":[]},{"id":"trusted-data-pilot-phase-two","title":"第二批可信数据空间试点启动申报","published":"2026-11-18","deadline":"2026-12-11","checked":"2026-11-27","issuer":"国家数据局综合司","kind":"试点申报","state":"申报窗口","scope":"符合通知要求的试点申请；不构成全国普遍义务","summary":"通知公开组织第二批可信数据空间试点，分别面向企业、行业与城市方向。12 月 11 日是推荐单位完成相应报送的截止日，通知不等于所有企业均可直接申报。","practice":"先核主体条件、推荐渠道和所需材料；参与多方数据项目时，另核供数授权、处理目的与成果分配。","source":"https://www.nda.gov.cn/sjj/zwgk/tzgg/1118/20261118203149832876736_mobile.html","tags":{"industry":["科技数据"],"region":["试点范围"],"practice":["数据合规","行政监管"]},"region_ids":[],"region_applicability":[],"region_facts":[]},{"id":"spc-refusal-to-enforce-2026","title":"两高一部发布拒执案例：未报告财产不等于成立犯罪","published":"2026-11-18","issuer":"最高人民法院、最高人民检察院、公安部","kind":"典型案例","state":"供参考","scope":"全国参阅；不替代刑法与司法解释","summary":"案例涉及借关联主体转移资产以及通过虚假交易套取查控房票资金等。发布机关另提示，不宜根据未报告财产单一情形简单入罪，须和正常经营活动区分。","practice":"申请执行人整理财产线索时，把履行能力、执行告知、交易证据和裁判无法执行的原因串成时间线；将普通迟延与拒执行为区分。","source":"https://www.court.gov.cn/zixun/xiangqing/517871.html","checked":"2026-11-27","tags":{"industry":["多行业"],"region":["全国"],"practice":["保全与执行","刑事"]},"region_ids":["CN"],"region_facts":[],"region_applicability":[]},{"id":"npc-procuratorial-public-interest-law","title":"检察公益诉讼法公布，2027 年起施行","published":"2026-11-06","issuer":"全国人大常委会","kind":"法律","state":"待施行","scope":"全国；检察机关办理及法院审理该类案件","summary":"法律统一规范检察机关办理公益诉讼案件及人民法院审理相关案件；本法未规定时，依民事诉讼法、行政诉讼法等处理。主席令第八十六号确定自 2027 年 1 月 1 日施行。","practice":"企业接到公益诉讼相关通知时，将行政纠正、民事责任、证据保全及整改记录分开管理，先核案件所处程序及适用时点。","source":"https://nx.jcy.gov.cn/QJCY/njttxw/202611/t20261109_1173449.html","checked":"2026-11-27","tags":{"industry":["多行业"],"region":["全国"],"practice":["公益诉讼","行政合规"]},"region_ids":["CN"],"region_facts":[],"region_applicability":[],"effective":"2027-01-01"},{"id":"npc-anti-cross-border-corruption-law","title":"反跨境腐败法自公布之日起施行","published":"2026-11-06","issuer":"全国人大常委会","kind":"法律","state":"现行","scope":"全国；跨境腐败事项按法定适用范围处理","summary":"法律建立跨境腐败案件办理与国际合作制度，并设置廉洁合规专章。对境外调查与取证、相关合规义务及反制等应分别判断。","practice":"境外项目排查优先覆盖代理商、顾问费和分包付款。收到外国执法机构索取境内材料的请求时，不以合同承诺代替对取证和数据出境规则的审核。","source":"https://www.ccdi.gov.cn/toutiaon/202611/t20261106_521133.html","checked":"2026-11-27","tags":{"industry":["外贸","投融资"],"region":["全国"],"practice":["合规","跨境投资"]},"region_ids":["CN"],"region_facts":[],"region_applicability":["CN"],"effective":"2026-11-06"},{"id":"npc-20261106-spc-01","title":"党广锁｜任命 最高人民法院 第五巡回法庭庭长","published":"2026-11-06","decision_date":"2026-11-06","issuer":"全国人大常委会","kind":"司法任免","state":"正式公告","scope":"全国","summary":"党广锁：任命 最高人民法院 · 第五巡回法庭庭长。","practice":"","source":"https://www.court.gov.cn/zixun/xiangqing/516471.html","region_ids":["CN"],"region_facts":["CN"],"region_applicability":[],"tags":{"industry":["司法机关"],"region":["全国"],"practice":["司法任免"]},"person":"党广锁","agency":"最高人民法院","notice_id":"npc-20261106-spc","notice_order":1,"actions":[{"action":"任命","agency":"最高人民法院","roles":["第五巡回法庭庭长"]}]},{"id":"npc-20261106-spc-02","title":"陈宜芳｜免去 最高人民法院 审判委员会委员等","published":"2026-11-06","decision_date":"2026-11-06","issuer":"全国人大常委会","kind":"司法任免","state":"正式公告","scope":"全国","summary":"陈宜芳：免去 最高人民法院 · 审判委员会委员、民事审判第一庭庭长、审判员。","practice":"","source":"https://www.court.gov.cn/zixun/xiangqing/516471.html","region_ids":["CN"],"region_facts":["CN"],"region_applicability":[],"tags":{"industry":["司法机关"],"region":["全国"],"practice":["司法任免"]},"person":"陈宜芳","agency":"最高人民法院","notice_id":"npc-20261106-spc","notice_order":2,"actions":[{"action":"免去","agency":"最高人民法院","roles":["审判委员会委员","民事审判第一庭庭长","审判员"]}]},{"id":"npc-20261106-spc-03","title":"杨永清｜任命 最高人民法院 民事审判第一庭庭长等","published":"2026-11-06","decision_date":"2026-11-06","issuer":"全国人大常委会","kind":"司法任免","state":"正式公告","scope":"全国","summary":"杨永清：任命 最高人民法院 备租赁单位纳入检查范围；合同分工不能替代法定责任。","source":"https://www.caac.gov.cn/XXGK/XXGK/MHGZ/202611/t20261124_232124.html","checked":"2026-11-27","tags":{"industry":["建工地产","交通运输"],"region":["全国"],"practice":["工程履约","安全生产"]},"region_ids":["CN"],"region_facts":[],"region_applicability":[],"effective":"2027-01-01"},{"id":"fadanwang-39-company-certificates","published":"2026-10-29","issuer":"最高人民法院网站｜法答网精选答问","kind":"司法答问","state":"研究参考","title":"法答网：公司证照返还纠纷，先看是否涉及控制权","scope":"公开精选答问，供参考，不是司法解释","source":"https://www.court.gov.cn/zixun/xiangqing/515511.html","region_ids":[],"summary":"答疑意见区分公司内部治理纠纷和外部人员占有证照的侵权纠纷；债权人基于合同占有证照的情形，则另按请求基础判断。","practice":"准备管辖意见时先查占有人身份、证照交付依据、是否争夺控制权，并回看起诉请求及相应程序规则。","tags":{"industry":["通用"],"region":["研究参考"],"practice":["公司治理","争议解决"]}},{"id":"ningbo-eldercare-fund-consultation","title":"宁波养老服务专项资金管理办法征求意见窗口已结束","published":"2026-10-23","deadline":"2026-11-03","checked":"2026-11-27","issuer":"宁波市政府公开征集平台","kind":"征求意见稿","state":"征求意见已截止","scope":"拟适用于宁波；公开征求意见文本不具有正式效力","summary":"公开草案拟规范宁波市养老服务体系建设专项资金的管理和使用。该公告所列意见征集已结束，不能据此判断正式办法已发布。","practice":"办理专项资金申请时查正式文件、有效期和具体资金项目，不用草案判断申领条件。","source":"https://app.ningbo.gov.cn/jact/front/mailpubdetail.do?sysid=63&transactId=54507","tags":{"industry":["养老服务"],"region":["宁波"],"practice":["行政监管","财政资金"]},"region_ids":["330200"],"region_applicability":[],"region_facts":["330200"]},{"id":"nb-weather-disaster-ancient-tree-amendment","title":"宁波更新气象灾害防御与古树名木保护规则","published":"2026-10-15","issuer":"宁波市人大常委会","kind":"地方性法规","state":"现行","scope":"宁波；按项目所在地和保护对象分别核对","summary":"两件地方性法规作出修改，气象灾害防御条例强化易发区域预案、临灾预警联动与防雷检测；古树名木保护规定与新上位规则衔接。","practice":"临港或易涝建设项目，应明确预警接收和停复工责任；涉及受保护树木时，将保护现状和施工限制纳入设计、招采和履约审查。","source":"https://www.nbrd.gov.cn/col/col1229572023/art/2026/art_2926570d44f24abc9e818968a96e2b2b.html","checked":"2026-11-27","tags":{"industry":["建工地产","生态环境"],"region":["浙江省宁波市"],"practice":["工程履约","行政合规"]},"region_ids":["330200"],"region_facts":["330200"],"region_applicability":["330200"]},{"id":"nb-ten-local-regulations-environment-2026","title":"宁波修改十件地方性法规，涉及水污染、港口和城市管理","published":"2026-10-15","issuer":"宁波市人大常委会","kind":"地方性法规","state":"现行","scope":"宁波；部分规则另有流域、港区等空间边界","summary":"公布决定衔接生态环境法典等上位规则，调整余姚江突发水污染应急与报告、象山港入海排污口管理等要求。市人大官网 10 月 16 日公开，公告落款 10 月 15 日。","practice":"沿江、临港项目分别核对流域边界和保护区位置，再决定是否需要专项论证、备案以及事故报告责任安排。","source":"https://www.nbrd.gov.cn/col/col1229572023/art/2026/art_2eb227d7eb7e41a3a7dc607d81772142.html","checked":"2026-11-27","tags":{"industry":["建工地产","生态环境"],"region":["浙江省宁波市"],"practice":["建设审批","环境合规"]},"region_ids":["330200"],"region_facts":["330200"],"region_applicability":["330200"]},{"id":"spc-civil-criminal-intersection-2026","title":"民刑交叉司法解释：涉及犯罪不必然中止民事诉讼","published":"2026-09-21","issuer":"最高人民法院","kind":"司法解释","state":"现行","scope":"全国；特殊法律、行政法规另有规定时先适用其规定","summary":"法释〔2026〕19 号区分刑事与民事事实、责任和程序关系，并规范刑事材料在民事程序的使用。依法不予追究刑责也不当然排除民事责任。","practice":"先问民事请求能否依据独立证据和事实审理，再决定是否申请中止；刑事程序材料作为民事证据使用时注意质证与证明范围。","source":"https://www.court.gov.cn/fabu/xiangqing/512441.html","checked":"2026-11-27","tags":{"industry":["多行业"],"region":["全国"],"practice":["争议解决","刑事"]},"region_ids":["CN"],"region_facts":[],"region_applicability":["CN"],"effective":"2026-09-22"},{"id":"nb-rd-20260903-court-chang-xiaoli","title":"常晓莉｜任命 宁波高新技术产业开发区人民法院审判委员会委员、审判员","published":"2026-09-03","issuer":"宁波市人大常委会","kind":"司法任免","state":"正式公告","scope":"宁波市","summary":"常晓莉：任命宁波高新技术产业开发区人民法院审判委员会委员、审判员职务。","practice":"","source":"https://www.nbrd.gov.cn/col/col1229576444/art/2026/art_688def4d901c43a2931f686f5ca0ef1f.html","region_ids":["330200"],"tags":{"industry":["司法机关"],"region":["宁波市"],"practice":["司法任免"]},"person":"常晓莉","agency":"宁波高新技术产业开发区人民法院","decision_date":"2026-09-02","notice_id":"nb-rd-20260903-court","notice_order":0,"actions":[{"action":"任命","agency":"宁波高新技术产业开发区人民法院","roles":["审判委员会委员","审判员"]}],"region_facts":["330200"],"region_applicability":[]},{"id":"nb-rd-20260903-court-li-nan","title":"李楠｜任命 宁波高新技术产业开发区人民法院综合审判第一庭副庭长、审判员","published":"2026-09-03","issuer":"
